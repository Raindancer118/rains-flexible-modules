# Rain's Flexible Modules — cosmetics.
#
# Offered to the server's Messages as a floor: whatever the owner has written for a key wins. Reword a
# line in the server's own messages.yml, not here. Every value is quoted — YAML reads a bare on/off/yes/no
# as a boolean, and a message that became one prints its own key.
cosmetics:

  no-permission: "<red>You may not do that."

  only-a-player: "<red>This command can only be used by a player."

  usage: "<gray>Use <white>/cosmetics</white> for the menu, <white>/cosmetics name preset|set|reset</white>, <white>/cosmetics particle</white>, <white>/cosmetics teleport</white> or <white>/cosmetics clear</white>."

  reloaded: "<green>Reloaded. <white><colours></white> palette colour(s), <white><presets></white> preset(s)."

  unknown-player: "<red>Nobody called <white><player></white> has played here. Check the spelling."
  selector-refused: "<red><white><selector></white> is not yours to use, or not written right. A name works just as well."
  selector-nobody: "<yellow><white><selector></white> did not match anybody, so nothing was touched."

  unknown-preset: "<red>There is no preset called <white><preset></white>. <gray>Tab shows the ones there are."

  not-a-style: "<red><detail>"

  name:
    set: "<green>Your name is now <name><green>."
    cleared: "<green>Your name is plain again."
    not-saved: "<red>That style could not be saved — it has too many colours."
    reset-other: "<green><white><player></white>'s name is plain again."
    reset-by-staff: "<yellow>A staff member took your name style off."
    dropped: "<yellow>Your name style needed a permission you no longer have, so your name is plain again."

  clear:
    usage: "<gray>Use <white>/cosmetics clear [name|particles|all] [player]</white>. Leave the player out to tidy up yourself."
    not-allowed: "<red>You may not clear your own cosmetics."
    not-allowed-others: "<red>Clearing somebody else's cosmetics is staff business."
    nothing: "<gray>There is nothing to clear — <white><player></white> is already plain."
    offline-particles: "<red><white><player></white> is not online, and a particle only comes off while its owner is here. Their name style can be cleared, though."
    offline-particles-note: "<gray><white><player></white>'s particle is still on — it can only come off while they are online."
    done: "<green>Cleared your <white><what></white>. Fresh as a daisy."
    done-other: "<green>Cleared <white><player></white>'s <white><what></white>. They have been told."
    by-staff: "<yellow>A staff member cleared your <white><what></white>."

  particle:
    set: "<green>You are wearing <white><particle></white> now."
    cleared: "<green>No more sparkles. Very understated."
    shaped: "<green>It is drawn <white><shape></white> now."
    coloured: "<green>Its colour is changed."
    gradient-set: "<green>It now blends into that colour along its shape."
    gradient-off: "<green>One colour again."
    densified: "<green>Density: <white><density></white>. Sparkle responsibly."
    unknown-density: "<red>Densities are <white>light</white>, <white>normal</white>, <white>dense</white> and <white>very_dense</white>."
    sped: "<green>Speed: <white><speed></white>. Zoom zoom — or not, your call."
    unknown-speed: "<red>Speeds are <white>slow</white>, <white>normal</white>, <white>fast</white> and <white>very_fast</white>."
    unknown-shape: "<red>The shapes are <white>ambient</white>, <white>aura</white>, <white>halo</white>, <white>trail</white> and <white>spiral</white>."
    none-worn: "<red>You are not wearing a particle yet. Pick one first."
    dropped: "<yellow>Your particle is not allowed any more, so it is taken off."

  preview:
    nametag: "<gray>That is your nametag as everybody sees it. <white>/cosmetics</white> to go back."
    nametag-off: "<gray>That is your name with its style. <yellow>Styled nametags are switched off here, so over your head it shows plain."
    particle: "<gray>That is your particle. <white>/cosmetics</white> to go back."

  refused:
    colour: "<red>You may not colour your name."
    gradient: "<red>You may not use a gradient — one colour only."
    any-colour: "<red><white><detail></white> is not in the palette, and you may only use palette colours."
    decoration: "<red>You may not make your name <white><detail></white>."
    animated: "<red>Your gradient can't flow — that option is not unlocked for you."
    too-many-stops: "<red>At most <white><detail></white> colours in one name."
    preset: "<red>The <white><preset></white> preset is not yours to wear."
    particles: "<red>You may not wear particles."
    particle-unknown: "<red><white><detail></white> is not a particle that can be worn."
    particle-blocked: "<red><white><detail></white> is not allowed here — it would cover everybody's screen."

  help:
    - "<gold><bold>Your name"
    - "<gray>Presets are ready-made styles — click one to wear it."
    - "<gray>Your own colours: one colour, or several for a gradient"
    - "<gray>that runs from the first to the last across your name."
    - "<gray>In the colour editor, the dyes switch bold, italic and the rest."
    - "<dark_gray>It shows in chat, in the player list and on your nickname."

  help-hub:
    - "<gold><bold>Cosmetics"
    - "<gray>Your name: colours, gradients and presets."
    - "<gray>Particles: a vanilla particle drawn around you."
    - "<gray>Teleports: what you sound and look like coming and going."

  help-teleport:
    - "<gold><bold>Your teleports"
    - "<gray>For every teleport on the server: homes, warps, /tpa, spawn."
    - "<gray>Pick a sound for setting off, one for each second of the countdown,"
    - "<gray>one for landing, and the particles around you while you stand still."
    - "<gray>On a part: left-click to pick, right-click for the server's own,"
    - "<gray>shift-click for nothing at all."

  # ── /cosmetics teleport, and its menu ─────────────────────────────────────
  # <part> is one of the three names below; <value> a sound or particle, as it reads.
  teleport:
    part:
      depart: "Setting-off sound"
      arrive: "Landing sound"
      wait: "Waiting particles"
      tick: "Countdown ding"
    servers: "the server's own"
    nothing: "nothing"
    set: "<green><part>: <white><value></white>."
    set-none: "<green><part>: nothing at all."
    back-to-default: "<green><part>: back to the server's own."
    usage: "<gray>Use <white>/cosmetics teleport depart|tick|wait|arrive <sound or particle></white>, or <white>default</white> or <white>none</white> instead of one."
    # Said as they join, or when the settings change, if something they had picked is no longer allowed.
    dropped: "<yellow>One of your teleport effects is no longer available to you, so it is back to the server's own."
    switched-off: "<red>Teleport effects cannot be chosen on this server."
    no-permission: "<red>You may not choose your teleport effects."
    sound-unknown: "<red>There is no sound called <white><value></white>. <gray>Tab shows the ones you can pick."
    sound-not-offered: "<red><white><value></white> is not on this server's list of teleport sounds. Everybody nearby hears it, so the list keeps the ear-splitting ones out."
    menu:
      title: "<dark_gray>Your teleports"
      breadcrumb: "Teleports"
      door: "<white>Teleports"
      door-lore: "<gray>Your sounds and particles for every teleport."
      pick: "<green><part>"
      pick-hint: "<dark_gray>Click to pick one — left-click in the list to try it."
      now: "<gray>Now: <white><value>"
      about:
        depart: "<gray>Heard where you stood as you set off."
        arrive: "<gray>Heard where you land."
        wait: "<gray>Around you while you stand still for it."
        tick: "<gray>Heard by you alone, once every second you wait."
      servers-hint: "<dark_gray>Right-click for the server's own."
      nothing-hint: "<dark_gray>Shift-click for nothing at all."
      locked: "Needs <permission>"

  help-particles:
    - "<gold><bold>Your particles"
    - "<gray>Pick a particle — left-click to see it, right-click to wear it."
    - "<gray>Then how it is drawn: around you, above your head or behind you."
    - "<gray>Dust and the tinted ones take a colour from the palette."
    - "<gray>Density sets how many are drawn — from a light dusting to a proper cloud."
    - "<gray>Speed sets how fast it moves round you."
    - "<dark_gray>Hidden while you are vanished, invisible or spectating."
