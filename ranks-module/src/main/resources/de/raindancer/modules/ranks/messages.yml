# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
ranks:
  busy: "<red>Something else is waiting for your answer. Finish that first."
  ask:
    new: "<aqua>Type the new rank's id and its tag in chat, e.g. <white>vip VIP</white>. <gray>Or <white>cancel</white>."
    tag: "<aqua>Type the tag in chat. Plain text gets brackets. <gray>Or <white>cancel</white>."
    title: "<aqua>Type the rank's title in chat. <gray>Or <white>cancel</white>."
  usage: "<gray>/rank <dark_gray>— your ranks · <gray>/rank info [player] · /rank wear <rank|none|auto> · /rank show <chat|nametag|tablist> [on|off]"
  usage-staff: "<gray>/rank give <player> <rank> · /rank take <player> <rank> · /rank list [rank] · /rank reload · /rank manage"
  usage-wear: "<gray>/rank wear <rank> <dark_gray>— one of yours · <gray>none <dark_gray>— nothing · <gray>auto <dark_gray>— your most senior"
  usage-show: "<gray>/rank show <chat|nametag|tablist> [on|off] <dark_gray>— where your rank goes in front of your name"
  unknown: "<red>There is no rank called <white><name></white>. Making one up does not count. <gray><white>/rank list</white> shows the real ones."
  never-here: "<red><white><player></white> has never been on this server."
  only-a-player: "<red>Only a player wears a rank. The console is above all that."
  not-saved: "<red>That could not be saved, so nothing changed. Staff: holders.yml cannot be read."
  choosing-off: "<red>The server decides where ranks show, not you. Bold of you to try, though."
  given: "<green><white><player></white> is <rank> <green>now."
  given-you: "<green>You are <rank> <green>now. Try not to let it go to your head — it is literally going above it."
  taken: "<gray><white><player></white> is no longer <rank><gray>."
  taken-you: "<gray>You are no longer <rank><gray>. It was nice while it lasted."
  already-holds: "<gray><white><player></white> is <rank> <gray>already. Twice would just be greedy."
  does-not-hold: "<red><white><player></white> is not <rank><red>, so there is nothing to take."
  wear: "<green>You are wearing <rank> <green>now."
  wear-none: "<gray>No rank in front of your name now. Very humble. <white>/rank wear auto</white> puts it back."
  none-yours: "<gray>You have no rank to wear. Staff hand them out — asking nicely is said to help."
  not-yours: "<red><rank> <red>is not yours to wear. Nice try."
  shown: "<green>Your rank shows here again: <white><place></white>."
  hidden: "<gray>Your rank is hidden here: <white><place></white>."
  info: "<gray><white><player></white> holds:"
  info-line: "<dark_gray>  • <rank> <gray><title>"
  info-worn: "<dark_gray>  • <rank> <gray><title> <green>(worn)"
  info-none: "<gray><white><player></white> holds no rank."
  list-line: "<rank> <dark_gray>(<id>) <gray><count>: <white><players>"
  no-ranks: "<gray>There are no ranks. ranks.yml is empty."
  reloaded: "<green>ranks.yml read: <white><count></white> rank(s)."
  usage-manage: "<gray>/rank create <id> <tag> · /rank edit <id> tag|title|weight|style|team <value> · /rank delete <id> confirm <dark_gray>— e.g. /rank create vip VIP, /rank edit vip style gold #ff5500 bold"
  managed: "<green>Done. <gray>Kept in custom-ranks.yml; ranks.yml is left as you wrote it."
  exists: "<red>There is a rank called <white><id></white> already. <gray>/rank edit changes it."
  invalid: "<red>That will not do: ids are lowercase letters, digits, - and _; a tag shows at most 20 characters and no buttons; weights run 1–99; a title at most 32 characters."
  delete-confirm: "<yellow>This deletes <white><id></white> everywhere — whoever holds it shows nothing for it. <gray>Type the same with <white>confirm</white> at the end."
  style-unreadable: "<red><problem> <gray>Colours are chat colours (gold, aqua…) or #hex codes; add bold, italic or animated."
  problem: "<red>ranks.yml: <white><problem>"
  help:
    - "<gray>Your rank goes in front of your name."
    - "<gray>The three switches say where: chat,"
    - "<gray>above your head, the tablist."
    - "<gray>Holding several? Click the one to wear."
