# Rain's Xaero's Map support — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins. See
# Messages.defineFrom. Every placeholder a line asks for is supplied where it is sent, and nothing
# here is YAML's idea of a truth value.
xaeromap:

  usage: "<gray>/xaeromap [refresh|homes|warps|status|resync]"
  only-a-player: "<red>Only a player with a map open can refresh one."
  no-permission: "<red>That part of this is for staff."

  refresh:
    done: "<green>Sent again. Your map will fill back in over the next few seconds."
    no-mod: "<yellow>Nothing on your client answered. Claims are drawn by Xaero's Minimap or World Map <white>together with Open Parties and Claims</white> — without those there is nothing here to refresh. Your per-world map has been sent again anyway."

  resync:
    done: "<green>Sent again to <white><players></white> player(s)."

  waypoints:
    off: "<red>Places as waypoints are switched off on this server."
    no-mod: "<yellow>Nothing on your client answered, so there is nowhere to put a waypoint — Xaero's Minimap or World Map is what draws them."
    none: "<yellow>You have no <kind> to put on your map."
    offering: "<green>Your <white><count></white> <kind>, one click each to add to your map:"
    partial: "<yellow>Only <white><sent></white> of <white><count></white> could be offered — the rest have names your map cannot take."

  status:
    line: "<gray>Map support: per-world maps <white><worlds></white>, claims <white><claims></white> (<source>), shown to <white><shown></white>. <white><mapped></white> claim(s) over <white><chunks></white> chunk(s). Of <white><online></white> online player(s), <white><mapmods></white> have a Xaero map mod and <white><listening></white> of those also read claims."
