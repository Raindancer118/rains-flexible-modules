# Rain's Walls and Roads — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins. See
# Messages.defineFrom.
wallsroads:

  usage: "<gray>/wallsroads wall|road new|<name>, cancel, list"
  only-a-player: "<red>Only a player standing in the world can do that."
  unknown-wall: "<red>There is no wall called <white><name></white>."
  unknown-road: "<red>There is no road called <white><name></white>."

  create:
    no-permission: "<red>You may not mark out a new wall or road here."

  selection:
    started: "<gray>Marking a new <white><purpose></white>. Right-click to add a corner, shift-right-click to finish."
    point-added: "<gray>Corner <white><count></white> added."
    point-removed: "<gray>Corner removed — <white><count></white> left."
    incomplete: "<red>Needs at least <white><needed></white> points, you have <white><have></white>."
    cancelled: "<gray>Selection cancelled."
    none: "<gray>You are not marking anything out right now."

  wall:
    created: "<green>Wall <white><name></white> created and being built."
    ask-name: "<gray>Type a new name for this wall, or 'cancel'."
    removed: "<green>Wall <white><name></white> removed."

  road:
    created: "<green>Road <white><name></white> created and being built."
    ask-name: "<gray>Type a new name for this road, or 'cancel'."
    removed: "<green>Road <white><name></white> removed."

  protected: "<red>That is part of a wall or a road somebody else built."

  gate:
    opened: "<gray>The gates of <white><wall></white> swing open."
    shut: "<gray>The gates of <white><wall></white> close."
    not-yours: "<red>The gates of <white><wall></white> are not yours to work."

  cost:
    short: "<yellow>You ran out of blocks — <white><built></white> of <white><wanted></white> placed."
    estimate: "<gray>That would take <white><blocks></white> blocks."

  sign:
    ask-lines: "<gray>Type the new wording, separating the four lines with | — or 'cancel'."
    ask-destination: "<gray>Type the name of the place this sign should point at, or 'cancel'."
    pointed: "<green>The sign now points at <white><place></white>, <white><blocks></white> blocks away."
    no-such-place: "<red>There is no place called <white><place></white> to point at."

  map:
    sent: "<gray>Sent <white><count></white> gates and road ends to your map."
    unavailable: "<red>This server has no client-map support running."

  config:
    at-the-limit: "<gray>That is as far as it goes — between <white><least></white> and <white><most></white>."
    refused: "<red>The setting <white><setting></white> would not take that value."
    not-yours: "<red>Only staff may change how this server builds walls and roads."

  outline-shown: "<gray>Showing the outline of <white><name></white>."
  outline-elsewhere: "<gray><white><name></white> is in <white><world></white>, not here."
