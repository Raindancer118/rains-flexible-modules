# Generated in shape by StandaloneDescriptor and checked by DescriptorTest — see rtp-standalone's own copy for
# why every line here matters, and for the two ways of writing this file that fail silently.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '1.21'
description: 'Huge polygonal town walls and roads that cut a real gate where they cross.'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# Nothing in the module touches Bukkit.getScheduler() — every scheduled thing goes through Core's
# Scheduling, which uses the region scheduler on Paper and the same call regionised on Folia.
folia-supported: true

dependencies:
  # Both phases, and bootstrap is not belt-and-braces — see rtp-standalone's own copy of this file for
  # the full reasoning: without it the module fails to link at bootstrap and the plugin reports that
  # it contains no modules.
  #
  # RainsExtendedClaims is optional, deliberately — a road does not have to route to a claim's
  # entrance, and this plugin works exactly as it always has with no claims plugin installed at all.
  # `load: BEFORE` still matters when it IS present: WallsRoadsModule looks claims-module's
  # ClaimServices up from Bukkit's own ServicesManager as it enables, and that lookup only finds
  # something if RainsExtendedClaims has already registered it. `join-classpath: true` matters for
  # the same reason it does for RainsCore: this module compiles against Claim/ClaimServices as a
  # `provided` dependency, and every reference to either lives inside
  # de.raindancer.modules.wallsroads.claims, touched only after that ServicesManager lookup already
  # found something real — see ClaimIntegration's own javadoc.
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
    RainsExtendedClaims:
      load: BEFORE
      required: false
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
    RainsExtendedClaims:
      load: BEFORE
      required: false
      join-classpath: true
