# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.
# A line the owner rewrote in plugins/RainsCore/messages.yml wins in both tones.

farmworlds:
  moved-out: "<yellow>The farm world is being made again, so you have been moved to spawn."
  unknown: "<red>No farm world called <white><name></white>. Check the spelling, or the list."
  not-loaded: "<yellow><name></yellow> lives in a world that is not loaded right now. Try again in a bit."
  on-cooldown: "<yellow>You can go to a farm world again in <white><time></white>."
  warming-up: "<gray>Off to <white><name></white> in <white><seconds></white>… stand still."
  arrived: "<green>Welcome to <white><name></white>'s spawn."
  arrived-wild: "<green>You are out in <white><name></white> at <white><where></white>. The way back is on foot."
  arrived-shortly-before: "<yellow>Careful: <white><name></white> is regenerated in <white><time></white>. Nothing you leave here will survive it."
  already-travelling: "<yellow>You are already on your way somewhere."
  nowhere-safe: "<red>No safe spot found in <white><name></white>. Try again, it picks a different place each time."
  could-not-check: "<red>The ground in <white><name></white> could not be checked, so you are staying here."
  teleport-refused: "<red>Something stopped you arriving in <white><name></white>."
  cannot-schedule: "<red>The server cannot send you anywhere just now. Try again in a moment."
  only-a-player: "<red>Only a player standing in the world can go to a farm world."
  cancelled:
    moved: "<yellow>You moved, so you are staying put."
    hurt: "<yellow>Something hit you, so you are staying put."
  refused:
    at-all: "<red>Farm worlds are not available to you on this server."
    this-one: "<red><white><name></white> is not one you may enter. Ask whoever hands out the ranks."
  none-yet: "<gray>This server has no farm worlds."
  making: "<gray>Making <white><name></white>. The server will pause for a moment."
  created: "<green><white><name></white> is ready: <white><count></white> world(s)."
  could-not-make: "<red><white><name></white> is on the list, but the server refused to make its worlds. The log says why."
  already-exists: "<red><white><name></white> is already a farm world."
  too-many: "<red>This server already has its <white><limit></white> farm worlds. Forget one first."
  deleted: "<green><white><name></white> and its worlds are gone."
  schedule-set: "<green><white><name></white> will be regenerated every <white><time></white>."
  not-yours: "<red>Farm worlds are not yours to change."
  bad-period: "<red><white><text></white> is not a length of time. Try <white>7d</white>, <white>2 weeks</white>, or <white>never</white>."
  bad-border: "<red><white><text></white> is not a number of blocks. Numbers only, please."
  name:
    empty: "<red>A farm world needs a name."
    too-long: "<red>That name is too long: <white><limit></white> characters at most. It has to fit on its own button."
    bad-characters: "<red>A farm world's name may have lower-case letters, digits, dashes and underscores in it, and nothing else — it becomes a folder on the disk."
    reserved: "<red><white><name></white> is a word <white>/farm</white> reads as an instruction, so no farm world can have it. Pick another."
    dangerous: "<red><white><name></white> is one of the server's own worlds, or a name that is a path. Making it a farm world would mean deleting the server."
  regenerated: "<green><white><name></white> is new."
  made-again: "<gray><white><name></white> is a fresh world. Whatever was there is gone."
  config:
    at-the-limit: "<yellow>That is as far as it goes: between <white><least></white> and <white><most></white>."
    refused: "<red><white><setting></white> would not take that value."
