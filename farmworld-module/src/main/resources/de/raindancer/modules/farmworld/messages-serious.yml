# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.
# A line the owner rewrote in plugins/RainsCore/messages.yml wins in both tones.

farmworlds:
  arrived: "<green>Welcome to <white><name></white>'s spawn."
  arrived-wild: "<green>You are out in <white><name></white> at <white><where></white>. The way back is on foot."
  none-yet: "<gray>This server has no farm worlds."
  schedule-set: "<green><white><name></white> will be regenerated every <white><time></white>."
  regenerated: "<green><white><name></white> is new."
