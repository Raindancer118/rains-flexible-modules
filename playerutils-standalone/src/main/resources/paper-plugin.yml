# Generated in shape by StandaloneDescriptor and checked by DescriptorTest — see rtp-standalone's own copy for
# why every line here matters, and for the two ways of writing this file that fail silently.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '26.3'
description: 'Fly, heal, feed, hurt, drown, launch, scale, speed, wipe, spectate, sudo and see everything about a player — by name or nickname.'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# Nothing in the module touches Bukkit.getScheduler(). Every change to a player goes through Core's
# PlayerAdmin/PlayerBody, which hand it to that player's own region; commands run as the sender's own thread.
folia-supported: true

dependencies:
  # Both phases, and bootstrap is not belt-and-braces — see rtp-standalone's own copy of this file for the
  # full reasoning: without it the module fails to link at bootstrap and the plugin reports that it contains
  # no modules.
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
