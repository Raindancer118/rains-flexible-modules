# Rain's Economy — every line this module says.
#
# Offered as a floor: anything an owner has already written in their own messages.yml wins. Amounts arrive
# already painted in the currency's colours; write <amount> and they appear as the owner styled them.
economy:

  only-a-player: "<red>Only a player standing in the world can do that."
  not-allowed: "<red>You may not do that."
  not-online: "<red><player> is not online."
  unknown-player: "<red>Nobody called <player> has played here."
  not-an-amount: "<red>That is not an amount of money."
  not-an-amount-typed: "<red><typed> is not an amount — try 12, 12.50 or 1.5k."
  not-enough: "<red>You do not have <amount>. You have <balance>."
  too-much: "<red>That would take an account past the most it may hold."
  no-account: "<red><player> has no account here."
  frozen: "<red>That account is frozen. Ask staff."
  unavailable: "<red>The bank is not open right now. Nothing was taken — try again in a moment."
  refused: "<red>That was refused, and nothing moved."
  away: "<green>While you were away, <amount> arrived in your account."

  menu:
    locked: "<red><reason>"

  balance:
    yours: "<gray>You have <amount><gray>. <dark_gray>(#<place> on the server)"
    theirs: "<white><player></white><gray> has <amount><gray>. <dark_gray>(#<place>)"

  baltop:
    off: "<red>The richest players list is switched off on this server."

  usage:
    pay: "<gray>/pay <player> <amount>"
    bill: "<gray>/bill <player> <amount> [what for]"
    dice: "<gray>/dice <amount> <over|under> <number from 1 to 100>"
    lottery: "<gray>/lottery  ·  /lottery buy [tickets]  ·  /lottery buy <your numbers>  ·  /lottery info"
    eco: "<gray>/eco give|take|set <player> <amount> [reason]  ·  /eco reset|freeze|unfreeze|history <player>  ·  /eco menu|reprice|draw|calm|coin"
    hire: "<gray>/hire <player> <wage> <every, like 1h or 30m> [job]  ·  /hire list  ·  /hire fire|quit <player>"

  pay:
    off: "<red>Paying each other is switched off on this server."
    yourself: "<red>You cannot pay yourself."
    too-little: "<red>The least anybody may pay is <amount>."
    offline-off: "<red><player> is offline, and payments only reach players who are online."
    wait: "<red>Wait <seconds> second(s) before paying again."
    confirm: "<yellow>Pay <amount><yellow> to <white><player></white>? <button>"
    sent: "<green>You paid <amount><green> to <white><player></white>. You have <balance><green> left."
    taxed: "<gray><tax><gray> of that went in tax; <player> received the rest."
    received: "<green><white><player></white> paid you <amount><green>."
    how: "<gray>Type <white>/pay <player> <amount></white> to pay them."

  bill:
    off: "<red>Bills are switched off on this server."
    yourself: "<red>You cannot bill yourself."
    already: "<red>You have already sent <player> a bill. Wait for an answer."
    sent: "<gray>You asked <white><player></white> for <amount><gray>. It stays open for <minutes> minute(s)."
    received: "<yellow><white><player></white> asks you to pay <amount><yellow>. <buttons>"
    received-for: "<yellow><white><player></white> asks you to pay <amount><yellow> for <white><reason></white>. <buttons>"
    gone: "<red>That bill has run out or was already answered."
    paid: "<green>You paid <amount><green> to <white><player></white>."
    was-paid: "<green><white><player></white> paid your bill of <amount><green>."
    failed: "<red><player> could not pay your bill."
    declined: "<red><player> declined your bill."
    you-declined: "<gray>You declined <player>'s bill."

  cash:
    off: "<red>Coins and notes are switched off on this server."
    cheques-off: "<red>Cheques are switched off on this server."
    too-many: "<red>That would be <pieces> coins; at most <most> come out at once. Write a cheque for more."
    no-room: "<red>Your inventory has no room for that. Nothing was taken."
    withdrawn: "<green>You took out <amount><green> in cash. Your account holds <balance><green>."
    cheque-written: "<green>You wrote a cheque for <amount><green>. Your account holds <balance><green>."
    fee: "<gray>The bank kept <fee><gray> as a fee."
    deposited: "<green>You paid in <amount><green>. Your account holds <balance><green>."
    none: "<red>You are not carrying any cash."
    no-creative: "<red>Money cannot be moved through the creative inventory — switch to survival to handle it."
    counterfeit: "<red><count> piece(s) had already been paid in, were never issued or are not this server's money, and were taken. Staff have been told."
    counterfeit-alert: "<red>[Economy] <white><player></white> tried to pay in <count> forged piece(s) — No. <white><serial></white>, worth <amount><red> each. Confiscated."
    over-circulation: "<red><count> coin(s) were not paid in: more coins of that value were offered than are in circulation. Staff have been told."
    over-circulation-alert: "<red>[Economy] <white><player></white> offered <count> more coin(s) than are in circulation — somebody may be duplicating coins."

  shop:
    off: "<red>The shop is switched off on this server."
    selling-off: "<red>Selling to the shop is switched off on this server."
    category-closed: "<red>The <category> drawer is closed on this server."
    not-for-sale: "<red>The shop does not sell <item>."
    not-bought: "<red>The shop does not buy <item>."
    none-carried: "<red>You are not carrying any plain <item>."
    nothing-in-hand: "<red>You are not holding anything."
    nothing-to-sell: "<red>You carry nothing the shop buys."
    changed: "<red>That item changed before it could be sold. Open the list again."
    no-room: "<red>Your inventory has no room for that. Nothing was taken."
    bought: "<green>You bought <count> × <white><item></white> for <amount><green>."
    sold: "<green>You sold <white><what></white> for <amount><green>."

  earn:
    income: "<green>Income: <amount><green> for <minutes> minutes online."
    income-away: "<gray>Income while away: <amount><gray> for <minutes> minutes online."
    interest: "<green>Interest: <amount><green> on what is in your account."

  daily:
    off: "<red>The daily reward is switched off on this server."
    already: "<red>You have had today's reward. Come back in <hours> hour(s)."
    claimed: "<green>Daily reward: <amount><green>. Day <white><streak></white> in a row."

  gamble:
    off: "<red>That game is switched off on this server."
    not-allowed: "<red>You may not gamble."
    too-little: "<red>The smallest bet is <amount><red>."
    too-much: "<red>The largest bet is <amount><red>."
    loss-limit: "<red>That would take you past the most anybody may lose in a day (<amount><red>). Come back tomorrow."
    wait: "<red>Not so fast."
    flip-won: "<green>It landed <white><side></white>! You won <amount><green>. Balance: <balance><green>."
    flip-lost: "<red>It landed <white><side></white>. You lost <amount><red>. Balance: <balance><red>."
    dice-won: "<green>You rolled <white><roll></white>! You won <amount><green>. Balance: <balance><green>."
    dice-lost: "<red>You rolled <white><roll></white>. You lost <amount><red>. Balance: <balance><red>."
    dice-bad-target: "<red>The house does not take that bet: pick a number that wins between 1 and 95 rolls in 100."
    roulette-won: "<green>The ball lands on <white><pocket></white> — <bet> wins! You won <amount><green>. Balance: <balance><green>."
    roulette-lost: "<red>The ball lands on <white><pocket></white>. <bet> loses <amount><red>. Balance: <balance><red>."
    slots-won: "<green><white><reels></white> — you won <amount><green>! Balance: <balance><green>."
    slots-lost: "<red><white><reels></white> — you lost <amount><red>. Balance: <balance><red>."
    blackjack-won: "<green>Dealer: \"<dealer>\" You win <amount><green>. Balance: <balance><green>."
    blackjack-lost: "<red>Dealer: \"<dealer>\" You lose <amount><red>. Balance: <balance><red>."
    blackjack-push: "<yellow>A push — your <amount><yellow> comes back."
    baccarat-won: "<green><result>, <points>. You win <amount><green>. Balance: <balance><green>."
    baccarat-lost: "<red><result>, <points>. You lose <amount><red>. Balance: <balance><red>."
    baccarat-push: "<yellow>It is <result> — your <amount><yellow> comes back."
    hilo-won: "<green>Cashed out on the <white><card></white>: <amount><green>. Balance: <balance><green>."
    hilo-lost: "<red>The <white><card></white> — wrong guess. You lose <amount><red>. Balance: <balance><red>."
    mines-won: "<green><tiles> tiles cleared — you take <amount><green>. Balance: <balance><green>."
    mines-lost: "<red>Boom, after <tiles> safe tiles. You lose <amount><red>. Balance: <balance><red>."
    mines-count: "<red>Between 1 and 24 mines."
    returned: "<gray>Your <amount><gray> comes back."
    crash-won: "<green>Cashed out at <white><at>×</white>: <amount><green>. Balance: <balance><green>."
    crash-lost: "<red>Crashed at <white><at>×</white> — you lose <amount><red>. Balance: <balance><red>."
    crash-closed: "<red>Bets for this round are closed. Wait for the next one."
    crash-already: "<red>You are already in this round."
    race-won: "<green><white><horse></white> wins — you collect <amount><green>! Balance: <balance><green>."
    race-lost: "<red><white><horse></white> wins. You lose <amount><red>. Balance: <balance><red>."
    race-closed: "<red>The gate is open — bets are closed. Next race soon."
    scratch-bought: "<green>You bought <count> scratch card(s) for <amount><green>. Right click one to scratch it."
    scratch-won: "<green>Three alike — <white><prize></white>! You win <amount><green>. Balance: <balance><green>."
    scratch-lost: "<red>No three alike this time. Balance: <balance><red>."
    scratch-copy: "<red>That scratch card was already scratched, or never sold — it was taken."
    duel-yourself: "<red>You cannot flip against yourself."
    duel-sent: "<gray>You challenged <white><player></white> to a coin flip for <amount><gray>."
    duel-received: "<yellow><white><player></white> challenges you to a coin flip for <amount><yellow>, winner takes both. <buttons>"
    duel-gone: "<red>That challenge has run out or was already answered."
    duel-failed: "<red>The duel could not be settled — one of you does not have the stake any more."
    duel-won: "<green>The coin favoured you! You won <amount><green>."
    duel-lost: "<red>The coin favoured <player>. You lost <amount><red>."
    duel-declined: "<red><player> declined your challenge."
    duel-you-declined: "<gray>You declined <player>'s challenge."

  lottery:
    most: "<red>You already hold the most tickets anybody may (<most>) for this draw."
    pick: "<red>A ticket has <pick> different numbers from 1 to <range>."
    drawing: "<red>The draw is being called right now — wait for the last ball."
    bought: "<green>You bought <count> ticket(s) (<white><numbers></white>) for <amount><green>. The pot is <pot><green>; the draw is in <when>."
    status: "<gray>Lottery: pot <pot><gray> · <tickets> ticket(s) in this draw · you hold <mine> · a ticket (<pick> of 1–<range>) costs <price><gray> · draw in <when>."
    drawing-now: "<gold>[Lottery] <yellow>The draw begins! <pot><yellow> in the pot, <tickets> ticket(s) in the drum."
    ball: "<gold>[Lottery] <gray>Ball <which> of <of>: <white><bold><number></bold></white>"
    won: "<gold>[Lottery] <white><player></white> wins <amount><gold> with the numbers <white><numbers></white>!"
    nobody: "<gold>[Lottery] <yellow>The numbers were <white><numbers></white> — nobody won a prize. Everything rolls over: the pot is <pot><yellow>."
    next: "<gold>[Lottery] <gray>The pot for the next draw: <pot>"
    no-tickets: "<gray>Nobody had bought a ticket, so the pot carries over."

  sidebar:
    on: "<green>Your balance is in the sidebar again. <gray>/bank sidebar hides it."
    off: "<gray>The sidebar is hidden. /bank sidebar brings it back."

  statement:
    printed: "<green>Your statement is being printed — it lands in your inventory in a moment."

  hire:
    off: "<red>Hiring is switched off on this server."
    yourself: "<red>You cannot hire yourself."
    too-often: "<red>Wages may be paid every <minutes> minutes at most."
    too-many: "<red>You already employ the most anybody may (<most>)."
    offered: "<gray>You offered <white><player></white> <amount><gray> every <every>. Waiting for an answer."
    offer: "<yellow><white><player></white> wants to hire you for <amount><yellow> every <every>. <buttons>"
    offer-as: "<yellow><white><player></white> wants to hire you as <white><job></white> for <amount><yellow> every <every>. <buttons>"
    declined: "<red><player> turned the job down."
    started: "<green>You work for <white><player></white> now: <amount><green> every <every>."
    accepted: "<green><white><player></white> took the job: <amount><green> every <every>, from your account."
    not-yours: "<red>There is no such job of yours."
    full: "<red><player> already employs as many people as anybody may."
    you-fired: "<gray>You let <white><player></white> go. No more wages are paid."
    you-quit: "<gray>You quit working for <white><player></white>."
    fired: "<red><player> let you go."
    quit: "<red><player> quit working for you."
    paid: "<green>Wage from <white><player></white>: <amount><green>."
    missed: "<red><player> could not pay your wage (<count> missed in a row)."
    could-not-pay: "<red>You could not pay <white><player></white>'s wage of <amount><red> — top up your account."
    ended: "<red>Your job for <player> ended: too many wages were missed."
    ended-employer: "<red><player>'s job ended: you missed too many wages."

  admin:
    coin: "<green>Coins are now made of <white><item></white>. Coins already out keep working."
    dealer-placed: "<green>A <white><game></white> dealer stands here now. Players right click them to play. <gray>/eco dealer remove takes them away."
    dealer-removed: "<green>The nearest dealer is gone."
    dealer-none: "<red>There is no dealer within four blocks of you."
    leaderboard-placed: "<green>A leaderboard of the richest players floats here now. <gray>/eco leaderboard remove takes it away."
    leaderboard-removed: "<green>The nearest leaderboard is gone."
    leaderboard-none: "<red>There is no leaderboard within five blocks of you."
    leaderboards-off: "<red>World leaderboards are switched off. /eco menu switches them on."
    coin-hold: "<red>Hold the item coins should be made of — anything but money."
    done: "<green>Done. <white><player></white> now has <balance><green>."
    refused: "<red>Refused for <player>: <reason>."
    frozen: "<green><player>'s account is frozen."
    unfrozen: "<green><player>'s account is no longer frozen."
    repriced: "<green>Repriced everything from <recipes> recipe(s)."
    calmed: "<green>Every price is back to plain."
