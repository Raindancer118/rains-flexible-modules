# The packs the shop sells. A pack is one item; right click it to unpack everything inside.
#
#   title        what the pack is called
#   icon         the item it looks like
#   description  lines under the name
#   contents     item: how many — plain items only, the way the shop sells them
#   price        leave out to price it from its contents (each buyer's own prices, less the pack discount
#                set in /eco). With a price it costs exactly that.
#   once         true: each player may buy it only once
#
# Read again with /eco packs. Delete this file to get the shipped packs back.
packs:
  starter:
    title: Starter Pack
    icon: chest
    once: true
    description:
      - "A soft landing for your first night."
      - "One each."
    price: 100
    contents:
      stone_pickaxe: 1
      stone_axe: 1
      stone_sword: 1
      bread: 16
      torch: 16
      white_bed: 1
      crafting_table: 1

  explorer:
    title: Explorer's Pack
    icon: compass
    description:
      - "Everything for a long trip out."
    contents:
      cooked_beef: 16
      torch: 32
      white_bed: 1
      oak_boat: 1
      compass: 1
      map: 1
      bucket: 1
      shield: 1
      firework_rocket: 16

  builder:
    title: Builder's Pack
    icon: bricks
    description:
      - "A good start on a house."
    contents:
      stone_bricks: 64
      oak_planks: 64
      glass: 32
      scaffolding: 32
      ladder: 16
      oak_door: 2

  miner:
