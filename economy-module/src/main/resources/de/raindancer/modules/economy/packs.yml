    icon: smoker
    description:
      - "A kitchen in a box."
    contents:
      smoker: 1
      campfire: 1
      coal: 16
      beef: 16
      potato: 16
      carrot: 16
      bowl: 8

  farmer:
    title: Farmer's Pack
    icon: wheat
    description:
      - "Seeds, a hoe and something to make them grow."
    contents:
      iron_hoe: 1
      wheat_seeds: 32
      carrot: 8
      potato: 8
      bone_meal: 32
      composter: 1

  mage:
    title: Mage's Pack
    icon: enchanting_table
    description:
      - "The makings of an enchanting room."
    contents:
      enchanting_table: 1
      bookshelf: 15
