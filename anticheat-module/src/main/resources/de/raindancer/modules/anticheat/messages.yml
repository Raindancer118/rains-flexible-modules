# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
anticheat:
  alert: "<red>⚠ <click:run_command:'/anticheat <player>'><hover:show_text:'<gray>Open their checks'><white><player></white></hover></click> <gray>failed <hover:show_text:'<gray><description>\n<dark_gray>Level <level> · staff are told from <alert-at>'><yellow><check></yellow></hover><count> <dark_gray>· <gray><detail> <dark_gray>(<ping> ms) <click:run_command:'/anticheat go <player>'><hover:show_text:'<gray>Go to them · /anticheat back returns you'><aqua>[Go]</aqua></hover></click> <click:run_command:'/anticheat replay <player>'><hover:show_text:'<gray>Draw what just happened around you'><light_purple>[Replay]</light_purple></hover></click> <click:run_command:'/anticheat log <player>'><hover:show_text:'<gray>Every flag on record, newest first'><gold>[Log]</gold></hover></click>"
  alert-experimental: "<gold>◇ <click:run_command:'/anticheat <player>'><hover:show_text:'<gray>Open their checks'><white><player></white></hover></click> <gray>looks off on <hover:show_text:'<gray><description>\n<dark_gray>Experimental: alerts only'><yellow><check></yellow></hover><count> <dark_gray>· <gray><detail> <click:run_command:'/anticheat go <player>'><aqua>[Go]</aqua></click> <click:run_command:'/anticheat log <player>'><gold>[Log]</gold></click>"
  alert-digest: "<red>⚠ <click:run_command:'/anticheat <player>'><hover:show_text:'<gray>Open their checks'><white><player></white></hover></click> <gray>still at it: <yellow><checks></yellow> <dark_gray>· <gray>level <white><level></white> <dark_gray>· <gray><detail> <dark_gray>(<ping> ms) <click:run_command:'/anticheat go <player>'><aqua>[Go]</aqua></click> <click:run_command:'/anticheat replay <player>'><light_purple>[Replay]</light_purple></click> <click:run_command:'/anticheat log <player>'><gold>[Log]</gold></click>"
  verbose: "<dark_gray>[verbose] <gray><player> <dark_gray>· <gray><check> <dark_gray><level> · <gray><detail>"
  kicked: "<red><white><player></white> was kicked for <yellow><check></yellow> <gray>(level <level>). The physics engine sends its regards."
  rule-punished: "<dark_red><white><player></white> broke rule <number> (<rule>) with <yellow><check></yellow> <gray>— <offence> offence: <white><penalty></white>."
  banned: "<dark_red><white><player></white> was banned for <yellow><check></yellow> <gray>(level <level>, <length>)."
  kick-screen: "<red>Kicked: unfair advantage (<check>).\n<gray>If that was a mistake, it will not happen twice. If it was not, it will."
  ban-screen: "<red>Banned: unfair advantage (<check>).\n<gray>Length: <length>"
  client-screen: "<red>This server does not allow <client>.\n<gray>Join again with an ordinary client."
  client-refused: "<red><white><player></white> tried to join with <yellow><client></yellow> and was shown the door."
  brand: "<gray><white><player></white> joined with <yellow><brand></yellow>."
  alerts-on: "<green>Anti-cheat alerts are on. Brace for paperwork."
  alerts-off: "<yellow>Anti-cheat alerts are off. Ignorance is bliss, briefly."
  verbose-on: "<green>Verbose is on: every single failure, unfiltered. You asked for this."
  verbose-off: "<yellow>Verbose is off."
  usage: "<gray>/anticheat <dark_gray>[<player> | alerts | verbose | info <player> | log <player> [page] | replay <player> [n] | go <player> | back | exempt <player> <seconds> | unexempt <player> | fresh <player> | reset <player> | checks | status]"
  went: "<gray>You are with <white><player></white>. <click:run_command:'/anticheat back'><hover:show_text:'<gray>Back to where you were'><aqua>[Back]</aqua></hover></click>"
  back: "<gray>Back where you were."
  nowhere-to-go-back: "<gray>There is nowhere to go back to."
  not-online: "<red><white><player></white> is not online. Suspicious in itself, but not something to check."
  no-record: "<red>Nobody called <white><player></white> has a record here."
  only-a-player: "<red>Only a player can do that. Consoles do not get alerts, they get logs."
  no-permission: "<red>That needs a permission you do not have. Nice try, though."
  info-header: "<gold>Anti-cheat record of <white><player></white> <gray>— total level <white><level></white>"
  info-line: "<dark_gray> · <yellow><check></yellow> <gray><level> <dark_gray>(<category>)"
  info-clean: "<green> Squeaky clean, as far as anybody can tell."
  info-meta: "<gray> Ping <white><ping> ms</white> · client <white><brand></white> · read from <white><tap></white> · clock <white><timer> ms</white> ahead · exempt: <white><exempt></white>"
  info-clicks: "<gray> Clicks: <white><cps></white> cps, σ <white><deviation> ms</white>, kurtosis <white><kurtosis></white>, skew <white><skewness></white>"
  log-header: "<gold>Evidence against <white><player></white> <gray>— page <page>/<pages> (<count>)"
  log-fresh: "<aqua>Measured afresh since <white><time></white> <gray>— older flags are history, kept but not counted."
  log-line-before: "<dark_gray><time> <check> <level> · <detail> · <where> · <ping> ms · <tps> tps <italic>(before the fresh start)"
  fresh: "<green><white><player></white> is measured afresh from now: levels and statistics start over. <gray>Evidence, replays and punishments are kept."
  log-line: "<dark_gray><time> <yellow><check></yellow> <gray><level> <dark_gray>· <gray><detail> <dark_gray>· <where> · <ping> ms · <tps> tps"
  log-empty: "<green>No evidence against <white><player></white>. Either honest or very good at it."
  replay-shown: "<gold>Replay <index>/<count> of <white><player></white>: <yellow><check></yellow> <gray>— <detail>. <dark_gray>Their figure walks it three times, in their gear; the trail runs green to the red alert, white lines are where they looked. <click:run_command:'/anticheat replay stop'><hover:show_text:'<gray>End it now'><red>[Stop]</red></hover></click>"
  replay-stopped: "<gray>Replay ended."
  replay-nothing-playing: "<gray>No replay is playing for you."
  replay-none: "<gray>No replays of <white><player></white>. Replays are kept when a check alerts — clean players have none, which is the point."
  check-now-on: "<green><white><check></white> is on again. Back to work."
  check-now-watched: "<yellow><white><check></white> is watching only: alerts and evidence, no consequences."
  check-now-off: "<gray><white><check></white> is off. Hope you know what you are doing."
  exempted: "<green><white><player></white> is left alone for <seconds> seconds."
  unexempted: "<green><white><player></white> is checked again."
  reset: "<green><white><player></white>'s record is wiped. Fresh start, same physics."
  checks-header: "<gold><count> checks:"
  check-on: "<green>● <white><check></white> <dark_gray>(<key>, <category>) <gray><description>"
  check-off: "<dark_gray>○ <check> (<key>, <category>) — switched off"
  check-silent: "<yellow>◐ <white><check></white> <dark_gray>(<key>, <category>) <gray>watch only — <description>"
  check-experimental: "<gold>◇ <white><check></white> <dark_gray>(<key>, <category>) <gray>experimental, alerts only — <description>"
  status: "<gold>Anti-cheat: <white><checks></white> checks · <white><players></white> players, <white><tapped></white> read from packets · packet tap <white><tap></white> · TPS <white><tps></white> · paused: <white><paused></white>"
