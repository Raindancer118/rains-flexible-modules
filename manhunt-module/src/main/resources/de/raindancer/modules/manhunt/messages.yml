# Rain's Manhunt — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins, and so
# does a host's bundled wording. See Messages.defineFrom.
manhunt:

  # ---------------------------------------------------------------- joining a side
  joined: "<green>You are now on the <white><side></white> side."
  left: "<yellow>You are no longer on either side."
  not-on-a-side: "<red>You were not on either side."
  join-refused:
    frozen: "<red>Sides cannot be changed while a hunt is running."
    already-in-that-team: "<yellow>You are already on that side."
    runners-locked: "<red>Only an admin can put you on the Runners right now."

  # ---------------------------------------------------------------- the waiting lobby
  no-fighting-in-lobby: "<red>Nobody fights in the waiting lobby."
  lobby-set: "<green>The waiting lobby is now here."

  # ---------------------------------------------------------------- running
  start:
    started: "<green>The hunt is on."
    already_running: "<red>A hunt is already going."
    no_runners: "<red>Nobody has joined the Runners yet."
    no_hunters: "<red>Nobody has joined the Hunters yet."
    world_missing: "<red>The configured Manhunt world is not loaded."
  stop-refused: "<red>There is no hunt going to stop."
  stopped: "<yellow>The hunt has been stopped."
  finished: "<gold>The hunt is over — <white><reason></white>, after <white><time></white>."

  # ---------------------------------------------------------------- resetting
  reset-done: "<green>The map has been reset."
  reset-refused: "<red>The map could not be reset — is the configured world loaded?"

  # ---------------------------------------------------------------- the server whitelist
  whitelist:
    opened: "<green>The whitelist is open — anybody can join."
    closed: "<yellow>The whitelist is closed — <white><added></white> player(s) newly whitelisted."

  # ---------------------------------------------------------------- chaos
  chaos:
    applied: "<gold>Thrown: <white><action></white>."
    on_cooldown: "<red>Chaos is still cooling down."
    no_targets: "<red>Nobody for <white><action></white> to act on right now."
    not_running: "<red>There is no hunt running to throw chaos at."

  # ---------------------------------------------------------------- the countdown
  countdown:
    tick: "<yellow>The hunt begins in <white><seconds></white>…"
    go: "<green>Go."

  # ---------------------------------------------------------------- dying
  death:
    lives-left: "<red>You died. <white><lives></white> live(s) left."
    eliminated: "<dark_red>You are out of the hunt."
    eliminated-watching: "<dark_red>You are out of the hunt — watch the rest of it."
    hunter-waiting: "<gray>Back in <white><seconds></white> second(s)."
    hunter-back: "<green>Back in the hunt."

  # ---------------------------------------------------------------- what a hunt says out loud
  narrate:
    dimension: "<gold><runner></gold> <gray>has reached <white><where></white><gray>."
    runner-died: "<red><runner></red> <gray>died — <white><lives></white> live(s) left."
    runner-out: "<dark_red><runner></dark_red> <gray>is out of the hunt. <white><left></white> Runner(s) still in."
    hunter-died: "<gray><hunter> died."
    time-left: "<yellow><time></yellow> <gray>left on the clock."
    dragon: "<gold>The dragon is down to <white><percent>%</white><gold>."

  # ---------------------------------------------------------------- the tracking compass
  tracker:
    given: "<gold>You have been handed a tracking compass."
    now-following: "<gold>Your compass now follows <white><runner></white>."
    pack-following: "<gold><hunter></gold> <gray>put the pack on <white><runner></white><gray>."
    picking-off: "<red>Your compass follows whoever is nearest — that is not yours to change."
    no-runners: "<red>There is no Runner left to follow."

  # ---------------------------------------------------------------- talking to your side
  here:
    shared: "<gold><player></gold> <gray>is at <white><x> <y> <z></white> in <white><world></white><gray>."
    off: "<red>Sharing your position is switched off."

  spectate:
    watching: "<gray>You are watching the hunt. Type it again to stop."
    stopped: "<gray>You are no longer watching."
    not-allowed: "<red>Watching is switched off on this server."
    on-a-side: "<red>Leave your side first — a player in the hunt cannot watch it."

  # ---------------------------------------------------------------- achievements
  achievements:
    header: "<gold>Manhunt achievements — <white><count></white> shown, <white><hidden></white> still hidden."
    entry: "<gray>  <white><title></white> <dark_gray>(<points> pt) — <description>"

  # ---------------------------------------------------------------- options
  options:
    console-only: "<gray>Options are edited in-game with /manhunt options, or in full at /settings."

  # ---------------------------------------------------------------- the Runners' goal
  goal-set: "<green>The Runners' goal is now <white><goal></white>."

  # ---------------------------------------------------------------- status
  status:
    idle: "<gray>No hunt is going — <white><runners></white> Runner(s), <white><hunters></white> Hunter(s)."
    running: "<gray><white><runners></white> Runner(s), <white><hunters></white> Hunter(s) — <white><time></white> elapsed."

  # ---------------------------------------------------------------- general
  only-a-player: "<red>Only somebody standing in the world can do that."
  not-yours: "<red>Manhunt is not yours to change."

  usage:
    join: "<gray>/manhunt join <runner|hunter>"
    reset: "<gray>/manhunt reset [seed <a number|random>]"
    chaos: "<gray>/manhunt chaos <action>"
    assign: "<gray>/manhunt assign <player> <runner|hunter>"
    goal: "<gray>/manhunt goal <advancement-key>"

  help:
    - "<gray>/manhunt <dark_gray>— the lobby: sides, and the clock"
    - "<gray>/manhunt join <runner|hunter> <dark_gray>— put yourself on a side"
    - "<gray>/manhunt leave <dark_gray>— take yourself off"
    - "<gray>/manhunt assign <player> <runner|hunter> <dark_gray>— put somebody else on a side"
    - "<gray>/manhunt start <dark_gray>— begin the hunt"
    - "<gray>/manhunt stop <dark_gray>— end it early"
    - "<gray>/manhunt reset <dark_gray>— throw the map away and make it again"
    - "<gray>/manhunt status <dark_gray>— the roster and the clock, as text"
    - "<gray>/manhunt chaos [<action>] <dark_gray>— throw chaos at a running hunt, or open the menu"
    - "<gray>/manhunt achievements <dark_gray>— the curated set, earned or not"
    - "<gray>/manhunt options <dark_gray>— how a hunt is set up: winning, dying, and ending"
    - "<gray>/manhunt tracker <dark_gray>— everything the Hunters' tracking compass does"
    - "<gray>/manhunt field <dark_gray>— narration, side chat, borrowed rules, spectators"
    - "<gray>/manhunt here <dark_gray>— tell your own side where you are"
    - "<gray>/manhunt spectate <dark_gray>— watch a hunt you are not in"
    - "<gray>/manhunt setlobby <dark_gray>— place the waiting lobby where you are standing"
    - "<gray>/manhunt goal <advancement-key> <dark_gray>— set the Runners' win advancement, with tab-completion"
    - "<gray>/whitelist open|close <dark_gray>— open or close the server's doors"
