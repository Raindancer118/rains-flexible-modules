# Generated in shape by StandaloneDescriptor and checked by DescriptorTest — see that class for why every line
# here matters, and for the two ways of writing this file that fail silently.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '1.21'
description: 'A speedrun lobby: pick an advancement goal or a death policy from a compass, then press the green block to race — a countdown freezes everyone first, and the lobby world resets once the last racer has left.'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# NOT Folia-safe, for the same reason RainsChained is not. SpeedrunReset.regenerate is documented
# main-thread-only: it calls Bukkit.unloadWorld and WorldCreator#createWorld directly, the way
# FarmWorlds does, and neither is a regionised operation Folia can run from just anywhere.
# SpeedrunLobby.resetIfAbandoned calls it directly from PlayerQuitEvent — a player's own region thread
# on Folia, not the single "main" thread Paper guarantees — rather than hopping onto the global region
# scheduler first. Honest about that rather than silently corrupting a world reset on a Folia server.
folia-supported: false

dependencies:
  # Both phases, and bootstrap is not belt-and-braces. Paper runs bootstrap with its own dependency tree and
  # its own classpath, and the bootstrapper is where the modules are first discovered — it has to look, since
  # commands are registered during bootstrap or they never exist. Declared for the server phase alone, the
  # module fails to link at bootstrap with a ClassNotFoundException for a RainsCore class and the plugin
  # reports that it contains no modules. That is what the claims plugin did on the test server the first time.
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      # The line that actually puts RainsCore's classes on this plugin's classpath. Paper plugins get isolated
      # classloaders, so without it everything above is right and the plugin dies the moment it touches one.
      join-classpath: true
