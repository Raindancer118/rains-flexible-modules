# Rain's Random Teleport — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins, and so
# does a host's bundled wording. See Messages.defineFrom.
#
# Two things MessagesTest holds against this file, both of which have gone wrong before:
#
#   - Every placeholder a line asks for is supplied where it is sent, and nothing is supplied in
#     vain. An unfilled <count> is printed as written, mid-sentence, and reads to a player as a
#     broken plugin rather than as two files disagreeing.
#   - Nothing here is YAML's idea of a truth value. A bare on, off, yes or no is a boolean, and a
#     message that has become one prints its own key to somebody's face.
rtp:

  searching: "<gray>Looking for somewhere safe to land… hopefully not lava."
  no-world: "<red>You are not standing in a world at all. Impressive, honestly."
  world-disabled: "<red>Random teleporting does not work in <white><world></white>."
  on-cooldown: "<yellow>You can go again in <white><time></white>."
  on-cooldown-skippable: "<yellow>You can go again in <white><time></white> — or skip the wait for <white><price></white>."
  cannot-afford: "<red>That costs <white><price></white>, and you do not have it."
  payment-failed: "<red>The <white><price></white> could not be taken, so nobody went anywhere. Nothing was charged."
  paid: "<gray>Paid <white><price></white>."
  refunded: "<gray>No trip, so your <white><price></white> is back."
  warming-up: "<gray>Off to somewhere new in <white><seconds></white>… stand still."
  arrived: "<green>Here you are: <white><where></white>. Surprise!"
  already-travelling: "<yellow>You are already on your way somewhere."
  world-missing: "<yellow>That world is not loaded right now."
  nowhere-safe: "<red>Nowhere nearby was safe to put you. Try again."
  could-not-check: "<red>The ground could not be checked. Try again."
  teleport-refused: "<red>Something stopped you arriving. Try again."
  cannot-schedule: "<red>The server cannot send you anywhere just now."
  only-a-player: "<red>Only somebody standing in the world can be sent somewhere random."
  invalid-distance: "<red><white><value></white> is not a distance to ask for. Please enter a number."

  cancelled:
    moved: "<yellow>You moved, so you are staying put."
    hurt: "<yellow>Something hit you, so you are staying put."

  pool:
    no-permission: "<red>You may not prepare locations ahead of time."
    disabled: "<red>Preparing locations ahead of time is switched off."
    no-world: "<red>There is no world to prepare locations in."
    invalid-amount: "<red><white><value></white> is not a number of locations to prepare."
    full: "<yellow>The pool is already as full as it is allowed to be."
    preparing: "<gray>Looking for <white><amount></white> location(s) in <white><world></white>…"
    prepared: "<green>Prepared <white><amount></white> location(s) in <white><world></white>."
