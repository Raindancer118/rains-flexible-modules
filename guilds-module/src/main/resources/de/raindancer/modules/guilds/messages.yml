# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
guilds:
  only-a-player: "<red>Guilds are for players. Consoles found nothing, lead nothing and pay into nothing."
  busy: "<red>Something else is already waiting for you to type an answer. Finish that first."
  left-as-it-is: "<gray>Left as it was."
  never-here: "<red>Nobody called <white><player></white> has ever been here."
  no-such-guild: "<red>There is no guild called <white><guild></white>. <gray>/guild list"
  welcome: "<green>Welcome to <guild><green>! <gray>/guild for its page."
  motd: "<guild> <dark_gray>»</dark_gray> <gray><motd>"
  joined: "<green><white><player></white> joined the guild."
  left: "<gray><white><player></white> left the guild."
  kicked: "<red>You were removed from <guild><red> by <white><player></white>."
  kicked-told: "<gray><white><player></white> was removed from the guild by <white><by></white>."
  disbanded: "<red><guild><red> was disbanded by <white><player></white>."
  renamed: "<gray>The guild is called <white><name></white> now <dark_gray>(<by>)</dark_gray>."
  disband-confirm: "<yellow>This disbands <guild><yellow> for good: every member leaves and the bank is shared out. <gray>Type the same command with <white>confirm</white> at the end."
  info: "<guild> <tag> <gray>— level <white><level></white>, <white><members></white>/<white><cap></white> members, led by <white><leader></white>, <white><allies></white> ally(ies). Joining: <white><joining></white>."
  announce:
    founded: "<gold>A new guild: <guild><gold>, founded by <white><player></white>."
    disbanded: "<gray>The guild <guild><gray> is no more."
  invite:
    received: "<aqua><white><player></white> invites you to <guild><aqua>."
    declined: "<gray><white><player></white> declined the invitation to <guild><gray>."
    waiting: "<aqua>You have <white><count></white> guild invitation(s) waiting. <gray>/guild"
  apply:
    received: "<aqua><white><player></white> wants to join the guild."
    declined: "<gray>Your application to <guild><gray> was declined."
    waiting: "<aqua><white><count></white> application(s) to the guild are waiting. <gray>/guild"
  ally:
    asked: "<aqua><guild><aqua> asks for an alliance <dark_gray>(<player>)</dark_gray>."
    formed: "<green>Allied with <guild><green>. <gray>/guild ac to talk to both guilds."
    ended: "<gray>The alliance with <guild><gray> has ended."
    waiting: "<aqua><white><count></white> alliance request(s) are waiting. <gray>/guild"
  rival:
    declared: "<red><guild><red> are your rivals now."
    declared-on-us: "<red><guild><red> declared your guild their rival. Charming."
    ended: "<gray><guild><gray> no longer count your guild as rivals."
  rank:
    changed: "<gray><white><player></white> is <white><rank></white> now <dark_gray>(<by>)</dark_gray>."
  leader:
    handed-over: "<gold><white><player></white> leads the guild now, handed over by <white><by></white>."
    succeeded: "<gold><white><player></white> leads the guild now: <white><old></white> had not been seen in <white><days></white> days."
  level:
    up: "<gold><guild><gold> reached level <white><level></white>! <gray>Room for <white><members></white> members and <white><allies></white> ally(ies)."
    home-unlocked: "<gold>The guild home is unlocked. <gray>/guild sethome where it should be."
  bank:
    deposited-told: "<gray><white><player></white> paid <white><amount></white> into the bank."
    withdrawn-told: "<gray><white><player></white> took <white><amount></white> out of the bank."
    share: "<green>Your share of <guild><green>'s bank: <white><amount></white>."
  home:
    set-told: "<gray><white><player></white> moved the guild home to <white><where></white>."
    wait: "<red>Not so fast — the guild home is still there in <white><time></white>."
    warming-up: "<gray>Off to the guild home in <white><seconds></white>…"
    arrived: "<green>Home, at <guild><green>."
    cancelled: "<red>The trip home was called off: <white><why></white>."
    refused: "<red>The guild home cannot be reached right now: <white><why></white>."
  chat:
    guild: "<tag> <white><player></white><dark_gray>:</dark_gray> <gray><message>"
    officer: "<tag> <gold>[Officers]</gold> <white><player></white><dark_gray>:</dark_gray> <gray><message>"
    ally: "<tag> <green>[Allies]</green> <white><player></white><dark_gray>:</dark_gray> <gray><message>"
  ask:
    found: "<aqua>Type the guild's name and then its tag in chat, e.g. <white>The Elves ELF</white>. <gray>Or <white>cancel</white>."
    name: "<aqua>Type the guild's new name in chat. <gray>Or <white>cancel</white>."
    tag: "<aqua>Type the guild's new tag in chat. <gray>Or <white>cancel</white>."
    motd: "<aqua>Type the message of the day in chat. <gray>Or <white>cancel</white>."
    rank-name: "<aqua>Type the rank's name in chat. <gray>Or <white>cancel</white>."
    limit: "<aqua>Type the daily limit in chat, or <white>none</white>. <gray>Or <white>cancel</white>."
    deposit: "<aqua>Type how much to pay in. <gray>Or <white>cancel</white>."
    withdraw: "<aqua>Type how much to take out. <gray>Or <white>cancel</white>."
  perk:
    bought: "<gold><white><player></white> bought <white><perk></white> <white><rank></white> for the guild."
    respecced: "<gray><white><player></white> took every perk back. The points are there to spend again."
  prestige:
    announced: "<gold><guild><gold> went past the top and starts again — prestige <white><stars></white>! <gray>Their members earn <white>+<bonus>%</white> for good."
  crown:
    place: "<gold>Last week's guild race — <white>#<place></white>: <guild> <gray>(<xp> experience)"
    won: "<gold>♛ Your guild earned the most experience last week and wears the crown this week! <gray>+<points> perk point(s)."
    race-head: "<gold>This week's guild race:"
    race-line: "<gray><white>#<place></white> <guild> <dark_gray>— <xp> experience"
    race-empty: "<gray>Nobody has earned anything yet this week. Be first."
  vault:
    none: "<red>Your guild has no vault. <gray>Buy the Guild vault perk on <white>/guild perks</white>."
    full: "<red>The vault is full — what did not fit stays with you. <gray>More rows with the Guild vault perk."
    inventory-full: "<yellow>Your inventory is full; what did not fit went back into the vault."
    no-taking: "<red>Your rank cannot take things out of the vault. Putting things in is fine."
  contract:
    done: "<gold>Contract done: <white><contract></white>! <gray>The guild earns <white><reward></white> experience."
    status: "<gray><white><player></white> on <white><contract></white>: <white><progress></white>/<white><goal></white>."
    shared: "<gray>Told the guild."
  boost:
    started: "<gold>Guild experience boost: <white>+<percent>%</white> for <white><time></white>! <gray>Go and earn it."
    ended: "<gray>The guild experience boost is over."
  log:
    line: "<gray><white><what></white> <dark_gray>(<when>)</dark_gray> <detail>"
  usage:
    all: "<gray>/guild <dark_gray>— the guild page · <gray>/guild create <name> <tag> · info · list · level · contracts · perks · vault · crown · invite · join · leave · c <message> · home · deposit · ally"
    found: "<gray>/guild create <name> <tag> <dark_gray>— e.g. /guild create The Elves ELF"
    player: "<gray>Name a player."
    rank: "<gray>/guild rank <player> <rank>"
    chat: "<gray>/guild c <message> <dark_gray>· oc for officers · ac for allies"
    joining: "<gray>/guild joining <invite|apply|open>"
    which-invitation: "<gray>You have <white><count></white> invitations — say which guild: /guild accept <guild>"
    style: "<gray>/guild style tag|name <colours…> [bold] [animated] <dark_gray>— e.g. /guild style tag gold #ff5500 bold · /guild style name reset. From guild level <level>."
    admin: "<gray>/guild admin disband <guild> confirm · rename <guild> <name> · xp <guild> <amount> · give <guild> <amount> · leader <guild> <player> · boost <percent> <time>|off"
    prestige: "<yellow>Prestige takes the guild back to level 1 for a star, perk points and a lasting bonus — perks and points stay. <gray>Type <white>/guild prestige confirm</white>."
    boost: "<gray>/guild admin boost <percent> <time> <dark_gray>— e.g. 50 2h · or <gray>/guild admin boost off"
  style-unreadable: "<red><problem> <gray>Colours are chat colours (gold, aqua…) or #hex codes."
  style-locked: "<red>Your guild paints its tag and name from level <white><level></white>. Earn it first — fame is not free."
  outcome:
    success: "<green>Done."
    asked: "<green>Asked. <gray>They have been told."
    switched-off: "<red>That is switched off on this server."
    no-guild: "<red>You are in no guild. <gray>/guild to found or join one."
    already-in-guild: "<red>One guild at a time. Loyalty is the whole point."
    not-a-member: "<red>They are not in your guild."
    no-such-guild: "<red>That guild does not exist (any more)."
    no-such-rank: "<red>There is no such rank — or no rank further that way."
    not-allowed: "<red>Your rank cannot do that. Ambition noted."
    outranked: "<red>They rank as high as you, or higher. Nice try."
    yourself: "<red>That is you. Bold, but no."
    name-taken: "<red>Another guild already goes by that name."
    tag-taken: "<red>Another guild already wears that tag."
    name-too-short: "<red>That name is too short to be taken seriously."
    name-too-long: "<red>That name is longer than the guild's history will ever be."
    name-characters: "<red>Letters, digits, spaces, dashes and apostrophes only."
    name-banned: "<red>That name will not be happening."
    tag-too-short: "<red>That tag is too short."
    tag-too-long: "<red>That tag is too long — it goes in front of every name."
    tag-characters: "<red>A tag is letters and digits only."
    tag-banned: "<red>That tag will not be happening."
    full: "<red>The guild is full. A higher level makes room."
    closed: "<red>That guild takes members by invitation only."
    not-invited: "<red>There is no invitation like that waiting — or it ran out."
    already-invited: "<red>Already asked. Patience."
    already-applied: "<red>You applied already. Pestering rarely helps."
    no-application: "<red>There is no such application waiting."
    leader-must-hand-over: "<red>A leader does not just walk out. Hand the guild over first: <white>/guild leader</white> and a name."
    cannot-afford: "<red>You cannot afford that."
    bank-empty: "<red>The bank does not hold that much."
    over-daily-limit: "<red>That is more than your rank may take out today."
    economy-down: "<red>Money cannot move right now; nothing changed. Try again in a moment."
    invalid-amount: "<red>That is not an amount anybody can pay."
    no-home: "<red>The guild has no home yet."
    home-locked: "<red>The guild home unlocks at a higher level."
    style-locked: "<red>Colours for the tag and the name unlock at a higher guild level."
    too-many-allies: "<red>No ally slot free — on one side or the other. Levels bring more."
    already-allied: "<red>You are allied already."
    not-allied: "<red>You are not allied with them."
    already-rivals: "<red>They are your rivals already. Grudges do not stack."
    not-rivals: "<red>Your guild does not count them as rivals."
    same-guild: "<red>That is your own guild."
    rank-in-use: "<red>Somebody still holds that rank. Move them first."
    too-many-ranks: "<red>No room on the ladder for that."
    leader-rank: "<red>The leader's rank is not for changing or handing out."
    permission-not-held: "<red>You cannot hand out what you do not have."
    not-saved: "<red>That could not be saved, so nothing changed. Staff: guilds.db cannot be written."
    perk-maxed: "<red>That perk is as high as it goes."
    level-too-low: "<red>The guild's level is too low for that rank yet. Grind on."
    no-perk-points: "<red>No perk points left. <gray>Level up, prestige or win the weekly crown for more."
    nothing-to-respec: "<red>Nothing is bought yet, so there is nothing to take back."
    on-cooldown: "<red>Not again so soon."
    not-top-level: "<red>Prestige is for a guild at the top level. Not there yet."
    vault-not-empty: "<red>Empty the guild vault first — disbanding would destroy what is in it."
    vault-full: "<red>The vault is full."
