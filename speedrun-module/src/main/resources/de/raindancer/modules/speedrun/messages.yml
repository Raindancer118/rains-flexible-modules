# Rain's Speedrun — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins, and so
# does a host's bundled wording. See Messages.defineFrom.
speedrun:
  start:
    started: "<green>The countdown has begun for <white><players></white> player(s)."
    # The start block was pressed somewhere other than the lobby world it is bound to.
    wrong-world: "<yellow>This only starts a run in <white><world></white>."
    # A run is already counting down, running, paused or waiting to reset.
    not-ready: "<yellow>A run is already under way."
    # Nobody has set an advancement goal or a death policy — see the compass's menu.
    no-end-condition: "<yellow>Nothing is set to end the run yet — open the menu and pick one."
    # Should not really happen: whoever pressed it counts as a participant.
    no-participants: "<yellow>Nobody is here to race."
    # game-mode names a mode whose plugin is not installed — RainsManhunt, say.
    mode-missing: "<red>This lobby is set to play <white><mode></white>, and that plugin is not installed. Pick another game in the menu, or install it."
    # The mode's own setup threw. The console says what; this is what the player sees.
    mode-failed: "<red>The game mode could not start. The lobby is ready again — an admin should look at the console."
    # Somebody without rainsspeedrun.start pressed a start block anyway — one they kept, picked up
    # or was given. Says whose call it is rather than "nothing happened".
    not-allowed: "<yellow>Only staff can start a run here."
    # The world speedrun.yml points at is not currently loaded.
    world-missing: "<red>The lobby world is not loaded. Somebody should look at speedrun.yml."
  explosives:
    # A bed or a respawn anchor clicked in a dimension where this server's ruleset says it does not
    # go off. Said out loud rather than swallowed: a click that silently does nothing reads as lag.
    refused: "<yellow>That does not explode here."
  goal:
    # Picking an advancement in the chooser.
    set: "<green>Advancement goal set to <white><advancement></white>."
    # Pressing "No advancement goal" in the chooser.
    cleared: "<yellow>Advancement goal cleared — a death is now the only way a run can end."
  # Sent to every participant still online the moment a run ends, so they hear what settled it and
  # how long it took even if they were not looking at a boss bar or a scoreboard.
  finished: "<gold>Run finished! <white><reason></white> — <white><time></white>."
  lemmemove:
    done: "<green>Released <white><player></white> from the movement freeze."
    no-permission-for-others: "<red>You may only release yourself — not somebody else."
    player-not-found: "<red>No online player named <white><player></white>."
    console-needs-a-player: "<red>Console must name a player: /lemmemove <player>."
  # Undoing one of those — /freezeagain. Its own branch rather than a second line under lemmemove:
  # what is said about taking a head start back is not what is said about handing one out.
  freezeagain:
    done: "<green>Froze <white><player></white> again — the movement freeze applies to them once more."
    # A release nobody had. Said rather than confirmed: a typo'd name is the likeliest way to get
    # here, and a cheerful "done" is how somebody walks away believing a head start was taken back.
    not-released: "<yellow><player> was not released from the movement freeze; there was nothing to undo."
    no-permission-for-others: "<red>You may only freeze yourself again — not somebody else."
    player-not-found: "<red>No online player named <white><player></white>."
    console-needs-a-player: "<red>Console must name a player: /freezeagain <player>."
  starthere:
    only-a-player: "<red>Only a player standing in the lobby world can set the start point."
    wrong-world: "<yellow>This only sets a start point in <white><world></white>."
    # Says out loud that it does not survive a reset: the coordinates are in a world the reset
    # deletes, and the one that comes back is generated from a new seed.
    done: "<green>Start point set — every racer will be teleported here when a countdown begins. <gray>It is forgotten when the world resets."
  reset:
    # Chat confirmation, with a [Yes] button after it that expires.
    confirm: "<red>This deletes <white><world></white>, its nether and its End and makes new ones. Sure?"
    console-confirm: "<yellow>This deletes the run's worlds. Type <white>/speedrun reset confirm</white> to do it."
    done: "<green>The run has been ended and the world is being deleted and remade."
    countdown-in-progress: "<yellow>A countdown is already under way; let it finish, or let it start, then reset."
  # /speedrunresume — a run over the world as it stands, after a restart.
  resume:
    ask: "<yellow>Type the time the run had reached, e.g. <white>42:05</white> or <white>0</white>."
    done: "<green>Run resumed at <white><time></white> with <white><players></white> player(s), where they stand and with what they carry."
    not-ready: "<yellow>A run is already under way or counting down — only a ready or finished lobby can be resumed."
  # /speedruntime and /speedrunresume's time.
  time:
    ask: "<yellow>Type the time the clock should read, e.g. <white>42:05</white>."
    usage: "<yellow>/speedruntime <time> — e.g. 42:05, 1:02:03 or 1h30m"
    unreadable: "<red><white><time></white> is not a time. Try 42:05, 1:02:03 or 1h30m."
    set: "<green>The run's clock now reads <white><time></white>."
    no-run: "<yellow>No run is being played, so there is no clock to set."
  spectate:
    only-a-player: "<red>Only a player can register as not racing."
    on: "<yellow>You are now registered as not racing — pressing the start block will skip you."
    off: "<green>You are racing again — pressing the start block will include you."
  join:
    only-a-player: "<red>Only a player can go to the speedrun lobby."
    # Sent after /speedrun took somebody to the lobby; a button to the menu follows it.
    welcome: "<green>Welcome to the speedrun lobby."
    world-missing: "<red>The lobby world <white><world></white> is not loaded. Somebody should look at speedrun.yml."
  # Asking somebody to type something in chat.
  ask:
    cancel-hint: "<gray>Type <white>cancel</white> to leave it."
    cancelled: "<gray>Left as it was."
    busy: "<red>You are already being asked something — answer that first, or type cancel."
  # /speedrun with a word after it.
  command:
    unknown: "<yellow><white><word></white> is not something /speedrun does. Here is what it does:"
    staff-only: "<red>/speedrun <word> is for staff."
    only-a-player: "<red>That one opens a menu — it needs a player."
    no-such-player: "<red>Nobody called <white><player></white> has played here."
    help-header: "<gold>/speedrun — everything the lobby does:"
    help-line: "<white><usage></white> <gray>— <what>"
  # /speedrun check: one line per check.
  check:
    clear: "<green>Everything a run needs is in place."
    not-clear: "<yellow>Not ready yet:"
    ok: "<green>✔ <white><check></white> <gray><detail>"
    problem: "<red>✘ <white><check></white> <gray><detail>"
    warning: "<yellow>! <white><check></white> <gray><detail>"
  # What a one-click fix says once it is done.
  fix:
    worlds-created: "<green>The run's worlds are there now."
    plain-race: "<green>The lobby plays a plain race now."
    dragon-goal: "<green>The goal is killing the dragon now."
    brought: "<green><players> player(s) sent to the lobby."
    no-kit: "<green>The practice kit is off; runs are ranked again."
    random-seed: "<green>Every new world gets a new random seed."
  # Where somebody sees their splits.
  hud:
    now: "<green>Your splits are shown: <white><place></white>."
    unknown: "<red><white><place></white> is not a place — sidebar, bossbar, actionbar or off."
  # Every split, the moment it happens; how it compares follows in colour.
  split:
    reached: "<gray>Split <white><milestone></white> at <yellow><time></yellow>"
    reached-by: "<gray>Split <white><milestone></white> at <yellow><time></yellow> by <white><player></white>"
    gold-title: "<gold>Gold split!"
    gold-subtitle: "<yellow><milestone></yellow> <white><time></white> — faster than ever"
  # What a racer is told once a run is over and kept.
  result:
    record: "<gold>New server record: <white><time></white> in <category>!"
    personal-best: "<green>New personal best: <white><time></white> in <category>!"
    behind: "<gray>Your best in <category> is <white><best></white> — this one was <white><behind></white> slower."
    not-ranked: "<gray>Kept in the history, but not ranked: <reason>."
    seed: "<gray>Seed: <white><seed></white>"
  seed:
    ask: "<yellow>Type the seed — a number, or a word the way the create-world screen takes one."
    ask-pool: "<yellow>Type the seeds of the pool, separated by commas."
    set: "<green>Every new world is made from seed <white><seed></white>."
    pool-set: "<green>Every new world gets one of <white><count></white> seeds."
    same-next: "<green>The next reset remakes this exact map. It is ranked as a set seed."
    this-world: "<gray>This world's seed: <white><seed></white>"
  setup:
    offer: "<gold>The speedrun lobby has not been set up yet."
  stats:
    none: "<gray><player> has not raced here yet."
    header: "<gold><player></gold> <gray>— <runs> run(s), <finished> reached the goal"
    best: "<white><category></white> <gray>best <gold><time></gold>, record <white><record></white>"
  top:
    header: "<gold>Leaderboard — <category>"
    line: "<gold>#<place></gold> <white><time></white> <gray><players>"
    empty: "<gray>No ranked run in this category yet."
