# Rain's OneBlock — what the islands are made of.
#
# Written to plugins/RainsOneBlock/content.yml the first time the island server starts; edit that copy and run
# /islandadmin reload. Names are Minecraft's own ids (coal_ore, cow), without "minecraft:".
#
# How a break works: every installed block or mob upgrade of that dimension takes part in ONE roll. Their level
# chances add up (two 5% upgrades mix in 10% of the breaks). A roll that hits none of them picks from the
# dimension's pool by weight. A mob upgrade spawns its mob on top and leaves the block to the pool.

shards:
  # One award every this many breaks, all of an island's blocks counted together.
  every-blocks: 10
  amount: 1

# What opening a dimension costs, in shards. Only the island's owner can buy it.
unlock:
  nether: 400
  end: 1200

# The most players on one island, the owner included.
team-size: 6

# A mob upgrade stops spawning once this many of its kind are within 16 blocks of the block.
mob-cap: 12

pools:
  overworld:
    grass_block: 20
    dirt: 18
    oak_log: 18
    stone: 18
    oak_leaves: 6
    cobblestone: 6
    ice: 3
    clay: 3
    moss_block: 2
    pumpkin: 1
    melon: 1
    hay_block: 1
  nether:
    netherrack: 50
    soul_sand: 10
    soul_soil: 8
    basalt: 8
    blackstone: 8
    magma_block: 5
    crimson_stem: 4
    warped_stem: 3
    nether_wart_block: 4
    nether_quartz_ore: 4
    nether_gold_ore: 3
    glowstone: 3
  end:
    end_stone: 70
    purpur_block: 8
    end_stone_bricks: 5
    obsidian: 4

