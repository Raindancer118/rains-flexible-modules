# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.
# A line the owner rewrote in plugins/RainsCore/messages.yml wins in both tones.

essentials:
  tokens:
    sky-cleared: "<yellow><player></yellow> <gray>cleared the sky with a Clear Sky Token."
    dawn-came: "<yellow><player></yellow> <gray>skipped the night with a Dawn Token."
  spawn:
    arrived: "<green>You have arrived at spawn."
  msg:
    not-yourself: "<red>You cannot message yourself."
    nobody-to-reply-to: "<red>Nobody has messaged you yet."
  ignore:
    started: "<green>You will no longer see messages from <white><player></white>."
  nick:
    taken: "<red><white><detail></white> is somebody's real name. Pick another."
  enchant:
    applied: "<green>Done: <white><enchantment></white> on your <white><item></white>."
  repair:
    not-damageable: "<red>That cannot wear out, so there is nothing to repair."
  afk:
    back-quiet: "<gray>Welcome back."
  congrats:
    yourself: "<gray>You cannot congratulate yourself. Let the others do it."
  welcome:
    hi-yourself: "<gray>You cannot say hi to yourself. Let the others do it."

  rules:
    header: "<gold>Server rules"
    none: "<gray>There are no rules yet."
    no-such: "<red>There is no rule <white><number></white>."
    blank: "<red>That is empty."
    too-long: "<red>Too long — <white><limit></white> characters at most."
  admin:
    entered: "<green>Admin mode on. <gray>Your own inventory is stored; <white>/admin</white> brings it back."
    left: "<green>Admin mode off. <gray>Your own inventory is back."
    already-in: "<gray>You are already in admin mode."
  fun:
    switched-off: "<red>/<command> is switched off on this server."
    cooling-down: "<yellow>You can do that again in <white><seconds>s</white>."
