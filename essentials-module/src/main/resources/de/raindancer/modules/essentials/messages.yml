
essentials:

  # ── general ──────────────────────────────────────────────────────────────
  only-a-player: "<red>Only a player can do that."
  no-permission: "<red>You may not do that."
  usage: "<gray>Usage: <white><usage>"
  no-such-player: "<red>The server has never seen anybody called <white><player></white>."
  player:
    offline: "<red><white><player></white> is offline right now."
    selector-refused: "<red>Selectors like <white><selector></white> are not yours to use here, or that one is malformed. Type a name instead."
    ambiguous: "<red><white><selector></white> matches <white><count></white> players, and this wants exactly one."
  already-travelling: "<red>You are already on your way somewhere."
  could-not-check: "<red>Could not check whether that is safe. Nothing has happened."
  teleport-refused: "<red>Something stopped that teleport. Nothing has happened."
  cannot-schedule: "<red>Could not start that. Try again in a moment."

  # ── /spawn and /setspawn ─────────────────────────────────────────────────
  spawn:
    not-set: "<red>No spawn point has been set yet."
    world-gone: "<red>Spawn's world is not loaded right now."
    warming-up: "<gray>Heading to spawn in <white><seconds></white>…"
    arrived: "<green>You have arrived at spawn. Home sweet default."
    set: "<green>Spawn is now here."
    cancelled:
      moved: "<yellow>You moved, so the trip to spawn was cancelled."
      hurt: "<yellow>You were hurt, so the trip to spawn was cancelled."
    nowhere-safe: "<red>Nowhere safe was found near spawn. Nothing has happened."

  # ── private messages ─────────────────────────────────────────────────────
  msg:
    not-yourself: "<red>You cannot message yourself. Try a notebook."
    sent: "<gray>[me → <white><player></white>] <text>"
    received: "<gray>[<white><player></white> → me] <text>"
    nobody-to-reply-to: "<red>Nobody has messaged you yet. Popularity takes time."

  # ── ignoring ──────────────────────────────────────────────────────────────
  ignore:
    started: "<green>You will no longer see messages from <white><player></white>. Blissful silence."
    stopped: "<green>You can hear from <white><player></white> again."
    not-ignoring: "<gray>You were not ignoring <white><player></white>."
    none: "<gray>You are not ignoring anybody."
    list: "<gray>Ignoring: <white><players>"

  # ── /seen ─────────────────────────────────────────────────────────────────
  seen:
    never: "<gray>The server has never seen <white><player></white>."
    online: "<white><player></white> <green>is online right now. <gray>(<playtime> played)"
    offline: "<white><player></white> <gray>was last seen <white><ago></white> ago. (<playtime> played)"

  # ── /players ──────────────────────────────────────────────────────────────
  players:
    header: "<gray>Everybody this server has seen (<count>):"
    none: "<gray>This server has not seen anybody yet."

  # ── nicknames ─────────────────────────────────────────────────────────────
  nick:
    switched-off: "<red>Nicknames are switched off on this server."
    set: "<green>You are now known as <nickname>."
    cleared: "<green>Back to your own name."
    blank: "<red>A nickname cannot be blank."
    too-long: "<red>That is too long. <white><detail></white> characters at most, not counting colour."
    taken: "<red><white><detail></white> is somebody's real name. Pick another — identity theft is frowned upon."
    blocked: "<red>That name is not allowed here. Pick another."
    selector-like: "<red>A nickname starting with <white>@</white> would make every command think you meant @a and friends. Try it without."
    command-like: "<red>A nickname cannot start with <white>/</white> — the server would read it as a command."
    nick-taken: "<red>Somebody already goes by <white><detail></white>. Two of them would make every <white>/msg</white> ambiguous, so pick another."
    # Staff setting and clearing somebody else's.
    not-others: "<red>Other people's nicknames are staff business. You may change your own."
    set-other: "<green><white><player></white> is now known as <nickname>."
    set-by-staff: "<yellow>A staff member gave you a new name: <nickname><yellow>."
    cleared-other: "<green><white><player></white> is back to their own name."
    cleared-by-staff: "<yellow>A staff member took your nickname off. You are yourself again."
    none-to-clear: "<gray><white><player></white> has no nickname to take off."
    # What staff see, at once, when somebody tries one — never shown to the player themselves, who
    # only ever gets the plain "blocked" refusal above.
    blocked-report: "<red>⚑ <white><player></white> <gray>tried the blocked nickname <white><attempted></white>."
    blocked-report-banned: "<red>⚑ <white><player></white> <gray>tried the blocked nickname <white><attempted></white> <red>and has been banned for a day."

  # ── /enchant ──────────────────────────────────────────────────────────────
  enchant:
    unknown: "<red>There is no enchantment called <white><enchantment></white>. Tab completion shows the available ones."
    nobody-there: "<red>Nobody here answers to <white><player></white>."
    nothing-held: "<red>Nothing in the hand to enchant."
    not-others: "<red>Enchanting what somebody else is holding is staff business."
    wrong-item: "<red><white><enchantment></white> cannot be applied to that item."
    too-high: "<red>Vanilla stops at <white><detail></white> for that enchantment, and so do you, without the beyond-max permission."
    level-range: "<red>Levels run from <white>1</white> to <white>255</white>, and <white>0</white> takes it off."
    not-on-item: "<red>That enchantment is not on the item, so there is nothing to take off."
    applied: "<green>Done: <white><enchantment></white> on your <white><item></white>. Shiny."
    removed: "<green><white><enchantment></white> is off your <white><item></white>."
    applied-other: "<green><white><enchantment></white> is now on <white><player></white>'s <white><item></white>."
    removed-other: "<green><white><enchantment></white> is off <white><player></white>'s <white><item></white>."
    by-staff: "<yellow>A staff member changed your <white><item></white>: <white><enchantment></white>. Check the tooltip."
    cleared: "<green>Stripped <white><count></white> enchantment(s) off."
    cleared-other: "<green>Stripped <white><count></white> enchantment(s) off <white><player></white>'s item."
    nothing-to-clear: "<gray>There is nothing on it to strip."

  # ── /repair and /repairall ────────────────────────────────────────────────
  tokens:
    sky-cleared: "<yellow><player></yellow> <gray>used a Clear Sky Token. The clouds have somewhere else to be."
    dawn-came: "<yellow><player></yellow> <gray>used a Dawn Token. Good morning."
    no-sky: "<red>There is no sky here to change. Your token is still yours."
    already-clear: "<gray>The sky is already clear. Your token is still yours."
    already-day: "<gray>It is already day. Your token is still yours."
    given: "<green>Gave <white><amount></white> <token>(s) to <white><player></white>."
    received: "<green>You got <white><amount></white> <token>(s). Right-click one to use it."
    not-online: "<red><white><player></white> is not online right now."
    cannot-make: "<red>The token item could not be made. The console says why."
  repair:
    nobody-there: "<red>Nobody here answers to <white><player></white>."
    not-others: "<red>Repairing somebody else's things is staff business."
    not-all: "<red>Repairing the whole inventory at once is not permitted for you. Repair one item at a time."
    nothing-held: "<red>Your hands are empty. There is nothing to repair."
    not-damageable: "<red>That cannot wear out, so there is nothing to repair. Dirt is immortal."
    already-fine: "<gray>It is already in perfect condition."
    hand: "<green>Your <white><item></white> has been repaired."
    hand-other: "<green><white><player></white>'s <white><item></white> has been repaired."
    all: "<green>Repaired <white><things></white>."
    all-none: "<gray>Nothing you carry needs repairing."
    all-none-other: "<gray>Nothing <white><player></white> carries needs fixing."
    all-other: "<green>Fixed up <white><things></white> for <white><player></white>."
    by-staff: "<yellow>A staff member repaired your things: <white><what></white>."

  # ── the in-game blocklist editor, /blocklist ─────────────────────────────
  blocklist:
    type-a-name: "<gray>Type the name to add. <dark_gray>You have thirty seconds."
    already-asking: "<red>You are already being asked something else. Finish that conversation first."
    added: "<green>Added <white><name></white> to <white><category></white>."
    removed: "<yellow>Removed <white><name></white> from <white><category></white>."

  # ── AFK ───────────────────────────────────────────────────────────────────
  afk:
    went: "<gray>* <white><player></white> is now AFK."
    back: "<gray>* <white><player></white> is back."
    went-quiet: "<gray>You are now marked AFK."
    back-quiet: "<gray>Welcome back. We kept your seat warm."

  # ── the Congrats! button under an advancement ────────────────────────────
  congrats:
    button: "<gold>[Congrats!]"
    tooltip: "<gray>Cheers them on in chat"
    yourself: "<gray>Congratulating yourself? Respect the confidence. Let the others do it, though."
    already: "<gray>You already cheered."

  # ── joining and leaving ───────────────────────────────────────────────────
  welcome:
    first-join: "<gold>Welcome <white><player></white> to the server for the first time!"
    joined: "<gray>+ <white><player></white> joined."
    hi-button: "<green>[Say Hi!]"
    hi-tooltip: "<gray>Says hello to them in chat"
    hi-yourself: "<gray>Saying hi to yourself? Bold move. Maybe let the others do it."
    hi-already: "<gray>You already said hi."
    quit: "<gray>- <white><player></white> left."

  # ── /rules ────────────────────────────────────────────────────────────────
  # <title> and <text> are the rule's own words, shown exactly as written.
  rules:
    header: "<gold>The rules. Yes, all of them."
    line: "<gold><number>.</gold> <white><title></white> <gray>— <text>"
    line-off: "<dark_gray><number>. <strikethrough><title></strikethrough> (switched off) — <text>"
    penalties: "<dark_gray>    ↳ breaking it: <red><penalties>"
    type-penalties: "<gray>Type what breaking it costs, first time first: <white>warn, mute 1h, ban 3d, ban</white>. <dark_gray>Kinds: warn, kick, mute, freeze, ban; a ban without a length is for good. You have a minute."
    penalties-set: "<green>Breaking it now costs — <white><penalties></white>."
    penalties-cleared: "<yellow>No fixed punishment for it any more; staff decide each time."
    penalties-unreadable: "<red><white><typed></white> is not a punishment ladder. Write it like <white>warn, mute 1h, ban 3d, ban</white>."
    none: "<gray>No rules yet. Technically, that makes this anarchy."
    no-such: "<red>There is no rule <white><number></white>. Count again."
    edit-button: "<gold>[Edit the rules]"
    edit-tooltip: "<gray>Opens the rule editor"
    type-title: "<gray>Type the rule's title in chat. <dark_gray>You have a minute."
    type-text: "<gray>Now type what the rule says. <dark_gray>You have a minute."
    type-preset-name: "<gray>Type a name for the preset. <dark_gray>Letters, digits and dashes; you have a minute."
    already-asking: "<red>You are already being asked something else. Finish that conversation first."
    blank: "<red>That is empty. Rules need words, ideally several."
    too-long: "<red>Too long — <white><limit></white> characters at most. Brevity is a virtue, and also a limit."
    added: "<green>Rule <white><number></white> added: <white><title></white>."
    saved: "<green>Saved."
    gone: "<red>That rule is gone — somebody removed it in the meantime."
    removed: "<yellow>Removed the rule <white><title></white>."
    icon-empty-hand: "<red>Your hand is empty. Hold the item you want as the icon, then right-click again."
    preset:
      header: "<gold>Rule presets:"
      line: "<white><name></white> <gray>— <description> (<count> rules)"
      none: "<gray>No presets. Keep the current rules as one with <white>/rules preset save [name]</white>."
      no-such: "<red>There is no preset called <white><name></white>."
      bad-name: "<red><white><name></white> cannot be a preset name. Letters, digits and dashes only."
      applied: "<green>The rules are now those of <white><name></white>: <white><count></white> of them."
      saved: "<green>The current <white><count></white> rule(s) are kept as the preset <white><name></white>."
      replaced: "<green>The preset <white><name></white> now holds the current <white><count></white> rule(s)."
      deleted: "<yellow>The preset <white><name></white> is deleted."
      could-not-save: "<red>Could not write the presets file. The console says why."
      confirm-apply: "<yellow>This replaces every rule in use with those of <white><name></white>. Click below, or type <white><command></white>."
      confirm-delete: "<yellow>This deletes the preset <white><name></white> for good. Click below, or type <white><command></white>."
      confirm-button: "<red>[Yes, do it]"
      showing: "<gold>Rules in the preset <white><name></white>:"
      took: "<green>Added <white><title></white> as rule <white><number></white>."
      already-have: "<gray>You already have <white><title></white>. Once is enough, even for good advice."

  # ── /admin ────────────────────────────────────────────────────────────────
  admin:
    entered: "<green>Admin mode on. <gray>Your own things are packed away safely; <white>/admin</white> brings them back."
    left: "<green>Admin mode off. <gray>Everything is back exactly where you left it."
    already-in: "<gray>You are already in admin mode. Any more admin and you would be the server."
    not-in: "<gray>You are not in admin mode."
    still-in: "<yellow>You are still in admin mode. <gray><white>/admin</white> to leave it."
    status-in: "<yellow>You are in admin mode."
    status-out: "<gray>You are not in admin mode."
    bypass-on: "<gold>Bypass on: <gray>admin items are not kept apart for you — drop, pick up, store, trade. <dark_gray>Logged. /admin bypass again to stop."
    bypass-off: "<green>Bypass off: <gray>admin items are kept apart again."
    bypass-not-in: "<red>Bypass is for admin mode. <gray><white>/admin</white> first."
    switched-off: "<red>Admin mode is switched off on this server."
    permission-gone: "<yellow>You may no longer use admin mode, so you are back in your own inventory."
    could-not-save: "<red>Could not write the inventory to disk, so nothing was switched. The console says why."
    unreadable: "<red><white><count></white> item(s) there cannot be read by this server right now, so nothing was switched. Switching would lose them."
    bar: "<red><bold>ADMIN MODE</bold></red> <gray>— /admin to leave"
    file-broken: "<red>Your admin-mode file cannot be read, so you stay in admin mode until staff fix it. Nothing was switched."
    kept-apart: "<red>Admin items stay on the admin side. <gray>Leave admin mode with <white>/admin</white> for that."
    look-only: "<gray>Admin mode: you can look in here, but not take or put anything."

  # ── /roast and /joke ──────────────────────────────────────────────────────
  # Said in chat as whoever asked, so they are plain text: no colours, and a mute stops them.
  # Dealt like cards: every line comes round once before any repeats. Add, remove or reword freely.
  fun:
    # <command> is roast or joke.
    switched-off: "<red>/<command> is switched off on this server. Comedy has been cancelled."
    cooling-down: "<yellow>Give the audience <white><seconds>s</white> to recover first. Timing is everything."
    # <target> is who is being roasted; without a name, the one asking roasts themselves.
    roasts:
      - "<target>, you mine straight down and call it a strategy."
      - "<target> has died to the same creeper so often it now sends them birthday cards."
      - "<target>, your house is a dirt cube with a door. The door is also dirt."
      - "<target> brought a wooden sword to the Ender Dragon and called it a warm-up."
      - "<target> uses a fishing rod to catch nothing but compliments, and has caught none so far."
      - "<target>, even villagers raise their prices when they see you coming."
      - "<target> has the survival instincts of a sheep standing on a cliff."
      - "<target>, your redstone works exactly once and then never again, like a firework."
      - "<target> once lost a fight to a baby zombie riding a chicken. The chicken did most of the work."
      - "<target>, you are the reason servers have a death counter."
      - "<target> navigates by compass, sunlight and pure panic, mostly panic."
      - "<target>, your farm produces exactly one carrot a week and a lot of disappointment."
      - "<target> calls it a mega base. Everyone else calls it a hole."
      - "<target>, Endermen avoid eye contact with you out of pity."
      - "<target> is so lost the map has started drawing question marks."
      - "<target>, you have the aim of a skeleton in daylight. On fire. Blindfolded."
      - "<target> has opened every chest in the dungeon and still found a way to be empty-handed."
      - "<target>, the Wither took one look at your build and spawned somewhere else."
      - "<target> has more deaths than diamonds, and they have zero diamonds."
      - "<target>, your inventory looks like a hopper exploded in a junk shop."
      - "<target> tried to tame a wolf with rotten flesh and called it diplomacy."
      - "<target>, even the phantoms skip you. You are not worth the flight."
      - "<target> builds like the instructions were written in the Enchanting Table alphabet."
      - "<target>, you jumped into lava to check whether it was hot. It was."
      - "<target> thinks a beacon is a fancy lamp, and honestly, in their hands, it is."
      - "<target>, you would lose a staring contest to a painting."
      - "<target> has the reflexes of a sloth on slow falling."
      - "<target>, the Nether has a ceiling just so you cannot climb out of your own mistakes."
      - "<target> still punches trees for wood. Not to save time, just out of habit."
      - "<target>, your pickaxe has seen more of the sky than the inside of a cave."
      - "<target> got lost in a two-by-two room and filed a complaint about the layout."
      - "<target>, your PvP style is called crouching and hoping."
      - "<target> is the only person who can trip over a carpet in a straight corridor."
      - "<target>, even the cobblestone generator works harder than you."
      - "<target> built a nether portal, walked through it, and asked where the Nether was."
      - "<target>, your skin is so dated it still uses the old cow texture."
      - "<target> once traded an emerald for a stick. On purpose. They were proud."
      - "<target>, if brains were XP, you would still be level zero with a bad bottle."
      - "<target> has been AFK since the last update and nobody noticed a difference."
      - "<target>, your elytra flights end in walls more often than in landings."
      - "<target> sleeps through every night and still somehow looks tired in every screenshot."
      - "<target>, your tunnels are so crooked the silverfish get motion sickness."
      - "<target> named their dog Diamond because it is the closest they will ever get."
      - "<target>, the iron golem follows you around because it thinks you need supervision."
      - "<target> uses a bed in the Nether as a light source. Every time."
      - "<target>, your castle has the defensive strength of a wet sponge."
      - "<target> once brought a bucket of water to a fire and dropped the bucket instead."
      - "<target>, Steve called. He wants his strategy back. Actually, no, he does not."
      - "<target> has more unfinished projects than a creeper has hugs."
      - "<target>, you are proof that respawning does not come with an upgrade."
      - "<target> confused a slime with a friend and is still waiting for a reply."
      - "<target>, the only thing you have ever enchanted is your excuses."
      - "<target> builds symmetry by accident and asymmetry by talent."
      - "<target>, your loot from the End city was a feeling of regret."
      - "<target> plays hardcore mode by accident, every single time."
      - "<target>, you could get lost in a superflat world."
      - "<target> has taken fall damage from a single block. Twice. In one day."
      - "<target>, the ender pearl cooldown exists purely to slow you down."
      - "<target> gave a villager a job and the villager quit."
      - "<target>, your crop rows are so uneven the bees refuse to work there."
      - "<target> treats the recipe book as a novel they never finish."
      - "<target>, the dragon egg would rather stay in the End than go home with you."
      - "<target> keeps their valuables in a chest labelled valuables, next to spawn, unlocked."
      - "<target>, your armour is so damaged even the anvil said too expensive."
      - "<target> found a stronghold, admired it, and then forgot where it was."
      - "<target>, you are the human equivalent of a cracked stone brick: decorative, not useful."
      - "<target> once ran from a chicken. Not a jockey. Just a chicken."
      - "<target>, your best invention was a door that lets mobs in and keeps you out."
    # Terrible on purpose. The worse, the better.
    jokes:
      - "Why did the creeper break up with the skeleton? It felt the relationship was going to blow up."
      - "What do you call a sheep with no legs? A cloud."
      - "Why did the scarecrow win an award? Because he was outstanding in his field."
      - "How does a pickaxe say goodbye? Mine you later."
      - "What is a skeleton's favourite instrument? The trom-bone."
      - "Why do Endermen never tell jokes? They cannot handle eye contact with the audience."
      - "What did the zero say to the eight? Nice belt."
      - "Why do cows wear bells? Because their horns do not work."
      - "How do you make a tissue dance? Put a little boogie in it."
      - "What do you call a fake noodle? An impasta."
      - "Why did the bicycle fall over? It was two tired."
      - "What does a zombie eat for breakfast? Ghoul-tons."
      - "Why was the pig red? It had been bacon in the sun."
      - "What do you call a creeper with a sunburn? Well done."
      - "Why did the villager sit on the clock? He wanted to be on time."
      - "What do you call a bear with no teeth? A gummy bear."
      - "Why did the chicken join a band? Because it had the drumsticks."
      - "How do you organise a space party? You planet."
      - "Why do fish live in salt water? Because pepper makes them sneeze."
      - "What did one wall say to the other? I will meet you at the corner."
      - "Why did the tomato blush? It saw the salad dressing."
      - "What did the ocean say to the beach? Nothing, it just waved."
      - "What do you call a dinosaur that is sleeping? A dino-snore."
      - "Why can't a nose be twelve inches long? Then it would be a foot."
      - "What do you call a pile of cats? A meow-ntain."
      - "Why did the golem go to therapy? It had too many iron issues."
      - "What do you call cheese that is not yours? Nacho cheese."
      - "How does a creeper party? It just has a blast."
      - "Why did the cookie go to the doctor? It was feeling crummy."
      - "What do you call a sleeping bull? A bulldozer."
      - "Why don't eggs tell jokes? They would crack each other up."
      - "What do you call a boomerang that will not come back? A stick."
      - "Why was the maths book sad? It had too many problems."
      - "What did the left eye say to the right eye? Between you and me, something smells."
      - "What do you get when you cross a snowman with a vampire? Frostbite."
      - "Why did the Enderman get a job at the post office? He is great at picking up blocks."
      - "How do you catch a squirrel? Climb a tree and act like a nut."
      - "What did the grape do when it got stepped on? It let out a little wine."
      - "Why did the coffee file a police report? It got mugged."
      - "What is brown and sticky? A stick."
      - "What do you call a deer with no eyes? No idea."
      - "Why did the golfer bring two pairs of trousers? In case he got a hole in one."
      - "What do you call a man with a rubber toe? Roberto."
      - "Why are ghosts bad liars? You can see right through them."
      - "What did the furnace say to the raw iron? You are smelting my heart."
      - "Why did the slime refuse to fight? It was having a sticky day."
      - "What is a witch's favourite subject at school? Spelling."
      - "Why did the music teacher need a ladder? To reach the high notes."
      - "What do you call an alligator in a vest? An investigator."
      - "How do bees get to school? On the school buzz."
      - "Why did the computer go to the doctor? It had a virus."
      - "What kind of tree fits in your hand? A palm tree."
      - "Why do bees have sticky hair? Because they use honeycombs."
      - "What do you call a parrot that flew away? A polly-gone."
      - "What do you call a cow in an earthquake? A milkshake."
      - "Why did the horse sneeze? It had a little colt."
      - "What do you call a skeleton who will not work? Lazy bones."
      - "Why did the student eat his homework? The teacher said it was a piece of cake."
      - "What did the big flower say to the little flower? Hi, bud."
      - "Why don't skeletons fight each other? They don't have the guts."
      - "What did the piglin say when it got gold? This is worth its weight in me."
      - "Why was the broom late? It over-swept."
      - "What has four wheels and flies? A rubbish truck."
      - "Why did the lava refuse to argue? It did not want things to get heated."
      - "What do you call a pig that does karate? A pork chop."
      - "Why did the miner bring a ladder to the bar? He heard the drinks were on the house."
      - "What did the bee say to the flower? Hello, honey."
      - "Why can't you trust stairs? They are always up to something."
