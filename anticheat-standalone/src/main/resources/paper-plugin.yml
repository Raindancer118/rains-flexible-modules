# Same shape as every other standalone here — see rtp-standalone's copy for why each line matters.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '26.3'
description: 'Server-side anti-cheat: movement, combat, world, inventory and packet checks.'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# Every player is checked on their own entity scheduler; nothing uses Bukkit.getScheduler().
folia-supported: true

dependencies:
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
