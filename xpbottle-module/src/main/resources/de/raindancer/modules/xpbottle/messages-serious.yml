# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.
# A line the owner rewrote in plugins/RainsCore/messages.yml wins in both tones.

xpbottle:
  only-a-player: "<red>Only a player standing in the world can open that."
  filled: "<green>Bottled <white><points></white> experience points."
  poured: "<green><white><points></white> experience points returned."
  bottle-full: "<red>That bottle will not hold any more. It is full."
  already-empty: "<red>There is nothing in that bottle."
  no-experience: "<red>You have no experience to bottle."
  wait: "<red>You may bottle again in <white><seconds></white> second(s)."
  menu:
    not-allowed: "<red>You may not open that."
  pour:
    not-allowed: "<red>You may not pour a bottle out."
  siphon:
    full: "<green>The siphon bottle is full."
  give:
    not-allowed: "<red>Only staff can conjure a siphon bottle."
    unknown: "<red>Nobody called <player> that this server knows. Check the spelling."
    selector-refused: "<red><selector> is not yours to use, or not written right. A name works too."
    selector-nobody: "<yellow><selector> did not match anybody, so no bottle was given."
    bad-tier: "<red><tier> is not a tier; this server has I to <highest>."
    given: "<green>A tier <white><tier></white> siphon bottle went to <white><player></white>."
    given-many: "<green>A tier <white><tier></white> siphon bottle went to <white><count></white> players."
    received: "<green>You were given a tier <white><tier></white> siphon bottle."
