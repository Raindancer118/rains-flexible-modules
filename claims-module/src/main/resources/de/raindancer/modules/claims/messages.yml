# ─────────────────────────────────────────────────────────────────────────────
#  What the claims module says.
#
#  Edit anything here and it wins: this file sits above the wording built into
#  the jar, and above anything the module set in code. See RainsCore's Messages
#  for the four layers.
#
#  <angle-brackets> are values filled in at the moment the line is sent. Colours
#  are MiniMessage, so <red>, <gradient:...> and the rest all work.
# ─────────────────────────────────────────────────────────────────────────────

prefix: "<dark_gray>[<gradient:#4ade80:#22d3ee>Claims</gradient><dark_gray>] "

claim:
  # ── the everyday ones ────────────────────────────────────────────────────
  created: "<green>Claimed <white><claim></white> — <gray><area> blocks, y <min-y> to <max-y>."
  resized: "<green><white><claim></white> redrawn: <gray><area> blocks, y <min-y> to <max-y>."
  renamed: "<green>Renamed <gray><old></gray> to <white><claim></white>."
  help: |
    <gradient:#4ade80:#22d3ee>Your land</gradient>
    <gray>/claim<dark_gray> — your claims
    <gray>/claim stick<dark_gray> — the marking-out tool
    <gray>/claim new<dark_gray> — mark out a new one
    <gray>/claim here<dark_gray> — the claim you are standing in
    <gray>/claim show<dark_gray> · <gray>hide<dark_gray> — draw the borders
    <gray>/claim trust <white>somebody<dark_gray> · <gray>untrust<dark_gray>
    <gray>/claim ban <white>somebody<dark_gray> · <gray>unban<dark_gray>
    <gray>/claim rename <white>a new name<dark_gray> · <gray>delete<dark_gray>
    <gray>/claim transfer <white>somebody<dark_gray> — hand it over entirely
    <dark_gray>everything else is in the menus
  manual-given: "<green>The manual is in your inventory. <gray>Read it any time, it does not mind."
  stick-given: "<green>There is your marking-out tool. <gray>Left click one corner, right click the other."
  border-hidden: "<gray>Borders hidden. Out of sight, still yours."
  rename-needs-a-name: "<red>Give it a name: <gray>/claim rename <new name>"
  none-here: "<gray>You are not standing in a claim. Just open land, as far as the eye can see."
  gone: "<red>That claim no longer exists. It had a good run."
  belongs-to: "<gray>This is <white><claim></white>."
  border-elsewhere: "<gray><claim> is in <white><world></white> — the border can only be shown there."

  # ── people ───────────────────────────────────────────────────────────────
  trusted: "<green>Trusted <white><player></white> in <white><claim></white>."
  untrusted: "<yellow>Took <white><player></white>'s trust in <white><claim></white>."
  not-trusted: "<gray><player> is not trusted here. No trust, nothing to take back."
  already-an-owner: "<gray><player> owns this claim, so they already may do everything."
  owner-holds-everything: "<gray>An owner may do everything — there is nothing to set. Owners are like that."
  banned: "<red>Barred <white><player></white> from <white><claim></white>."
  ban-lifted: "<green><white><player></white> may come back to <white><claim></white>."
  not-banned: "<gray><player> is not barred from here. Nobody to let back in."
  cannot-ban-an-owner: "<red>You cannot bar <white><player></white> from a claim they own. Locking people out of their own house is a bold move."
  timed-out: "<red>Timed <white><player></white> out of <white><claim></white> for <white><duration></white>."
  kicked: "<yellow>Politely escorted <white><player></white> out of <white><claim></white>."
  cannot-kick-an-owner: "<red>You cannot kick <white><player></white> out of a claim they own. Their house, their rules."
  owner-added: "<green>Added <white><player></white> as a co-owner of <white><claim></white>."
  owner-removed: "<yellow>Removed <white><player></white> as a co-owner of <white><claim></white>."
  owner-cannot-remove: "<gray><player> cannot be removed that way — the last owner, and whoever first claimed it, always stay. A claim without an owner is just a hole."
  transferred: "<green>Handed <white><claim></white> over to <white><player></white> entirely."
  transferred-to-you: "<green>You have been given <white><claim></white>."

  # ── the land ─────────────────────────────────────────────────────────────
  height-changed: "<green><white><claim></white> now reaches y <white><min-y></white> to <white><max-y></white>."
  icon-changed: "<green><white><claim></white> will show as what you were holding."
  resize-refunded: "<green>Refunded <white><amount></white> <type> into <white><claim></white>'s bank."
  resize-charged: "<yellow>Took <white><amount></white> <type> for the extra ground in <white><claim></white>."

  # ── asking for something ─────────────────────────────────────────────────
  ask-new-name: "<gray>Type a new name for <white><claim></white>, or <white>cancel</white>."
  rename-aborted: "<gray>Left the name alone. It was fine anyway."
  ask-title: "<gray>Type the <white><what></white>, or <white>cancel</white>."
  title-set: "<green>Set the <what>."
  title-aborted: "<gray>Left it alone. Wise."
  titles-empty: "<gray>Nothing is set to show on arrival. A silent welcome."
  hold-an-item: "<gray>Hold the item you mean and click again."
  ask-kick: "<gray>Type who to kick out, or <white>cancel</white>."
  ask-ban: "<gray>Type a name, then a reason if you like — <white>name [reason]</white>, or <white>cancel</white>."
  ask-timeout: "<gray>Type a name and how long — <white>name duration [reason]</white>, or <white>cancel</white>."
  ask-ban-reason: "<gray>Type a reason, or <white>-</white> for none, or <white>cancel</white>."
  ask-timeout-duration: "<gray>Type how long, then a reason if you like — <white>duration [reason]</white>, or <white>cancel</white>."
  ask-co-owner: "<gray>Type who should own this claim too, or <white>cancel</white>."

  # ── refusals that are somebody else's decision ───────────────────────────
  flag-not-yours: "<gray><flag> is decided by the server, not by you. Some decisions come pre-made."
  feature-is-the-servers: "<gray>Whether claims may use <white><feature></white> is the server's decision. Take it up with the management."
  store-full: "<gray>That store is full — <white><cap></white> stacks is the limit. Even chests have boundaries."
  bank-inventory-full: "<yellow>Your inventory was full, so the rest went back into the claim."
  pantry-food-only: "<gray>The pantry takes food. Only food. It is not a junk drawer."
  potions-only: "<gray>That store takes potions, and nothing else. The brewing stand is particular."

  # ── commands ─────────────────────────────────────────────────────────────
  who: "<gray>Who do you mean? <white><usage>"
  unknown-subcommand: "<gray>No idea what <white><word></white> means, and I did look. Try <white>/claim</white> on its own."
  info-header: "<gold>── <white><claim></white> ──"

notify:
  entered: "<gray>You are entering <white><claim></white>, owned by <white><owner></white>."
  left: "<dark_gray>You are leaving <gray><claim><dark_gray>."
  trusted: "<green><white><player></white> trusted you in <white><claim></white>."
  permission-granted: "<green><white><player></white> let you <white><action></white> in <white><claim></white>."
  permission-revoked: "<yellow><white><player></white> took away <white><action></white> in <white><claim></white>."

protection:
  entry-denied: "<red>You may not go into <white><claim></white>. The door stays closed."
  teleport-denied: "<red>You may not teleport into <white><claim></white>. Use the front door, if they let you."
  elytra-denied: "<red>No flying inside <white><claim></white>. Wings off at the gate."
  banned: "<red>You are barred from <white><claim></white>. <gray><reason> <dark_gray><remaining>"
  timed-out: "<red>You are barred from <white><claim></white> for <white><remaining></white>. <gray><reason>"
  evicted-banned: "<red>You were shown out of <white><claim></white>."
  evicted-kicked: "<yellow>You were walked out of <white><claim></white>."
  evicted-timed-out: "<red>You were timed out of <white><claim></white>."
  pvp-refused: "<red>Fighting is not allowed in <white><claim></white>. Take it outside."

selection:
  started: "<green>Marking out a <white><mode></white>. <gray>Right click the corners; sneak + right click the air to finish."
  point-added: "<gray>Corner <white><index></white> at <gray><x>, <y>, <z><gray>."
  point-removed: "<gray>Took the last corner back — <white><count></white> left."
  nothing-to-undo: "<gray>Nothing marked yet. Nothing to undo."
  incomplete: "<gray>Mark <white><needed></white> corners — you have <white><have></white>. A shape needs all of its corners."
  none: "<gray>You are not marking anything out. Grab the stick first, it does not work by wishing."
  cancelled: "<gray>Forgotten. Never happened."
  ask-name: "<gray>What should it be called? <dark_gray>(<suggestion>)"
  name-aborted: "<gray>Never mind, then. No name, no claim."
  already-being-asked: "<gray>Something else is already waiting for you to type. Answer that first. It has been very patient."
  world-gone: "<red>That world is not loaded any more. It left without notice."
  world-mismatch: "<gray>All the corners have to be in one world. Geometry is hard enough already."
  wrong-world: "<gray><claim> is in another world. Your reach is good, but not that good."
  stick-dropped: "<gray>The marking tool goes back when you are done with it."

zone:
  ask-name: "<gray>What should this no-claim area be called?"
  name-aborted: "<gray>Never mind."
  created: "<green>Nobody may claim in <white><zone></white> — <gray><area> blocks, y <min-y> to <max-y>."
  replaced: "<yellow>Replaced the old <white><zone></white>."
  deleted: "<yellow>Removed the no-claim area <white><zone></white>."
  unknown: "<gray>No no-claim area called <white><zone></white>."
  list-header: "<gray><count> no-claim area(s):"
  here: "<gray>You are standing in <white><zone></white>."
  none-here: "<gray>Nothing stops a claim here. Go wild."

entry-fee:
  offer: "<gray><claim> charges <white><price></white> to come in. <white>/claim accept</white> to hand it over — <gray><seconds>s to decide."
  paid: "<green>Paid <white><price></white> to enter <white><claim></white>."
  declined: "<gray>Left it, then. Toll unpaid, door still shut."
  cannot-afford: "<red>You are <white><missing></white> short of the toll for <white><claim></white>. The troll under the bridge is unmoved."
  nothing-pending: "<gray>Nobody is asking you for anything. Rare, enjoy it."
  claim-gone: "<gray>That claim is gone. Paying a toll to a ghost is pointless."
  owner-notified: "<gray><player> paid to come into <white><claim></white>."

pantry:
  fed: "<gray><claim>'s pantry fed you <white><food></white>."

equip:
  given: "<gray><claim> handed you <white><amount>x <item></white> for your <white><where></white>."
  target-set: "<green>The <white><item></white> now goes to <white><where></white>."

effect:
  added: "<green>Granted <white><effect></white> in <white><claim></white>."
  removed: "<gray>Removed <white><effect></white> from <white><claim></white>."

fence:
  gate-adopted: "<gray>That gap in <white><claim></white>'s fence will stay open."

error:
  no-permission: "<red>Not yours to do. Ask whoever owns it, politely."
  no-claim-permission: "<red>That is not yours to change here. Look, but do not rearrange."
  not-allowed: "<red>That is not yours to do. The fence is there for a reason."
  selector-refused: "<gray><white><selector></white> is not yours to use, or not written right. A name works just as well, and needs no wizardry."
  selector-nobody: "<gray><white><selector></white> did not match anybody. Empty handed."
  too-many-players: "<gray><white><selector></white> matches <white><count></white> players, and this takes one. Pick one. Favourites are allowed."
  players-only: "<gray>Somebody standing in the world has to run that. Consoles cannot hold sticks."
  world-disabled: "<gray>Claims are switched off in this world. Finders keepers is the law here."
  name-invalid: "<gray>Letters, digits, dashes and underscores — up to 32 of them. Emoji and poetry will have to wait."
  name-taken: "<gray>You already have a claim called that. Get creative."
  too-many-claims: "<gray>You are at your limit of <white><detail></white> claims. Greed has a ceiling."
  claim-too-small: "<gray>Too small — the least is <white><detail></white> blocks. A dirt hut needs more room than that."
  claim-too-large: "<gray>Too big — the most is <white><detail></white> blocks. The whole map is not on offer."
  claim-too-short: "<gray>A claim has to be at least <white><minimum></white> blocks tall. Flat is not a lifestyle."
  too-many-vertices: "<gray>Too many corners — <white><detail></white> at most. This is a claim, not a snowflake."
  overlaps-claim: "<gray>That overlaps <white><detail></white>. Somebody got there first."
  in-no-claim-zone: "<gray>Nobody may claim in <white><detail></white>. Not even you, special as you are."
  cannot-afford: "<gray>You cannot afford that: <white><detail></white>. Land does not come free."
  underground-disallowed: "<gray>This server does not allow claims that are wholly underground. No secret bunkers."
  generic: "<gray>That did not work. <dark_gray>Here is why, in case you doubted us: <detail>"
  no-such-player: "<gray>Never heard of <white><player></white>. Check the spelling, or the guest list."
  no-such-claim: "<gray>No claim called <white><claim></white>. Not on any map we have."
  ambiguous-claim: "<gray>Several claims are called that: <white><candidates></white>. Originality is clearly in short supply."
  player-offline: "<gray><player> has to be online for that. Absent people make poor recipients."
  world-missing: "<gray>That claim's world (<white><world></white>) is not loaded. Hard to reach a place that is not there."
  bad-duration: "<gray>Not a length of time I understand: <white><input></white>. Try something like <white>2h</white>. Eventually is not a unit."

feature:
  unavailable: "<gray><feature> is switched off on this server. Somebody up top had other plans."

broadcast:
  kicked: "<gray><player> was walked out of <claim> by <by>."
  banned: "<gray><player> was barred from <claim> by <by>. <reason>"
  timed-out: "<gray><player> was timed out of <claim> for <duration> by <by>."
  lifted: "<gray><player> may come back to <claim> now — <by> lifted it."

admin:
  # ── the flags, from the server's side ────────────────────────────────────
  flag-policy-changed: "<green><flag> is now <white><policy></white>."
  flag-default-changed: "<green>New claims will start with <white><flag></white> <value>."
  flag-default-not-used: "<gray><flag> is not left to owners, so its starting value is never asked."
  flag-not-saved: "<red>Changed for now, but it could not be written down — check the console. It will be back as it was after a restart. The file is not impressed."
  why-header: "<gradient:#4ade80:#22d3ee>Why things happen in <claim></gradient> <dark_gray>· you are <white><audience></white> here"
  why-line: "<dark_gray>· <white><flag><dark_gray> — server <gray><policy><dark_gray>, claim <gray><override><dark_gray>, so <white><verdict>"

  # ── /claimadmin here ─────────────────────────────────────────────────────
  here-header: "<gradient:#4ade80:#22d3ee>── <claim> ──</gradient>"
  here-owners: "<dark_gray>Owner(s): <gray><owners>"
  here-shape: "<dark_gray>World <gray><world><dark_gray> · <gray><area></gray> blocks, y <min-y> to <max-y><dark_gray> · <gray><corners></gray> corner(s)"
  here-not-covered: "<yellow>You are at y <white><y></white>, which this claim's own range does not reach — nothing here is protected."
  here-members: "<dark_gray>Trusted: <gray><count></gray><dark_gray>, <gray><admins></gray> claim admin(s)"
  here-bans: "<dark_gray>Active bans: <gray><count>"
  here-entry-fee: "<dark_gray>Entry fee: <gray><amount>"
  here-bank: "<dark_gray>Bank: <gray><items></gray> item stack(s), <gray><xp></gray> xp"
  here-flags-header: "<dark_gray>── flags (enforced ones only) ──"
  here-flag-line: "<dark_gray>· <white><flag><dark_gray> — claim <gray><override><dark_gray>, so <white><verdict>"
  here-flag-tiers: "<dark_gray>· <white><flag><dark_gray> — owner <gray><owner><dark_gray>, trusted <gray><trusted><dark_gray>, visitor <gray><visitor>"
  stick-received: "<green><admin> gave you a marking-out tool. <gray>Left click one corner, right click the other."
  open-flags: "<gray>Opening the flag settings."
  overview: "<gray><claims> claim(s), <zones> zone(s), <tracked> player(s) tracked. <dark_gray>land answered by <answering>"
  bypass-on: "<green>Bypass on — you can ignore every claim."
  bypass-off: "<gray>Bypass off. Claims bind you again."
  reloaded: "<green>Reloaded. Fresh off the press."
  visitors-aligned: "<green>Aligned visitors to trusted on <white><count></white> claim(s)."
  claim-deleted: "<yellow>Deleted <white><claim></white>."
  claim-transferred: "<green>Transferred <white><claim></white> to <white><player></white>."
  claim-transferred-to-you: "<green>You have been given <white><claim></white>."
  feature-changed: "<green><white><feature></white> is now <white><policy></white>."
  feature-not-saved: "<red>Changed for now, but it could not be written down — check the console. It will be back as it was after a restart. Like a New Year's resolution."
  zone-removed: "<yellow>Removed the no-claim area <white><zone></white>."
  zone-shift-to-remove: "<gray>Shift + click to remove <white><zone></white>."

  # ── restored operational surface ─────────────────────────────────────────
  saved: "<green>Saved <white><count></white> changed claim(s), and the no-claim zones."
  list-header: "<gray><count> claim(s) on the server:"
  reshape-started: "<green>There is your stick. <gray>Redraw <white><claim></white> — the ordinary size and overlap limits do not apply."
  claim-reshaped: "<green><white><claim></white> forced into a new shape: <gray><area> blocks, y <min-y> to <max-y>."
  stick-given: "<green>Gave <white><player></white> a marking-out stick."
  ask-transfer-target: "<gray>Who should <white><claim></white> belong to now? <white>(type a name, or cancel)"
  ownership-transferred: "<green><white><claim></white> now belongs to <white><player></white>."
  teleport-unsafe: "<red>Nowhere safe was found near <white><claim></white> — nobody was moved. Lava views do not count."
  inspect-header: "<gold>── <white><claim></white>, staff view ──"
  diagnose-header: "<gold>── why, here ──"
  ask-owner-filter: "<gray>Show only whose claims? <white>(type a name, or cancel)"
