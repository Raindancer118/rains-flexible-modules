# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
performance:
  full-of-kind: "<yellow>This farm is full: <white><limit></white> <kind>s close together is the most. Nothing more hatches or is born here."
  full: "<yellow>This farm is full: <white><limit></white> animals close together is the most. Nothing more is born here."
  header: "<gray>The <white><count></white> most crowded chunk(s) with at least <white><least></white> entities:"
  line: "<white><total></white> <gray>— mostly <white><kind></white> (<kind-count>) <dark_gray>· <gray><world> <white><x> <z></white>"
  none: "<green>No loaded chunk holds <white><least></white> entities or more."
  usage: "<gray>/perf <dark_gray>— how it is doing · <gray>/perf report | reports | show <n> | fix <n> <finding> | undo | tp <n> <finding> | alerts"
  folia: "<red>This cannot look at every world at once on Folia: no thread is allowed to."
  status: "<gray><white><tps></white> TPS · a tick takes <white><mean> ms</white> on average, <white><p95> ms</white> at the 95th percentile, <white><worst> ms</white> at worst · <white><state></white>"
  report-head: "<yellow>Lag report <white>#<number></white>: <trigger>. <white><tps></white> TPS, <white><mean> ms</white> a tick, worst <white><worst> ms</white>."
  report-cause: "<gray>  <white><percent>%</white> <cause>"
  report-finding: "<gray>  <white><n>.</white> <white><count> <kind></white> at <world> <white><x> <z></white> — <claim> (<owners>)"
  report-more: "<gray>  … and <white><count></white> more: <white>/perf show <number></white>"
  advice-distance: "<gray>  Advice: simulation distance <white><from></white> → <white><to></white> until the next restart."
  advice-plugin: "<gray>  The plugin <white><plugin></white> had <white><percent>%</white> of the busy time."
  button-go: "[Go]"
  button-fix: "[Fix]"
  button-tell: "[Tell owner]"
  button-apply: "[Apply]"
  looking: "<gray>Looking at the server — a moment."
  no-reports: "<gray>No reports yet. <white>/perf report</white> makes one now."
  reports-line: "<gray>#<white><number></white> — <trigger> — <white><tps></white> TPS, <white><findings></white> finding(s)"
  no-such-report: "<red>No such report. <white>/perf reports</white> lists the last ones."
  no-such-finding: "<red>Report #<number> has no such finding."
  nothing-to-fix: "<gray>That report suggested nothing to change there."
  fix-unloaded: "<gray>That chunk is not loaded any more, so there is nothing there to fix right now."
  fixed-thinned: "<green>Removed <white><count></white> <kind>(s); <white><keep></white> stay, with every named, tamed and leashed one."
  fixed-items: "<green>Cleared <white><count></white> items and orbs."
  fixed-monsters: "<green>Removed <white><count></white> monsters that would have despawned anyway."
  fixed-told: "<green>Told <white><count></white> owner(s) who are online."
  fixed-distance: "<green>Simulation distance is <white><to></white> in every world until the next restart. <white>/perf undo</white> puts it back."
  undone: "<green>Simulation distance is back to what it was."
  nothing-to-undo: "<gray>Nothing to undo: the simulation distance was not changed."
  owner-told: "<yellow>Your claim <white><claim></white> slows the server down: <white><count> <kind></white> at <white><x> <z></white>. Fewer would help everybody."
  alerts-on: "<green>Lag reports will show up in your chat."
  alerts-off: "<gray>Lag reports will not show up in your chat. <white>/perf alerts</white> brings them back."
  only-a-player: "<red>Only a player can do that."
  not-allowed: "<red>You may not do that."
