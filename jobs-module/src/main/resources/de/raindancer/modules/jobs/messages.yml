# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
jobs:
  started: "<gold>New server goal: <white><goal></white> — <white><amount></white> in <white><days></white> days. Everybody who helps is paid their share. <gray>/jobs"
  reached: "<gold>Goal reached: <white><goal></white>! <white><players></white> player(s) share the reward."
  missed: "<gray>Time is up for <white><goal></white>: <white><progress></white> of <white><amount></white>. Those who helped are paid for the part reached."
  paid: "<green>Your share of <white><goal></white>: <white><percent>%</white> — <amount><green>."
  paid-part: "<green>For your part in <white><goal></white> (<white><percent>%</white> of what was reached): <amount><green>."
  owed: "<yellow>Your share of <white><goal></white> (<amount><yellow>) could not be paid right now. <gray>It is kept for you and paid as soon as it can be."
  paid-late: "<green>The goal reward that was held back is paid: <amount><green>."
  delivered: "<green>Handed in <white><count></white> for <white><goal></white>. <gray>Now <white><progress></white>/<amount>."
  caught: "<aqua>+ <goal>: <white><progress></white>/<amount>"
  none-carried: "<red>You carry nothing for <white><goal></white>. <gray>It wants: <white><what></white> — plain, not renamed."
  fish-how: "<gray><white><goal></white>: fish with a rod anywhere — every fish you reel in counts by itself."
  gone: "<red>That goal is no longer on the board."
  not-saved: "<red>That could not be saved, so nothing changed. Staff: goals.yml cannot be written."
  only-a-player: "<red>Only a player can work on goals."
  usage: "<gray>/jobs <dark_gray>— the job board"
  usage-staff: "<gray>/jobs list · /jobs end <number> · /jobs new [kind] · /jobs reload"
  list-line: "<gray>#<number> <white><goal></white> — <progress>/<amount>"
  ended: "<green>Goal #<number> ended; whoever helped is paid for what was reached."
  no-such: "<red>No goal #<number> on the board. <gray>/jobs list"
  no-kind: "<red>No kind of goal called <white><kind></white> that is not already up."
  put-up: "<green>Put up <white><goal></white>: <amount>."
  reloaded: "<green>jobs.yml read: <white><count></white> kind(s) of goal."
  quest:
    progress: "<aqua>+ <quest>: <white><progress></white>/<amount>"
    done: "<green>Quest done: <white><quest></white> — <amount><green>."
    owed: "<yellow>Quest done: <white><quest></white>, but <amount><yellow> could not be paid right now. <gray>It is kept for you and paid as soon as it can be."
    paid-late: "<green>The pay for <white><quest></white> that was held back is paid: <amount><green>."
    waiting: "<gray>You have <white><count></white> quest(s) open today <dark_gray>(tier <tier>)<gray>. <white>/quests"
    switched-off: "<red>Personal quests are switched off on this server."
    not-saved: "<red>That could not be saved, so nothing changed. Staff: quest-progress.yml cannot be written."
    usage: "<gray>/quests <dark_gray>— your quests for today · <gray>/quests ask <amount> <dark_gray>— work for that much, against the clock"
    usage-staff: "<gray>/quests give <player> <quest> · /quests reset <player> · /quests reload"
    given: "<green><white><player></white> has the quest <white><quest></white> now: <amount> to go."
    not-given: "<red><white><player></white> cannot be given <white><quest></white>: there is no such quest, or they are on it already."
    never-here: "<red><white><player></white> has never been on this server."
    reset: "<green><white><player></white> gets new quests for today."
    reloaded: "<green>quests.yml read: <white><count></white> quest(s)."
    swapped: "<green>Swapped. <gray>Your new quest is on <white>/quests</white>."
    not-swapped: "<red>That one cannot be swapped — it is begun, or there is nothing left to swap it for."
  order:
    go: "<gold><work>. <yellow>You have <white><time></white>. Go! <gray>(<amount><gray> if you make it)"
    bar: "<gold><work> <white><progress>/<units></white> <gray>· <white><left></white> left"
    done: "<green>Order done: <white><work></white>, with <white><left></white> to spare — <amount><green>."
    failed: "<red>Time is up: <white><work></white> got to <white><progress>/<units></white>. <gray>Nothing is paid. The clock does not do sympathy."
    owed: "<yellow>Order done: <white><work></white>, but <amount><yellow> could not be paid right now. <gray>It is kept for you and paid as soon as it can be."
    paid-late: "<green>The pay for your order that was held back is paid: <amount><green>."
    busy: "<red>You are on an order already. <gray>Finish it first — or <white>/quests cancel</white>, if you must."
    none-left: "<red>That was today's last order. <gray>The work will still be there tomorrow."
    no-rerolls: "<red>No more other offers today. <gray>Take that one, or try again tomorrow."
    too-little: "<red>Orders start at <amount><red>. <gray>Smaller jobs are on <white>/quests</white>."
    too-much: "<red>Nobody pays more than <amount><red>. <gray>Not even for dragons."
    unreadable: "<red><white><text></white> is not an amount. <gray>Try 5000, 2.5k or 100m."
    switched-off: "<red>Orders are switched off on this server."
    no-work: "<red>There is no work in orders.yml to give out. <gray>Staff: delete it to get the shipped work back."
    not-saved: "<red>That could not be saved, so nothing changed. Staff: order-progress.yml cannot be written."
    cancelled: "<gray>Order given up. Nothing is paid, and it counts as one of today's."
    not-running: "<red>You have no order running."
    stale: "<red>That offer is gone. <gray>Ask again for a fresh one."
    reloaded: "<green>orders.yml read: <white><count></white> kind(s) of work."
