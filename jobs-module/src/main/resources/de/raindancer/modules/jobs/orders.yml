# The work an order can turn into. /quests → Ask for work: a player names an amount, and gets work as hard as
# that amount — the more they ask, the harder the work, the more of it and the less time. A hundred million is
# about a hundred Wardens in half an hour; a hundred billion is hundreds of Ender Dragons in minutes.
#
#   name      what the units are called, plural ("Wardens", "blocks of stone")
#   task      mine, harvest, kill, fish, breed or travel — counted as for quests (see quests.yml)
#   things    what counts; * for anything, "!" leaves one out
#   value     what one is worth in the easiest order; harder orders pay up to 100,000 times as much per unit
#   rate      how many a skilled player manages in an hour; the time allowed is worked out from it
#   hardness  0 for the easiest work, 1 for the hardest: an order picks work about as hard as its amount
#   icon      the item shown for it
#
# Read again with /quests reload. Delete this file to get the shipped work back.
work:
  stone:
    name: "blocks of stone"
    task: mine
    things: [ stone, deepslate, andesite, diorite, granite, tuff ]
    value: 1
    rate: 1200
    hardness: 0.0
    icon: stone
