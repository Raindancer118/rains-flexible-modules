# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
enchants:
  flight-empty: "<gray>Flight ran out. <white>Land and it recharges."
  usage: "<gray>/enchants <dark_gray>— list · <gray>/enchants give <player> <enchantment> [level] <dark_gray>— staff"
  list-header: "<gold>Rain's enchantments:"
  list-line: "<gray>- <white><name></white> <dark_gray>(up to <max>, on <gear>)"
  not-online: "<red><white><player></white> is not online right now."
  unknown: "<red>There is no enchantment <white><name></white>. <gray>/enchants list shows them."
  bad-level: "<red>The level has to be a number from 1 to <white><max></white>."
  given: "<green>Gave <white><player></white> a book of <white><name></white> <level>."
  boost-charges: "<aqua>Boost! <gray><white><left></white> of <white><of></white> charges left."
  boost-empty: "<gray>Boost is recharging. Next charge in <white><time></white>."
  launch-cooldown: "<gray>Launch is ready again in <white><time></white>."
  soulbound-kept: "<light_purple>Soulbound kept <white><count></white> of your things with you."
  link-set: "<green>Linked to the chest at <white><x> <y> <z></white>. What this tool mines goes there now."
  link-denied: "<red>You can only link a chest you are allowed to open."
  link-missing: "<gray>This tool has Chest Link but no chest yet. <white>Sneak and right-click a chest</white> to link it."
  link-missed: "<gray>Your linked chest is full or gone, so what you mined came to you."
  link-elsewhere: "<gray>Your linked chest is not on this server, so what you mined came to you."
  portal-opened: "<light_purple>The portal hums open. <gray>It leads to the shard world, where it is always night."
  portal-arrived: "<light_purple>The shard world. <gray>Monsters here drop the enchantments' shards. Any portal takes you back."
  shard-dropped: "<light_purple>+1 <white><name></white> shard"
  shard-given: "<green>Gave <white><player></white> <white><amount></white> shard(s) of <white><name></white>."
  shard-usage: "<gray>/enchants shard <player> <enchantment> [amount] <dark_gray>— staff"
