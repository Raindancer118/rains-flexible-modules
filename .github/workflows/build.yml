name: Build

# Every push, on every branch, so a jar exists for whatever is on GitHub right now — not only for
# main. A pull request builds too, so the jar is there before the merge rather than after.
on:
  push:
  pull_request:
  # Lets a build be kicked off by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # RainsCore is a `provided` dependency with no repository behind it: `de.raindancer:RainsCore` is
      # not published anywhere, so it resolves from the local ~/.m2 and nothing else. That is fine on a
      # laptop that has just built it and fatal on a runner that has never seen it — the build fails
      # while resolving, which reads as a broken repository rather than a missing sibling.
      #
      # So the sibling is checked out and installed first. The alternative is publishing RainsCore to
      # GitHub Packages, which is tidier and costs a token in both repositories; this needs none, as long
      # as RainsCore is public. If it is private, add a PAT with read access as a secret and pass it here
      # as `token:`.
      - name: Check out RainsCore
        uses: actions/checkout@v4
        with:
          repository: Raindancer118/RainsCore
          path: .rainscore
          # token: ${{ secrets.RAINSCORE_READ_TOKEN }}

      # Must be 25: paper-api 26.2 ships Java 25 class files, so an older JDK cannot read the dependency
      # at all — it fails while resolving rather than while compiling, which reads as a broken repository
      # instead of a wrong JDK.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests skipped deliberately: RainsCore's own workflow runs them on its own pushes, and running
      # them again here would make this build red for something that is not in this repository.
      - name: Install RainsCore into the local repository
        run: mvn --batch-mode --no-transfer-progress -f .rainscore/pom.xml install -DskipTests

      # `install` rather than `verify`, and that is not a preference. The standalone projects shade the
      # module jars out of the local repository, so a plain `verify` can shade whatever an earlier build
      # happened to leave in ~/.m2 — a jar newer than its own source, carrying last week's code. That
      # went out to a live server once. `install` writes this build's artifacts before they are shaded,
      # and StandaloneJarTest#theJarIsNotStale then checks that what ended up in the jar is what was
      # just compiled.
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean install

      # ── the jars a server operator actually wants ────────────────────────────────────────────────
      #
      # One named step per standalone plugin rather than a wildcard. A wildcard means the day somebody
      # adds a module the jar quietly lands in a catch-all artifact nobody looks in — or, worse, does
      # not build at all and nothing says so, because there was no step expecting it. `if-no-files-found:
      # error` is the whole point: a green build with a missing jar is the failure this is guarding.
      #
      # The module jars themselves are libraries and are not uploaded: a jar in a downloads folder that
      # cannot be installed is worse than no jar. Named after the commit so a downloaded jar can always
      # be traced back to the source it was built from.

      - name: Upload Rain's Extended Claims
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RainsExtendedClaims-${{ github.sha }}
          path: |
            claims-standalone/target/RainsExtendedClaims-*.jar
            !claims-standalone/target/original-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload Rain's Moderation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RainsModeration-${{ github.sha }}
          path: |
            moderation-standalone/target/RainsModeration-*.jar
            !moderation-standalone/target/original-*.jar
          if-no-files-found: error
          retention-days: 30

      # Uploaded on failure as well, which is the case they are actually needed for: a red build with no
      # report is a red build somebody has to reproduce locally before they can start reading it.
      - name: Publish the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7
