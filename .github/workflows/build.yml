name: Build

# Every push, on every branch, so a jar exists for whatever is on GitHub right now — not only for
# master. A pull request builds too, so the jar is there before the merge rather than after.
#
# The per-plugin tags cut permanent releases. They name the plugin because the plugins version
# independently: the reactor is 1.0.0 while RainsExtendedClaims is 2.0.0, RainsModeration is 2.1.0,
# RainsColouredNames is 2.0.0, RainsWarps is 1.0.0 and RainsHomes and RainsTPA are both 2.0.0, so a
# bare `v2.0.0` could not say which of them it meant.
on:
  push:
    tags:
      - 'claims-v*'
      - 'moderation-v*'
      - 'names-v*'
      - 'warps-v*'
      - 'homes-v*'
      - 'tpa-v*'
      - 'yeuk-v*'
      # Publishes one library module to packages.tstieh.de. Each module has its own version — a
      # property in the parent pom (e.g. claims-module.version), independent of the reactor's own
      # <version> and of every other module's — so each gets its own tag namespace too, the same way
      # the plugin tags above are per-plugin rather than one shared tag. The standalone/bundle jars
      # stay off the registry entirely (maven.deploy.skip=true in each of their poms) since nothing
      # depends on a deployable plugin jar.
      - 'modules-api-v*'
      - 'modules-wrapper-v*'
      - 'claims-module-v*'
      - 'moderation-module-v*'
      - 'names-module-v*'
      - 'warp-module-v*'
      - 'homes-module-v*'
      - 'tpa-module-v*'
      - 'farmworld-module-v*'
      - 'pack-module-v*'
      - 'chained-module-v*'
      - 'rtp-module-v*'
      - 'hungergames-module-v*'
      - 'speedrun-module-v*'
    branches:
      - '**'
  pull_request:
  # Lets a build be kicked off by hand from the Actions tab.
  workflow_dispatch:

# write, because this workflow creates tags and releases. Everything else it does is read-only.
permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    # Every mvn invocation in this job needs these, not only the deploy steps near the bottom: RainsCore
    # now resolves from packages.tstieh.de (see the root pom's <repositories>) rather than from a sibling
    # checkout built by hand, and Reposilite requires the same credentials to read a release as to
    # publish one. ci-deploy has both.
    env:
      REPOSILITE_USERNAME: ci-deploy
      REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The whole history, so the release notes can name what changed since the last build.
          fetch-depth: 0

      # Must be 25: paper-api 26.2 ships Java 25 class files, so an older JDK cannot read the dependency
      # at all — it fails while resolving rather than while compiling, which reads as a broken repository
      # instead of a wrong JDK.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: packages-releases
          server-username: REPOSILITE_USERNAME
          server-password: REPOSILITE_PASSWORD

      # `install` rather than `verify`, and that is not a preference. The standalone projects shade the
      # module jars out of the local repository, so a plain `verify` can shade whatever an earlier build
      # happened to leave in ~/.m2 — a jar newer than its own source, carrying last week's code. That
      # went out to a live server once. `install` writes this build's artifacts before they are shaded,
      # and StandaloneJarTest#theJarIsNotStale then checks that what ended up in the jar is what was
      # just compiled. RainsCore itself now comes off packages.tstieh.de on this same step, at whatever
      # version the root pom's rainscore.version property names — bump that property to pick up a new
      # RainsCore release, the same way bumping a *-module.version property picks up a new module.
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean install

      # ── the jars a server operator actually wants ────────────────────────────────────────────────
      #
      # Found by pattern per plugin rather than by a hard-coded filename, because the version lives in
      # each standalone pom and moving it here would be a second copy that drifts. `original-*` is the
      # unshaded jar the shade plugin leaves behind: loading it would give a plugin with no module in it.
      - name: Find the jars
        id: jars
        run: |
          set -euo pipefail
          # key:directory:jar-name. The directory is spelled out rather than derived from the key,
          # because the bundle is not a `<something>-standalone`: it is six modules in one jar and
          # lives in `yeuksmp/`. Deriving it worked right up until something did not follow the
          # pattern, which is the point at which a derived path fails by looking for a directory
          # nobody wrote.
          for plugin in claims:claims-standalone:RainsExtendedClaims \
                        moderation:moderation-standalone:RainsModeration \
                        names:names-standalone:RainsColouredNames \
                        warp:warp-standalone:RainsWarps \
                        homes:homes-standalone:RainsHomes \
                        tpa:tpa-standalone:RainsTPA \
                        farmworld:farmworld-standalone:RainsFarmWorlds \
                        pack:pack-standalone:RainsServerPack \
                        yeuk:yeuksmp:YeukSMP; do
            rest="${plugin#*:}"
            dir="${rest%%:*}/target"
            name="${plugin##*:}"
            jar="$(find "$dir" -maxdepth 1 -name "$name-*.jar" ! -name 'original-*' | head -1)"
            if [ -z "$jar" ]; then
              echo "::error::$name did not build — no jar in $dir"
              exit 1
            fi
            sha="$(sha256sum "$jar" | cut -d' ' -f1)"
            echo "$sha  $(basename "$jar")" > "$jar.sha256"
            echo "${plugin%%:*}_jar=$jar" >> "$GITHUB_OUTPUT"
            echo "${plugin%%:*}_name=$(basename "$jar")" >> "$GITHUB_OUTPUT"
            echo "${plugin%%:*}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "$name: $sha"
          done

      # Kept as run artifacts as well as releases: a pull request has no release, and a red build's
      # partial output is still worth looking at.
      - name: Upload the jars as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ github.sha }}
          path: |
            claims-standalone/target/RainsExtendedClaims-*.jar
            moderation-standalone/target/RainsModeration-*.jar
            names-standalone/target/RainsColouredNames-*.jar
            warp-standalone/target/RainsWarps-*.jar
            homes-standalone/target/RainsHomes-*.jar
            tpa-standalone/target/RainsTPA-*.jar
            farmworld-standalone/target/RainsFarmWorlds-*.jar
            pack-standalone/target/RainsServerPack-*.jar
            yeuksmp/target/YeukSMP-*.jar
            !**/original-*.jar
          if-no-files-found: error
          retention-days: 30

      # Uploaded on failure as well, which is the case they are actually needed for: a red build with no
      # report is a red build somebody has to reproduce locally before they can start reading it.
      - name: Publish the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7

      # ── what a push publishes ───────────────────────────────────────────────────────────────────

      - name: Write the notes for an automatic build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          {
            printf '%s\n' \
              "Automatic build of \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`." \
              "" \
              "**Not a release.** It is whatever the branch happened to be at that commit. For a fixed" \
              "version use a \`claims-vX.Y.Z\`, \`moderation-vX.Y.Z\` or \`names-vX.Y.Z\` release." \
              "" \
              "| Plugin | Jar | sha256 |" \
              "|---|---|---|" \
              "| Rain's Extended Claims | \`${{ steps.jars.outputs.claims_name }}\` | \`${{ steps.jars.outputs.claims_sha }}\` |" \
              "| Rain's Moderation | \`${{ steps.jars.outputs.moderation_name }}\` | \`${{ steps.jars.outputs.moderation_sha }}\` |" \
              "| Rain's Coloured Names | \`${{ steps.jars.outputs.names_name }}\` | \`${{ steps.jars.outputs.names_sha }}\` |" \
              "| Rain's Warps | \`${{ steps.jars.outputs.warp_name }}\` | \`${{ steps.jars.outputs.warp_sha }}\` |" \
              "| Rain's Homes | \`${{ steps.jars.outputs.homes_name }}\` | \`${{ steps.jars.outputs.homes_sha }}\` |" \
              "| Rain's TPA | \`${{ steps.jars.outputs.tpa_name }}\` | \`${{ steps.jars.outputs.tpa_sha }}\` |" \
              "| YeukSMP (claims · tpa · warps · moderation · server pack · names, in one jar) | \`${{ steps.jars.outputs.yeuk_name }}\` | \`${{ steps.jars.outputs.yeuk_sha }}\` |" \
              "" \
              "**YeukSMP replaces the six it contains — it does not go beside them.** Two copies of a" \
              "module on one server is two sets of listeners on the same event." \
              "" \
              "Each of them needs \`RainsCore.jar\` beside it." \
              "" \
              "### What changed"
            git log -15 --no-merges --pretty='- %s' || true
          } > notes.md

      # One link that is always the newest build, so a test server can be pointed at it once. Deleted
      # and recreated rather than edited: an edited release keeps its old assets, and two jars with the
      # same name and different contents is the worst possible outcome here.
      - name: Publish rolling "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest \
            "${{ steps.jars.outputs.claims_jar }}" \
            "${{ steps.jars.outputs.claims_jar }}.sha256" \
            "${{ steps.jars.outputs.moderation_jar }}" \
            "${{ steps.jars.outputs.moderation_jar }}.sha256" \
            "${{ steps.jars.outputs.names_jar }}" \
            "${{ steps.jars.outputs.names_jar }}.sha256" \
            "${{ steps.jars.outputs.warp_jar }}" \
            "${{ steps.jars.outputs.warp_jar }}.sha256" \
            "${{ steps.jars.outputs.homes_jar }}" \
            "${{ steps.jars.outputs.homes_jar }}.sha256" \
            "${{ steps.jars.outputs.tpa_jar }}" \
            "${{ steps.jars.outputs.tpa_jar }}.sha256" \
            "${{ steps.jars.outputs.yeuk_jar }}" \
            "${{ steps.jars.outputs.yeuk_jar }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "Latest build" \
            --notes-file notes.md \
            --prerelease

      # And an immutable one per push, so a jar from three pushes ago is still fetchable — which
      # "latest" by its nature cannot promise. The run number rather than a date: it never repeats and
      # it sorts.
      - name: Publish this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" \
            "${{ steps.jars.outputs.claims_jar }}" \
            "${{ steps.jars.outputs.claims_jar }}.sha256" \
            "${{ steps.jars.outputs.moderation_jar }}" \
            "${{ steps.jars.outputs.moderation_jar }}.sha256" \
            "${{ steps.jars.outputs.names_jar }}" \
            "${{ steps.jars.outputs.names_jar }}.sha256" \
            "${{ steps.jars.outputs.warp_jar }}" \
            "${{ steps.jars.outputs.warp_jar }}.sha256" \
            "${{ steps.jars.outputs.homes_jar }}" \
            "${{ steps.jars.outputs.homes_jar }}.sha256" \
            "${{ steps.jars.outputs.tpa_jar }}" \
            "${{ steps.jars.outputs.tpa_jar }}.sha256" \
            "${{ steps.jars.outputs.yeuk_jar }}" \
            "${{ steps.jars.outputs.yeuk_jar }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}"

      # Otherwise the list grows by one per push and the entries worth finding are buried by March.
      # Only `build-*` is ever touched: a versioned release and `latest` are left alone, and the deletion
      # is by exact name rather than by pattern-matching whatever `gh` happened to print.
      - name: Prune old builds, keeping the last 15
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP=15
          # Newest first, so everything past the first $KEEP is what goes.
          mapfile -t builds < <(gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName --jq '.[] | select(.tagName | startswith("build-")) | .tagName')
          echo "${#builds[@]} build release(s); keeping $KEEP"
          if [ "${#builds[@]}" -le "$KEEP" ]; then
            exit 0
          fi
          for tag in "${builds[@]:$KEEP}"; do
            echo "removing $tag"
            gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          done

      # ── auto-publish every module version that has no tag yet ──────────────────────────────────
      #
      # The tag-triggered path below requires remembering `git tag <module>-vX.Y.Z && git push --tags`
      # after bumping a module's version property in the parent pom. Bumping the property and pushing
      # to master used to stop there — the jar built, but nothing reached packages.tstieh.de unless the
      # tag was pushed separately, and it usually was not. This finds every module whose `<module>.version`
      # in the parent pom has no matching tag on the remote yet, and deploys + tags all of them in this
      # same job — the same fix RainsCore's own workflow now applies to its single version.
      - name: Find module versions with no tag yet
        id: newmodules
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          modules="modules-api modules-wrapper claims-module moderation-module names-module warp-module homes-module tpa-module farmworld-module pack-module chained-module rtp-module hungergames-module speedrun-module"
          new=""
          for module in $modules; do
            version="$(grep -oPm1 "(?<=<${module}\.version>)[^<]+" pom.xml)"
            tag="${module}-v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              continue
            fi
            echo "new: $tag"
            new="$new $module:$version"
          done
          echo "list=$new" >> "$GITHUB_OUTPUT"

      # Deployed before it is tagged, not after: the tag is the record of what is actually on
      # packages.tstieh.de, so a deploy that fails partway through must leave that module untagged —
      # otherwise the next push would see the tag, believe the module already went out, and never
      # retry it. Reposilite's own 409 on an already-published version is still the backstop if a tag
      # somehow exists without the deploy having happened.
      - name: Deploy and tag the new module versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.newmodules.outputs.list != ''
        env:
          REPOSILITE_USERNAME: ci-deploy
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
          # Reposilite's TLS termination trips a TLSv1.3/SNI handshake bug in Maven's HTTP transport
          # (works fine with plain java.net.http.HttpClient or curl) — pin TLSv1.2.
          MAVEN_OPTS: -Djdk.tls.client.protocols=TLSv1.2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for entry in ${{ steps.newmodules.outputs.list }}; do
            module="${entry%%:*}"
            version="${entry#*:}"
            tag="${module}-v${version}"
            echo "::group::$tag"
            mvn --batch-mode --no-transfer-progress -pl "$module" -DskipTests deploy
            git tag "$tag"
            git push origin "$tag"
            echo "::endgroup::"
          done

      # ── what a tag publishes ────────────────────────────────────────────────────────────────────

      # A permanent release for one plugin. The tag names it because the two version independently, and
      # the version in the tag has to match the one in that plugin's pom — a release whose tag says
      # 2.1.0 and whose jar says 2.0.0 is one nobody can reason about afterwards.
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/claims-v') || startsWith(github.ref, 'refs/tags/moderation-v') || startsWith(github.ref, 'refs/tags/names-v') || startsWith(github.ref, 'refs/tags/warps-v') || startsWith(github.ref, 'refs/tags/homes-v') || startsWith(github.ref, 'refs/tags/tpa-v') || startsWith(github.ref, 'refs/tags/yeuk-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          which="${TAG%%-v*}"
          wanted="${TAG#*-v}"

          case "$which" in
            claims)     jar='${{ steps.jars.outputs.claims_jar }}'
                        sha='${{ steps.jars.outputs.claims_sha }}'
                        title="Rain's Extended Claims" ;;
            moderation) jar='${{ steps.jars.outputs.moderation_jar }}'
                        sha='${{ steps.jars.outputs.moderation_sha }}'
                        title="Rain's Moderation" ;;
            names)      jar='${{ steps.jars.outputs.names_jar }}'
                        sha='${{ steps.jars.outputs.names_sha }}'
                        title="Rain's Coloured Names" ;;
            # The tag says "warps" and the directory is "warp-standalone", so the pom lookup below
            # needs the directory name rather than the tag's.
            warps)      jar='${{ steps.jars.outputs.warp_jar }}'
                        sha='${{ steps.jars.outputs.warp_sha }}'
                        title="Rain's Warps"
                        which=warp ;;
            homes)      jar='${{ steps.jars.outputs.homes_jar }}'
                        sha='${{ steps.jars.outputs.homes_sha }}'
                        title="Rain's Homes" ;;
            tpa)        jar='${{ steps.jars.outputs.tpa_jar }}'
                        sha='${{ steps.jars.outputs.tpa_sha }}'
                        title="Rain's TPA" ;;
            # The bundle, which is not a `<something>-standalone` — six modules in one jar, in its
            # own directory. Hence `pom` below rather than a name the path is built from.
            yeuk)       jar='${{ steps.jars.outputs.yeuk_jar }}'
                        sha='${{ steps.jars.outputs.yeuk_sha }}'
                        title="YeukSMP"
                        pom=yeuksmp/pom.xml ;;
            *)          echo "::error::$TAG names no plugin I know about"; exit 1 ;;
          esac

          # Straight out of the pom, so the tag is checked against the thing that actually built.
          built="$(grep -oPm1 '(?<=<plugin.version>)[^<]+' "${pom:-$which-standalone/pom.xml}")"
          if [ "$built" != "$wanted" ]; then
            echo "::error::$TAG says $wanted but ${pom:-$which-standalone/pom.xml} says $built. Bump the pom or fix the tag."
            exit 1
          fi

          {
            printf '%s\n' \
              "$title $built." \
              "" \
              "### Installing" \
              "" \
              "Drop \`$(basename "$jar")\` into \`plugins/\` alongside \`RainsCore.jar\`, which it needs" \
              "and never carries a copy of. Restart the server." \
              "" \
              "\`sha256: $sha\`" \
              "" \
              "---"
          } > release-notes.md

          gh release create "$TAG" \
            "$jar" "$jar.sha256" \
            --repo "${{ github.repository }}" \
            --title "$title $built" \
            --notes-file release-notes.md \
            --generate-notes

      # ── what a <module>-v tag publishes ───────────────────────────────────────────────────────
      #
      # One module, deployed under its own coordinates at its own version — never the whole reactor.
      # The module name is the tag with its trailing -vX.Y.Z stripped, which is also the directory
      # name and the artifactId, so `-pl` needs nothing more than that to scope the build to it.
      # Its dependencies (modules-api, RainsCore, ...) are already sitting in ~/.m2 from the earlier
      # `install` in this same job, so `-pl` alone (no `-am`) is enough and deploys nothing but the
      # tagged module — never modules-api as a side effect of building against it, and never the
      # *-standalone/*-bundle jars, which are `maven.deploy.skip`d in their own poms regardless.
      - name: Determine the tagged module
        id: module
        if: contains(github.ref_name, '-module-v') || startsWith(github.ref_name, 'modules-api-v') || startsWith(github.ref_name, 'modules-wrapper-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          module="${tag%-v*}"
          wanted="${tag##*-v}"
          case "$module" in
            modules-api|modules-wrapper|claims-module|moderation-module|names-module|warp-module|homes-module|tpa-module|farmworld-module|pack-module|chained-module|rtp-module|hungergames-module) ;;
            *) echo "::error::$tag names no library module I know about"; exit 1 ;;
          esac
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "wanted=$wanted" >> "$GITHUB_OUTPUT"

      - name: Check tag matches that module's own version
        if: steps.module.outcome == 'success'
        run: |
          set -euo pipefail
          built="$(mvn -B -q -pl '${{ steps.module.outputs.module }}' -Dexpression=project.version -DforceStdout help:evaluate)"
          if [ "$built" != "${{ steps.module.outputs.wanted }}" ]; then
            echo "::error::$GITHUB_REF_NAME says ${{ steps.module.outputs.wanted }} but ${{ steps.module.outputs.module }}'s own pom says $built. Bump its version property in the parent pom or fix the tag."
            exit 1
          fi

      - name: Publish to packages.tstieh.de
        if: steps.module.outcome == 'success'
        env:
          REPOSILITE_USERNAME: ci-deploy
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
          # Reposilite's TLS termination trips a TLSv1.3/SNI handshake bug in Maven's HTTP transport
          # (works fine with plain java.net.http.HttpClient or curl) — pin TLSv1.2.
          MAVEN_OPTS: -Djdk.tls.client.protocols=TLSv1.2
        run: mvn --batch-mode --no-transfer-progress -pl '${{ steps.module.outputs.module }}' -DskipTests deploy

  # ── the download site ───────────────────────────────────────────────────────────────────────────
  #
  # A self-hosted runner on saphira, which is the server the site is on. So GitHub never needs a key
  # to anything and nothing has to be opened inbound: the runner reaches out, and the copy is a local
  # `cp` rather than an rsync over the internet.
  publish:
    name: Publish to plugins.raindancer118.de
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, saphira]

    steps:
      # Only the jars, from the job that built them. Nothing is rebuilt here: a site serving a
      # different jar from the one the tests ran against is the whole class of problem this avoids.
      - name: Fetch the jars this build produced
        uses: actions/download-artifact@v4
        with:
          name: plugins-${{ github.sha }}
          path: incoming

      - name: Put them on the shelf and re-render the page
        env:
          SITE: /home/eragon/plugins
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The runner is self-hosted, so the workspace survives between runs and `incoming` still
          # holds every artifact previous runs downloaded. Copying all of them put last week's jar back
          # on the shelf with a fresh mtime, which is also why the age-based prune below never caught
          # it: the superseded jar looked newer than the prune's window.
          rm -rf incoming.this-build
          mv incoming incoming.this-build
          # Flattened: download-artifact keeps the directory structure the upload had.
          find incoming.this-build -name '*.jar' ! -name 'original-*' \
            -exec cp -f {} "$SITE/files/" \;

          # What this build actually produced, by name. The prune keeps exactly these and nothing else
          # from the same families — not "whatever is recent", which was a guess about the filesystem
          # rather than a statement about the build.
          keep="$(find incoming.this-build -name '*.jar' ! -name 'original-*' -printf '%f\n' | sort)"
          rm -rf incoming.this-build

          cd "$SITE/files"
          # Written next to each jar so a download can be checked without trusting the page.
          for jar in *.jar; do
            sha256sum "$jar" > "$jar.sha256"
          done

          # An older version of *our* plugins goes, or the page lists one version and the directory
          # holds three. Scoped by name to what this repository builds: the other repository publishes
          # onto the same shelf, and an unscoped sweep would delete its jar on every push here.
          for jar in RainsExtendedClaims-*.jar RainsModeration-*.jar RainsColouredNames-*.jar \
                     RainsWarps-*.jar RainsHomes-*.jar RainsTPA-*.jar RainsFarmWorlds-*.jar \
                     RainsServerPack-*.jar YeukSMP-*.jar; do
            [ -e "$jar" ] || continue
            if ! printf '%s\n' "$keep" | grep -qxF "$jar"; then
              echo "removing superseded $jar"
              rm -f "$jar" "$jar.sha256"
            fi
          done

          BUILD="$BUILD" COMMIT="$COMMIT" bash "$SITE/bin/render.sh"

      - name: Check the site actually answers
        run: |
          set -euo pipefail
          # From inside the proxy network, which is the only place it is reachable — the container
          # publishes no port of its own.
          code=$(docker run --rm --network webproxy curlimages/curl:latest \
            -s -o /dev/null -w '%{http_code}' http://plugins/)
          echo "index: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::the site did not answer 200"; exit 1; }
