name: Build

# Every push, on every branch, so a jar exists for whatever is on GitHub right now — not only for
# master. A pull request builds too, so the jar is there before the merge rather than after.
#
# The per-plugin tags cut permanent releases. They name the plugin because the two version
# independently: the reactor is 1.0.0 while RainsExtendedClaims is 2.0.0 and RainsModeration is 2.0.0,
# so a bare `v2.1.0` could not say which of them it meant.
on:
  push:
    tags:
      - 'claims-v*'
      - 'moderation-v*'
    branches:
      - '**'
  pull_request:
  # Lets a build be kicked off by hand from the Actions tab.
  workflow_dispatch:

# write, because this workflow creates tags and releases. Everything else it does is read-only.
permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The whole history, so the release notes can name what changed since the last build.
          fetch-depth: 0

      # RainsCore is a `provided` dependency with no repository behind it: `de.raindancer:RainsCore` is
      # not published anywhere, so it resolves from the local ~/.m2 and nothing else. That is fine on a
      # laptop that has just built it and fatal on a runner that has never seen it — the build fails
      # while resolving, which reads as a broken repository rather than a missing sibling.
      #
      # So the sibling is checked out and installed first. The alternative is publishing RainsCore to
      # GitHub Packages, which is tidier and costs a token in both repositories; this needs none, as long
      # as RainsCore is public. If it is private, add a PAT with read access as a secret and pass it here
      # as `token:`.
      - name: Check out RainsCore
        uses: actions/checkout@v4
        with:
          repository: Raindancer118/RainsCore
          path: .rainscore
          # token: ${{ secrets.RAINSCORE_READ_TOKEN }}

      # Must be 25: paper-api 26.2 ships Java 25 class files, so an older JDK cannot read the dependency
      # at all — it fails while resolving rather than while compiling, which reads as a broken repository
      # instead of a wrong JDK.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests skipped deliberately: RainsCore's own workflow runs them on its own pushes, and running
      # them again here would make this build red for something that is not in this repository.
      - name: Install RainsCore into the local repository
        run: mvn --batch-mode --no-transfer-progress -f .rainscore/pom.xml install -DskipTests

      # `install` rather than `verify`, and that is not a preference. The standalone projects shade the
      # module jars out of the local repository, so a plain `verify` can shade whatever an earlier build
      # happened to leave in ~/.m2 — a jar newer than its own source, carrying last week's code. That
      # went out to a live server once. `install` writes this build's artifacts before they are shaded,
      # and StandaloneJarTest#theJarIsNotStale then checks that what ended up in the jar is what was
      # just compiled.
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean install

      # ── the jars a server operator actually wants ────────────────────────────────────────────────
      #
      # Found by pattern per plugin rather than by a hard-coded filename, because the version lives in
      # each standalone pom and moving it here would be a second copy that drifts. `original-*` is the
      # unshaded jar the shade plugin leaves behind: loading it would give a plugin with no module in it.
      - name: Find the jars
        id: jars
        run: |
          set -euo pipefail
          for plugin in claims:RainsExtendedClaims moderation:RainsModeration; do
            dir="${plugin%%:*}-standalone/target"
            name="${plugin##*:}"
            jar="$(find "$dir" -maxdepth 1 -name "$name-*.jar" ! -name 'original-*' | head -1)"
            if [ -z "$jar" ]; then
              echo "::error::$name did not build — no jar in $dir"
              exit 1
            fi
            sha="$(sha256sum "$jar" | cut -d' ' -f1)"
            echo "$sha  $(basename "$jar")" > "$jar.sha256"
            echo "${plugin%%:*}_jar=$jar" >> "$GITHUB_OUTPUT"
            echo "${plugin%%:*}_name=$(basename "$jar")" >> "$GITHUB_OUTPUT"
            echo "${plugin%%:*}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "$name: $sha"
          done

      # Kept as run artifacts as well as releases: a pull request has no release, and a red build's
      # partial output is still worth looking at.
      - name: Upload the jars as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ github.sha }}
          path: |
            claims-standalone/target/RainsExtendedClaims-*.jar
            moderation-standalone/target/RainsModeration-*.jar
            !**/original-*.jar
          if-no-files-found: error
          retention-days: 30

      # Uploaded on failure as well, which is the case they are actually needed for: a red build with no
      # report is a red build somebody has to reproduce locally before they can start reading it.
      - name: Publish the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7

      # ── what a push publishes ───────────────────────────────────────────────────────────────────

      - name: Write the notes for an automatic build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          {
            printf '%s\n' \
              "Automatic build of \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`." \
              "" \
              "**Not a release.** It is whatever the branch happened to be at that commit. For a fixed" \
              "version use a \`claims-vX.Y.Z\` or \`moderation-vX.Y.Z\` release." \
              "" \
              "| Plugin | Jar | sha256 |" \
              "|---|---|---|" \
              "| Rain's Extended Claims | \`${{ steps.jars.outputs.claims_name }}\` | \`${{ steps.jars.outputs.claims_sha }}\` |" \
              "| Rain's Moderation | \`${{ steps.jars.outputs.moderation_name }}\` | \`${{ steps.jars.outputs.moderation_sha }}\` |" \
              "" \
              "Both need \`RainsCore.jar\` beside them." \
              "" \
              "### What changed"
            git log -15 --no-merges --pretty='- %s' || true
          } > notes.md

      # One link that is always the newest build, so a test server can be pointed at it once. Deleted
      # and recreated rather than edited: an edited release keeps its old assets, and two jars with the
      # same name and different contents is the worst possible outcome here.
      - name: Publish rolling "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest \
            "${{ steps.jars.outputs.claims_jar }}" \
            "${{ steps.jars.outputs.claims_jar }}.sha256" \
            "${{ steps.jars.outputs.moderation_jar }}" \
            "${{ steps.jars.outputs.moderation_jar }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "Latest build" \
            --notes-file notes.md \
            --prerelease

      # And an immutable one per push, so a jar from three pushes ago is still fetchable — which
      # "latest" by its nature cannot promise. The run number rather than a date: it never repeats and
      # it sorts.
      - name: Publish this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" \
            "${{ steps.jars.outputs.claims_jar }}" \
            "${{ steps.jars.outputs.claims_jar }}.sha256" \
            "${{ steps.jars.outputs.moderation_jar }}" \
            "${{ steps.jars.outputs.moderation_jar }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}"

      # Otherwise the list grows by one per push and the entries worth finding are buried by March.
      # Only `build-*` is ever touched: a versioned release and `latest` are left alone, and the deletion
      # is by exact name rather than by pattern-matching whatever `gh` happened to print.
      - name: Prune old builds, keeping the last 15
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP=15
          # Newest first, so everything past the first $KEEP is what goes.
          mapfile -t builds < <(gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName --jq '.[] | select(.tagName | startswith("build-")) | .tagName')
          echo "${#builds[@]} build release(s); keeping $KEEP"
          if [ "${#builds[@]}" -le "$KEEP" ]; then
            exit 0
          fi
          for tag in "${builds[@]:$KEEP}"; do
            echo "removing $tag"
            gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          done

      # ── what a tag publishes ────────────────────────────────────────────────────────────────────

      # A permanent release for one plugin. The tag names it because the two version independently, and
      # the version in the tag has to match the one in that plugin's pom — a release whose tag says
      # 2.1.0 and whose jar says 2.0.0 is one nobody can reason about afterwards.
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/claims-v') || startsWith(github.ref, 'refs/tags/moderation-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          which="${TAG%%-v*}"
          wanted="${TAG#*-v}"

          case "$which" in
            claims)     jar='${{ steps.jars.outputs.claims_jar }}'
                        sha='${{ steps.jars.outputs.claims_sha }}'
                        title="Rain's Extended Claims" ;;
            moderation) jar='${{ steps.jars.outputs.moderation_jar }}'
                        sha='${{ steps.jars.outputs.moderation_sha }}'
                        title="Rain's Moderation" ;;
            *)          echo "::error::$TAG names no plugin I know about"; exit 1 ;;
          esac

          # Straight out of the pom, so the tag is checked against the thing that actually built.
          built="$(grep -oPm1 '(?<=<plugin.version>)[^<]+' "$which-standalone/pom.xml")"
          if [ "$built" != "$wanted" ]; then
            echo "::error::$TAG says $wanted but $which-standalone/pom.xml says $built. Bump the pom or fix the tag."
            exit 1
          fi

          {
            printf '%s\n' \
              "$title $built." \
              "" \
              "### Installing" \
              "" \
              "Drop \`$(basename "$jar")\` into \`plugins/\` alongside \`RainsCore.jar\`, which it needs" \
              "and never carries a copy of. Restart the server." \
              "" \
              "\`sha256: $sha\`" \
              "" \
              "---"
          } > release-notes.md

          gh release create "$TAG" \
            "$jar" "$jar.sha256" \
            --repo "${{ github.repository }}" \
            --title "$title $built" \
            --notes-file release-notes.md \
            --generate-notes

  # ── the download site ───────────────────────────────────────────────────────────────────────────
  #
  # A self-hosted runner on saphira, which is the server the site is on. So GitHub never needs a key
  # to anything and nothing has to be opened inbound: the runner reaches out, and the copy is a local
  # `cp` rather than an rsync over the internet.
  publish:
    name: Publish to plugins.raindancer118.de
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, saphira]

    steps:
      # Only the jars, from the job that built them. Nothing is rebuilt here: a site serving a
      # different jar from the one the tests ran against is the whole class of problem this avoids.
      - name: Fetch the jars this build produced
        uses: actions/download-artifact@v4
        with:
          name: plugins-${{ github.sha }}
          path: incoming

      - name: Put them on the shelf and re-render the page
        env:
          SITE: /home/eragon/plugins
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The runner is self-hosted, so the workspace survives between runs and `incoming` still
          # holds every artifact previous runs downloaded. Copying all of them put last week's jar back
          # on the shelf with a fresh mtime, which is also why the age-based prune below never caught
          # it: the superseded jar looked newer than the prune's window.
          rm -rf incoming.this-build
          mv incoming incoming.this-build
          # Flattened: download-artifact keeps the directory structure the upload had.
          find incoming.this-build -name '*.jar' ! -name 'original-*' \
            -exec cp -f {} "$SITE/files/" \;

          # What this build actually produced, by name. The prune keeps exactly these and nothing else
          # from the same families — not "whatever is recent", which was a guess about the filesystem
          # rather than a statement about the build.
          keep="$(find incoming.this-build -name '*.jar' ! -name 'original-*' -printf '%f\n' | sort)"
          rm -rf incoming.this-build

          cd "$SITE/files"
          # Written next to each jar so a download can be checked without trusting the page.
          for jar in *.jar; do
            sha256sum "$jar" > "$jar.sha256"
          done

          # An older version of *our* plugins goes, or the page lists one version and the directory
          # holds three. Scoped by name to what this repository builds: the other repository publishes
          # onto the same shelf, and an unscoped sweep would delete its jar on every push here.
          for jar in RainsExtendedClaims-*.jar RainsModeration-*.jar; do
            [ -e "$jar" ] || continue
            if ! printf '%s\n' "$keep" | grep -qxF "$jar"; then
              echo "removing superseded $jar"
              rm -f "$jar" "$jar.sha256"
            fi
          done

          BUILD="$BUILD" COMMIT="$COMMIT" bash "$SITE/bin/render.sh"

      - name: Check the site actually answers
        run: |
          set -euo pipefail
          # From inside the proxy network, which is the only place it is reachable — the container
          # publishes no port of its own.
          code=$(docker run --rm --network webproxy curlimages/curl:latest \
            -s -o /dev/null -w '%{http_code}' http://plugins/)
          echo "index: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::the site did not answer 200"; exit 1; }
