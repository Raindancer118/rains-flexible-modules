name: Build

# Every push, on every branch, so a jar exists for whatever is on GitHub right now.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # RainsCore is a `provided` dependency with no repository behind it: `de.raindancer:RainsCore` is
      # not published anywhere, so it resolves from the local ~/.m2 and nothing else. That is fine on a
      # laptop that has just built it and fatal on a runner that has never seen it — the build fails
      # while resolving, which reads as a broken repository rather than a missing sibling.
      #
      # So the sibling is checked out and installed first. The alternative is publishing RainsCore to
      # GitHub Packages, which is tidier and costs a token in both repositories; this needs none, as long
      # as RainsCore is public. If it is private, add a PAT with read access as a secret and pass it here
      # as `token:`.
      - name: Check out RainsCore
        uses: actions/checkout@v4
        with:
          repository: Raindancer118/RainsCore
          path: .rainscore
          # token: ${{ secrets.RAINSCORE_READ_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests skipped deliberately: RainsCore's own workflow runs them on its own pushes, and running
      # them again here would make this build red for something that is not in this repository.
      - name: Install RainsCore into the local repository
        run: mvn --batch-mode --no-transfer-progress -f .rainscore/pom.xml install -DskipTests

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      # The thing a server operator actually wants: the standalone plugin, shaded and ready to drop into
      # plugins/. The module jars are libraries and are not uploaded — a jar in a downloads folder that
      # cannot be installed is worse than no jar.
      - name: Upload the plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RainsExtendedClaims-${{ github.sha }}
          path: |
            claims-standalone/target/RainsExtendedClaims-*.jar
            !claims-standalone/target/original-*.jar
          if-no-files-found: error
          retention-days: 30

      # Every other standalone plugin the reactor produces, as they arrive. Not an error when there are
      # none: a branch that has not finished its second module should still build.
      - name: Upload any other standalone plugins
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: other-plugins-${{ github.sha }}
          path: |
            */target/*.jar
            !claims-standalone/target/*.jar
            !*/target/original-*.jar
            !modules-api/target/*.jar
            !modules-wrapper/target/*.jar
            !claims-module/target/*.jar
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7
