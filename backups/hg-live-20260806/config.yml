# HungerGames-Konfiguration — verwaltbar in-game über /hg config
# Nur vom Default abweichende Werte werden gespeichert.

teams:
  max-size: '10'
border:
  minimum-size: '50.0'
items:
  smoke-bomb:
    enemy-duration: '3'
  medikit:
    countdown-seconds: '2'
deathmatch:
  target-border-size: '50'
sponsors:
  tokens:
    amount-per-interval: '2'
  beacons:
    base-material: GOLD_BLOCK
    radius-max: '700'
    max-active: '4'
  shop:
    items: bread_pack|BREAD:8|1|Essen Paket, arrows|ARROW:16|1|Pfeile, iron_ingot|IRON_INGOT:2|2|Eisen,
      fiendfinder|ITEM:FIENDFINDER:1|4|Fiendfinder, smoke_bomb|ITEM:SMOKE_BOMB:1|6|Rauchbombe,
      lightning_strike|ITEM:LIGHTNING_STRIKE:1|12|Blitzschlag, hermes_boots|ITEM:HERMES_BOOTS:2|9|Hermes'
      Stiefel, krueckauwasser|ITEM:KRUECKAUWASSER:1|7|Krückauwasser, stupidness_protector|ITEM:STUPIDNESS_PROTECTOR:1|5|Trottel-Schutz,
      leap|ITEM:LEAP:1|4|Sprungfeder, medikit|ITEM:MEDIKIT:1|12|Medikit, aura_of_protection|ITEM:AURA_OF_PROTECTION:1|8|Aura
      der Bewahrung
sounds:
  countdown: BLOCK_NOTE_BLOCK_PLING; ENTITY_EXPERIENCE_ORB_PICKUP; ENTITY_WARDEN_HEARTBEAT
  game-start: ENTITY_ENDER_DRAGON_GROWL; BLOCK_END_PORTAL_SPAWN
  elimination: ENTITY_WITHER_HURT; ENTITY_FIREWORK_ROCKET_LARGE_BLAST; ENTITY_GENERIC_EXPLODE;
    ENTITY_ZOMBIE_VILLAGER_CURE; ENTITY_LIGHTNING_BOLT_THUNDER; ENTITY_LIGHTNING_BOLT_IMPACT^2;
    ENTITY_BLAZE_SHOOT; ENTITY_WARDEN_SONIC_BOOM; ITEM_TOTEM_USE
  supply-drop-warning: custom.halt; BLOCK_NOTE_BLOCK_BASS
  sponsor-token-earned: ENTITY_EXPERIENCE_ORB_PICKUP; BLOCK_NOTE_BLOCK_HARP
  sponsor-purchase-success: ENTITY_PLAYER_LEVELUP; BLOCK_BELL_USE; ENTITY_EXPERIENCE_ORB_PICKUP;
    ENTITY_FIREWORK_ROCKET_LARGE_BLAST
  victory: UI_TOAST_CHALLENGE_COMPLETE; BLOCK_BEACON_POWER_SELECT; ENTITY_PLAYER_LEVELUP;
    ENTITY_WITHER_DEATH
  item-hermes-boots: ENTITY_PHANTOM_FLAP@2~1.6^5; ENTITY_ENDER_DRAGON_FLAP^2; BLOCK_CONDUIT_ACTIVATE@0.75~0.5^1;
    ENTITY_ITEM_BREAK>4000; BLOCK_BEACON_ACTIVATE~0.6; BLOCK_BELL_RESONATE
  item-krueckau-throw: ENTITY_SPLASH_POTION_THROW; ENTITY_ILLUSIONER_CAST_SPELL; ENTITY_SPLASH_POTION_BREAK;
    ENTITY_SQUID_DEATH
  item-krueckau-impact: ENTITY_SPLASH_POTION_BREAK; ENTITY_ILLUSIONER_CAST_SPELL;
    ENTITY_EVOKER_CAST_SPELL>500; ENTITY_ZOMBIE_VILLAGER_CURE; ENTITY_ELDER_GUARDIAN_CURSE@0.25;
    ENTITY_ITEM_BREAK
  startup-launch: ENTITY_ILLUSIONER_CAST_SPELL
  cannon: ITEM_TOTEM_USE~0.9; ENTITY_GENERIC_EXPLODE~0.5; ENTITY_GENERIC_EXPLODE@0.4~0.4>200;
    ENTITY_GHAST_SHOOT; ENTITY_ENDER_DRAGON_FLAP; ENTITY_LIGHTNING_BOLT_THUNDER>1250;
    ENTITY_LIGHTNING_BOLT_IMPACT; BLOCK_GLASS_BREAK^1; BLOCK_GLASS_BREAK; ENTITY_GENERIC_BIG_FALL;
    ENTITY_ITEM_BREAK; BLOCK_STEM_BREAK; ENTITY_DRAGON_FIREBALL_EXPLODE~0.5; ENTITY_BLAZE_SHOOT~0.5;
    ENTITY_LIGHTNING_BOLT_THUNDER
effects:
  item-hermes-boots: SHRIEK; SNOWFLAKE; POOF; CLOUD; GUST
  item-lightning: ELECTRIC_SPARK@40~0.6; FLASH@2; FLAME; LAVA; TOTEM_OF_UNDYING; FIREWORK
  startup-arrive: HAPPY_VILLAGER@1~0.1; CHERRY_LEAVES
  cannon: SONIC_BOOM; SCULK_SOUL; REVERSE_PORTAL; DUST_PLUME; ASH; SOUL; DAMAGE_INDICATOR
