# ============================================================
# HUNGERGAMES LOOT CONFIGURATION
# ============================================================
# This file defines what items spawn in arena containers.
# Each container type has its own loot pool with items and spawn chances.
#
# === HOW WEIGHT WORKS ===
# Weight determines the relative probability of an item being selected.
#
# Example: If you have 3 items with weights 10, 20, and 70:
#   - Item A (weight 10): 10/(10+20+70) = 10% chance
#   - Item B (weight 20): 20/(10+20+70) = 20% chance
#   - Item C (weight 70): 70/(10+20+70) = 70% chance
#
# Higher weight = more likely to appear
# Lower weight = rarer items
#
# === AMOUNT FORMAT ===
# - Single number (e.g., 1): Always spawn exactly 1
# - Range (e.g., 1-5): Randomly spawn between 1 and 5
# ============================================================

loot:
  # How many slots to fill (percentage of container capacity)
  # chest/copper-chest/trapped-chest have 27 slots
  # barrel has 27 slots
  # shelf (oak_shelf) has 3 slots
  fill-percentage:
    chest: 40
    copper-chest: 45
    trapped-chest: 55
    barrel: 35
    shelf: 80
    supply_drop: 45
  
