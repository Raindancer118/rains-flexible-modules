# Checked by BundleJarTest — see worldgate-standalone's descriptor for why every line here matters.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '26.3'
description: 'A speedrun server: the speedrun lobby, Manhunt, the chat, and the world tools (/w, /dim, worlds and seeds, locking the Nether and the End).'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# A jar is as Folia-safe as the least safe thing in it, and every module here claims it on its own:
# speedrun (Manhunt included — /whitelist and the hunt's door run on the global region), the chat,
# the world gate and the world tools.
folia-supported: true

# RainsCore only. Speedrun, and Manhunt with it, is inside this jar; requiring RainsSpeedrun as well
# would make Paper refuse to load this without a second, conflicting lobby.
dependencies:
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
