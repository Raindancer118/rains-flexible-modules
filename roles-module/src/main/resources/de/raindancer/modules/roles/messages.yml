# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
roles:
  chosen: "<green>You are <article> <role> <green>now. <gray>You can change again in <white><wait></white>."
  chosen-whenever: "<green>You are <article> <role> <green>now."
  announce: "<gray><white><player></white> is <article> <role> <gray>now."
  wait: "<red>Not yet — you can change role again in <white><left></white>."
  same: "<gray>You are <article> <role> <gray>already."
  unknown: "<red>There is no role called <white><name></white>. <gray><white>/role</white> shows them all."
  not-saved: "<red>That could not be saved, so nothing changed. Staff: choices.yml cannot be read."
  no-role-yet: "<gray>You have no role yet. <white>/role</white> — a cook, a builder, an explorer… each pays less in the shop for different things."
  only-a-player: "<red>Only a player has a role."
  never-here: "<red><white><player></white> has never been on this server."
  bypass-on: "<green>Bypass on: you can change role whenever you like. <gray>/role bypass again turns it off; leaving does too."
  bypass-off: "<gray>Bypass off: changing role waits again."
  set: "<green><white><player></white> is <article> <role> <green>now."
  set-you: "<gray>Staff made you <article> <role><gray>."
  cleared: "<green><white><player></white> has no role now."
  reset: "<green><white><player></white> can change role straight away now."
  reloaded: "<green>roles.yml read: <white><count></white> role(s)."
  info: "<gray><white><player></white> is <article> <role><gray>:"
  info-none: "<gray><white><player></white> has no role yet."
  info-perk: "<dark_gray>  • <gray><perk> <dark_gray>(full: <full>%)"
  info-change: "<gray>Can change again in <white><left></white>."
  info-change-now: "<gray>Can change now."
  usage: "<gray>/role <dark_gray>— the roles · <gray>/role <role> · /role info"
  usage-staff: "<gray>/role set <player> <role|none> · /role reset <player> · /role bypass · /role reload"
  locked: "<red><role> <red>is not yours yet. <gray><white>/role</white> shows what it costs and lets you buy or rent it."
  bought: "<green>You bought <role> <green>for <white><amount></white>. It is yours for good."
  rented: "<green>You rented <role> <green>for <white><amount></white> a month. It stays yours while the rent is paid."
  not-for-sale: "<red><role> <red>cannot be bought or rented that way."
  already-yours: "<gray>You have <role> <gray>already."
  cannot-afford: "<red>That costs <white><amount></white> and you do not have it."
  no-economy: "<red>That costs <white><amount></white>, but this server has no money to pay it with."
  not-charged: "<red>The payment for <role> <red>was refused, so nothing was bought."
  rent-paid: "<gray>Rent for <role> <gray>paid: <white><amount></white>."
  rent-lapsed: "<red>Your rent for <role> <red>could not be paid, so you no longer have it. <gray>/role rent <id> takes it again."
  rent-warning: "<yellow>The rent for <role> <yellow>(<white><amount></white>) is due in <white><left></white>. <gray>Keep that much in your account or the role lapses."
  rent-cancelled: "<gray>You stopped renting <role><gray>. Nothing is charged again."
  rent-none: "<red>You are not renting <role><red>."
  usage-buy: "<gray>/role buy [role] · /role rent [role] · /role cancel [role]"
