# The roles players can take with /role. One each; changed again after the wait set in /settings.
#
#   title        what the role is called
#   icon         the item shown for it
#   colour       its name's colour, as #rrggbb
#   description  lines under the name
#   perks        what the shop gives the role, at full strength:
#     buy: 15        that much percent off buying …     (at most 25)
#     sell: 10       that much percent more selling …   (at most 25)
#     categories     whole shop drawers: building_blocks, decorations, redstone, transportation, food,
#                    tools, combat, brewing, misc
#     items          items by name; * stands for anything: "*_log", "cooked_*"
#     except         items never covered, though a drawer or pattern would
#     says           what it covers, in words, instead of the generated list
#
# A new role's perks start at a share of these sizes and grow to them the longer it is kept (/settings:
# "A new role starts at", "Perks are full after"). Where two perks of one role cover the same item, the
# better one counts. Selling never earns more than the player's own buy price, so no perk can be played
# against the shop. Read again with /role reload. Delete this file to get the shipped roles back.
roles:
  cook:
    title: Cook
    icon: cooked_beef
    colour: "#e8a33d"
    description:
      - "Keeps the server fed."
    perks:
      - buy: 15
        categories: [ food ]
        items: [ smoker, campfire, soul_campfire, bowl, sugar, egg, milk_bucket, cake ]
        says: "food, smokers and campfires"
      - sell: 10
        items: [ "cooked_*", bread, baked_potato, pumpkin_pie, cookie, cake, rabbit_stew, beetroot_soup,
                 mushroom_stew, golden_carrot ]
        says: "cooked food"

  farmer:
    title: Farmer
    icon: wheat
    colour: "#9bc53d"
    description:
      - "Grows what the cook cooks."
    perks:
      - buy: 15
        items: [ "*_seeds", pitcher_pod, "*_sapling", "*_hoe", bone_meal, composter, hay_block, wheat, carrot,
                 potato, sugar_cane, lead, pumpkin, melon ]
        says: "seeds, saplings, hoes and bone meal"
      - sell: 10
        items: [ wheat, carrot, potato, beetroot, melon_slice, pumpkin, sugar_cane, cactus, bamboo,
                 cocoa_beans, sweet_berries, egg, leather, feather, "*_wool", beef, porkchop, chicken,
                 mutton, rabbit ]
        says: "crops and what animals give"

  builder:
    title: Builder
    icon: bricks
    colour: "#c0703a"
    description:
      - "Puts the server up, block by block."
    perks:
      - buy: 12
        categories: [ building_blocks ]
        items: [ scaffolding, ladder, "*glass*" ]
        except: [ "*_ore", ancient_debris, "raw_*_block", coal_block, iron_block, gold_block, diamond_block,
                  emerald_block, lapis_block, redstone_block, netherite_block, copper_block, glass_bottle ]
        says: "building blocks, glass, scaffolding and ladders"
      - buy: 8
        categories: [ decorations ]
        says: "decoration"

  explorer:
    title: Explorer
    icon: compass
    colour: "#3fa7d6"
    description:
      - "Always somewhere else."
    perks:
      - buy: 20
        items: [ firework_rocket ]
        says: "rockets"
      - buy: 12
        categories: [ transportation ]
        items: [ compass, recovery_compass, map, spyglass, clock, ender_pearl, torch, lantern, "*_bed" ]
        says: "boats, rails, saddles, maps, torches and beds"

  miner:
    title: Miner
    icon: iron_pickaxe
    colour: "#8d99ae"
    description:
      - "Knows what is down there."
    perks:
      - buy: 12
        items: [ "*_pickaxe", "*_shovel", torch, ladder, tnt, rail, minecart ]
        says: "pickaxes, shovels, torches and TNT"
      - sell: 8
        items: [ coal, raw_iron, raw_gold, raw_copper, iron_ingot, gold_ingot, copper_ingot, diamond, emerald,
                 lapis_lazuli, redstone, quartz, amethyst_shard, "*_ore" ]
        says: "ores and what they give"

  mage:
    title: Mage
    icon: enchanting_table
    colour: "#9b5de5"
    description:
      - "Has a book for everything."
    perks:
      - buy: 15
        items: [ enchanted_book ]
        says: "enchanted books"
      - buy: 12
        categories: [ brewing ]
        items: [ lapis_lazuli, experience_bottle, book, bookshelf, enchanting_table, anvil, grindstone,
                 glowstone_dust, redstone ]
        says: "lapis, experience bottles, bookshelves, anvils and potion making"
      - sell: 8
        items: [ blaze_rod, ghast_tear, phantom_membrane, nether_wart, amethyst_shard ]
        says: "blaze rods, ghast tears and the like"

  hunter:
    title: Hunter
    icon: bow
    colour: "#d64545"
    description:
      - "Out at night on purpose."
    perks:
      - buy: 12
        categories: [ combat ]
        says: "weapons, armour and arrows"
      - sell: 10
        items: [ rotten_flesh, bone, string, spider_eye, gunpowder, ender_pearl, slime_ball, blaze_rod,
                 ghast_tear, phantom_membrane, magma_cream, ink_sac, prismarine_shard ]
        says: "what monsters drop"

  engineer:
    title: Engineer
    icon: redstone
    colour: "#ef476f"
    description:
      - "Makes it do it by itself."
    perks:
      - buy: 15
        categories: [ redstone ]
        items: [ rail, powered_rail, detector_rail, activator_rail, minecart, hopper_minecart ]
        says: "redstone and rails"
