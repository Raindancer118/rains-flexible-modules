# The roles players can take with /role. One each; changed again after the wait set in /settings.
#
#   title        what the role is called
#   icon         the item shown for it
#   colour       its name's colour, as #rrggbb
#   description  lines under the name
#   perks        what the shop gives the role, at full strength:
#     buy: 15        that much percent off buying …     (at most 25)
#     sell: 10       that much percent more selling …   (at most 25)
#     categories     whole shop drawers: building_blocks, decorations, redstone, transportation, food,
#                    tools, combat, brewing, misc
#     items          items by name; * stands for anything: "*_log", "cooked_*"
#     except         items never covered, though a drawer or pattern would
#     says           what it covers, in words, instead of the generated list
#   abilities      what the role does a little better in the game, at full strength (each has a ceiling):
#     hunger: 20     hunger drains that much slower                       (at most 30)
#     harvest: 20    that chance of one more crop from a ripe one          (at most 30)
#     butcher: 20    that chance of more food from an animal killed        (at most 30)
#     fortune: 10    that chance of one more drop from ore, not placed ore (at most 20)
#     falls: 25      that much less fall damage                            (at most 40)
#     speed: 6       that much faster on foot                              (at most 10)
#     reach: 20      reaches blocks that much further                      (at most 25)
#     tools: 20      that chance a tool takes no wear; items: [ ... ]      (at most 30)
#                    picks which tools (any pickaxe, shovel, axe or hoe when left out)
#     xp: 15         that much more experience                             (at most 25)
#     monsters: 10   that much more damage to monsters, never to players   (at most 15)
#     carts: 25      minecarts ridden go that much faster                  (at most 30)
#   price          one-time price to buy the role, like 500 or 1.5k. "0" (the default): not for sale
#   rent-per-month rent charged every 30 days of real time, like 50. "0" (the default): cannot be rented.
#                  Rent that cannot be paid ends the rental and the player loses the role. With a price and/or
#                  a rent a role is closed until bought or rented; with neither it is open to everybody.
#
# A new role's perks and abilities start at a share of these sizes and grow to them the longer it is kept (/settings:
# "A new role starts at", "Perks are full after"). Where two perks of one role cover the same item, the
# better one counts. Selling never earns more than the player's own buy price, so no perk can be played
# against the shop. Read again with /role reload. Delete this file to get the shipped roles back.
roles:
  cook:
    title: Cook
    icon: cooked_beef
    colour: "#e8a33d"
    description:
      - "Keeps the server fed."
    abilities:
      - harvest: 20
      - butcher: 20
    perks:
      - buy: 15
        categories: [ food ]
        items: [ smoker, campfire, soul_campfire, bowl, sugar, egg, milk_bucket, cake ]
        says: "food, smokers and campfires"
      - sell: 10
        items: [ "cooked_*", bread, baked_potato, pumpkin_pie, cookie, cake, rabbit_stew, beetroot_soup,
                 mushroom_stew, golden_carrot ]
        says: "cooked food"

  farmer:
    title: Farmer
    icon: wheat
    colour: "#9bc53d"
    description:
      - "Grows what the cook cooks."
    abilities:
      - harvest: 30
    perks:
      - buy: 15
        items: [ "*_seeds", pitcher_pod, "*_sapling", "*_hoe", bone_meal, composter, hay_block, wheat, carrot,
                 potato, sugar_cane, lead, pumpkin, melon ]
        says: "seeds, saplings, hoes and bone meal"
      - sell: 10
        items: [ wheat, carrot, potato, beetroot, melon_slice, pumpkin, sugar_cane, cactus, bamboo,
                 cocoa_beans, sweet_berries, egg, leather, feather, "*_wool", beef, porkchop, chicken,
                 mutton, rabbit ]
        says: "crops and what animals give"

  builder:
    title: Builder
    icon: bricks
    colour: "#c0703a"
    description:
      - "Puts the server up, block by block."
    abilities:
      - reach: 20
      - falls: 25
    perks:
      - buy: 12
        categories: [ building_blocks ]
        items: [ scaffolding, ladder, "*glass*" ]
        except: [ "*_ore", ancient_debris, "raw_*_block", coal_block, iron_block, gold_block, diamond_block,
                  emerald_block, lapis_block, redstone_block, netherite_block, copper_block, glass_bottle ]
        says: "building blocks, glass, scaffolding and ladders"
      - buy: 8
        categories: [ decorations ]
        says: "decoration"

  explorer:
    title: Explorer
    icon: compass
    colour: "#3fa7d6"
    description:
      - "Always somewhere else."
    abilities:
      - speed: 6
      - hunger: 25
    perks:
      - buy: 20
        items: [ firework_rocket ]
        says: "rockets"
      - buy: 12
        categories: [ transportation ]
        items: [ compass, recovery_compass, map, spyglass, clock, ender_pearl, torch, lantern, "*_bed" ]
        says: "boats, rails, saddles, maps, torches and beds"

  miner:
    title: Miner
    icon: iron_pickaxe
    colour: "#8d99ae"
    description:
      - "Knows what is down there."
    abilities:
      - tools: 20
        items: [ "*_pickaxe", "*_shovel" ]
      - fortune: 10
    perks:
      - buy: 12
        items: [ "*_pickaxe", "*_shovel", torch, ladder, tnt, rail, minecart ]
        says: "pickaxes, shovels, torches and TNT"
      - sell: 8
        items: [ coal, raw_iron, raw_gold, raw_copper, iron_ingot, gold_ingot, copper_ingot, diamond, emerald,
                 lapis_lazuli, redstone, quartz, amethyst_shard, "*_ore" ]
        says: "ores and what they give"

  mage:
    title: Mage
    icon: enchanting_table
    colour: "#9b5de5"
    description:
      - "Has a book for everything."
    abilities:
      - xp: 15
    perks:
      - buy: 15
        items: [ enchanted_book ]
        says: "enchanted books"
      - buy: 12
        categories: [ brewing ]
        items: [ lapis_lazuli, experience_bottle, book, bookshelf, enchanting_table, anvil, grindstone,
                 glowstone_dust, redstone ]
        says: "lapis, experience bottles, bookshelves, anvils and potion making"
      - sell: 8
        items: [ blaze_rod, ghast_tear, phantom_membrane, nether_wart, amethyst_shard ]
        says: "blaze rods, ghast tears and the like"

  hunter:
    title: Hunter
    icon: bow
    colour: "#d64545"
    description:
      - "Out at night on purpose."
    abilities:
      - monsters: 10
    perks:
      - buy: 12
        categories: [ combat ]
        says: "weapons, armour and arrows"
      - sell: 10
        items: [ rotten_flesh, bone, string, spider_eye, gunpowder, ender_pearl, slime_ball, blaze_rod,
                 ghast_tear, phantom_membrane, magma_cream, ink_sac, prismarine_shard ]
        says: "what monsters drop"

  engineer:
    title: Engineer
    icon: redstone
    colour: "#ef476f"
    description:
      - "Makes it do it by itself."
    abilities:
      - carts: 25
    perks:
      - buy: 15
        categories: [ redstone ]
        items: [ rail, powered_rail, detector_rail, activator_rail, minecart, hopper_minecart ]
        says: "redstone and rails"

  biologist:
    title: Biologist
    icon: spore_blossom
    colour: "#6ab04c"
    description:
      - "Studies everything that grows or breathes."
    abilities:
      - harvest: 10
    perks:
      - sell: 12
        items: [ "*_sapling", "*_leaves", "*_seeds", "*_mushroom", "*_fungus", "*_roots", "*_tulip", "*_petals",
                 dandelion, poppy, blue_orchid, allium, azure_bluet, oxeye_daisy, cornflower, lily_of_the_valley,
                 wither_rose, torchflower, sunflower, lilac, rose_bush, peony, pitcher_plant, pitcher_pod,
                 spore_blossom, wildflowers, cactus, cactus_flower, sugar_cane, bamboo, kelp, seagrass, sea_pickle,
                 vine, glow_lichen, lily_pad, moss_block, moss_carpet, azalea, flowering_azalea, big_dripleaf,
                 small_dripleaf, hanging_roots, short_grass, tall_grass, fern, large_fern, dead_bush, nether_wart,
                 wheat, carrot, potato, beetroot, melon_slice, melon, pumpkin, sweet_berries, glow_berries,
                 cocoa_beans, chorus_fruit, chorus_flower, apple, mangrove_propagule, nether_sprouts, twisting_vines,
                 weeping_vines, shroomlight, red_mushroom_block, brown_mushroom_block ]
        except: [ "*_wood", "*_log", "stripped_*" ]
        says: "anything that grows"
      - sell: 10
        items: [ rotten_flesh, bone, bone_meal, string, spider_eye, gunpowder, ender_pearl, slime_ball, blaze_rod,
                 breeze_rod, ghast_tear, phantom_membrane, magma_cream, ink_sac, glow_ink_sac, prismarine_shard,
                 prismarine_crystals, shulker_shell, nautilus_shell, turtle_scute, armadillo_scute, rabbit_hide,
                 rabbit_foot, leather, feather, egg, "*_wool", beef, porkchop, chicken, mutton, rabbit, cod, salmon,
                 tropical_fish, pufferfish, honeycomb ]
        says: "what mobs and animals drop"
