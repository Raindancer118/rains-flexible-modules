# Generated in shape by StandaloneDescriptor and checked by DescriptorTest — see that class for why every line
# here matters, and for the two ways of writing this file that fail silently.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '1.21'
description: 'Runners against Hunters, played in the speedrun lobby: the lobby''s own goal is what the Runners race for, every Hunter carries a compass that follows a Runner through the portal they took, a caught Runner is out for good, and a Runner can open and close the server''s door around a hunt.'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# Not claimed here, deliberately: WhitelistCommand.passthrough calls Bukkit.dispatchCommand from
# whatever thread the /whitelist command lands on. Folia support is a claim to earn once that is
# actually true, not a default.
# folia-supported: true

dependencies:
  # Both phases, and bootstrap is not belt-and-braces — see chained-standalone's own copy of this
  # note, which this repeats because the mistake it guards against (RainsCore declared for the server
  # phase alone, so the bootstrapper that discovers modules never gets its classes) has already
  # happened once in this project.
  #
  # RainsSpeedrun is the second required host here, not RainsCore alone — and more than a dependency
  # now: Manhunt is a game *that lobby plays* (see SpeedrunMode), so without RainsSpeedrun there is
  # nowhere for a hunt to happen at all. manhunt-module compiles against its classes as a `provided`
  # dependency, exactly like chained-module. RainsManhunt.jar deliberately does not shade
  # speedrun-module in: a shaded copy alongside an installed RainsSpeedrun would be two independent
  # SpeedrunSessions on one server, each with its own idea of whether a run has already finished.
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
    RainsSpeedrun:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      # The line that actually puts RainsCore's classes on this plugin's classpath. Paper plugins get isolated
      # classloaders, so without it everything above is right and the plugin dies the moment it touches one.
      join-classpath: true
    RainsSpeedrun:
      load: BEFORE
      required: true
      join-classpath: true
