# ─────────────────────────────────────────────────────────────────────────────
#  What the moderation module says.
#
#  These lines are offered to RainsCore as *defaults*, below anything written in
#  the server's own messages.yml — so editing them there wins, and this file is
#  what tells you which keys exist.
#
#  <angle-brackets> are values filled in at the moment the line is sent. Colours
#  are MiniMessage, so <red>, <gradient:...> and the rest all work.
# ─────────────────────────────────────────────────────────────────────────────

moderation:
  # ── the everyday ones ────────────────────────────────────────────────────
  punished: "<green><white><player></white> is now <white><what></white> <gray>(<length>)."
  lifted: "<green><white><player></white> is no longer <white><what></white>."
  nothing-to-lift: "<gray>There is nothing of that kind in force for <white><player></white>."
  put-right: "<green>Healed and fed <white><player></white>."
  usage: "<gray>Usage: <white><usage>"
  no-such-player: "<red>The server has never seen anybody called <white><player></white>."
  not-here: "<gray><player> is not on the server right now."
  only-a-player: "<gray>This one is for somebody standing in the world."
  console-use-commands: "<gray>The console has no screens. Try <white>/history</white>, <white>/reports list</white> or <white>/ban</white>."

  # ── the tools a moderator points at themselves ───────────────────────────
  # NB: the keys are "turned-on" and not "on". YAML resolves a bare `on:` key to the boolean true, so
  # the line would be stored as ...instakill.true and every lookup would print its own key. Seen in
  # game once as "<moderation.tool.instakill.on>"; MessagesTest now fails the build over it.
  # heal / feed / hurt / starve. Events, not toggles — so "done" rather than "turned-on".
  vitals:
    heal:
      done: "<green>You are whole again."
      done-other: "<green>You healed <white><player></white>."
      received: "<green><white><player></white> healed you."
    feed:
      done: "<green>You are full."
      done-other: "<green>You fed <white><player></white>."
      received: "<green><white><player></white> fed you."
    hurt:
      done: "<red>That hurt."
      done-other: "<red>You took half of <white><player></white>'s health."
      received: "<red><white><player></white> took half your health."
    starve:
      done: "<gray>You are suddenly very hungry."
      done-other: "<gray>You emptied <white><player></white>'s hunger bar."
      received: "<gray><white><player></white> emptied your hunger bar."

  tool:
    fly:
      turned-on: "<green>You can fly."
      turned-off: "<gray>You can no longer fly."
      turned-on-other: "<green><white><player></white> can fly."
      turned-off-other: "<gray><white><player></white> can no longer fly."
    god:
      turned-on: "<green>Nothing can hurt you. <dark_gray>It goes off when you log out."
      turned-off: "<gray>You can be hurt again."
      turned-on-other: "<green>Nothing can hurt <white><player></white>."
      turned-off-other: "<gray><white><player></white> can be hurt again."
    instakill:
      turned-on: "<red>Everything you hit will die. <dark_gray>Mind the livestock."
      turned-off: "<gray>You hit normally again."
      turned-on-other: "<red>Everything <white><player></white> hits will die."
      turned-off-other: "<gray><white><player></white> hits normally again."

  # ── how long a ban you may give ──────────────────────────────────────────
  ban:
    too-long-for-you: "<red>That is longer than you may ban for. <gray>Your limit is <white><detail></white> — an admin can go further."
    not-for-ever-for-you: "<red>A permanent ban is an admin's decision. <gray>You can ban for up to <white><detail></white>."
    not-yours-to-lift: "<red>That is a permanent ban, so lifting it is an admin's decision."

  # ── staff ranks ──────────────────────────────────────────────────────────
  rank:
    changed: "<green><white><player></white> is now <<colour>><rank></<colour>><gray>."
    removed: "<yellow><white><player></white> is no longer staff."
    you-are-now: "<green>You are now <<colour>><rank></<colour>><gray>. <gray><what>"
    you-are-no-longer: "<yellow>You are no longer part of the staff."
    not-staff: "<gray><player> is not staff."
    unknown: "<red>There is no rank called '<word>'. <gray>Try one of: <ranks>."
    already-at-the-top: "<gray><player> is already <white><rank></white>, which is the highest rank."
    not-yours: "<red>You may not hand out that rank."
    only-below-you: "<gray>You can only promote somebody to <white><rank></white> or below — the rank under your own."
    not-above-you: "<gray><player> is <white><rank></white>, which is not below your own rank."
    yourself: "<gray>You cannot change your own rank."
    handing-out-is-off: "<gray>Only the server owner may hand out ranks on this server."
    granted: "<green>Gave <white><player></white> <white><what></white>."
    revoked: "<yellow>Took <white><what></white> from <white><player></white>."
    preset-restored: "<green><white><player></white> is back to exactly what their rank grants."

  # ── said late, because they were not there at the time ───────────────────
  while-you-were-away: "<gray>While you were away:"

  # ── where somebody stands ────────────────────────────────────────────────
  # <colour> is filled in from the standing itself, so "banned" is red and
  # "in good standing" is green without three copies of this line.
  standing: "<white><player></white> is <<colour>><standing></<colour>><gray>."
  standing-detail: "<dark_gray>  <entries> on record · <warnings>/<threshold> recent warning(s) · <notes> note(s) · <reports> report(s)"

  # ── refusals, which are the rules' own keys ──────────────────────────────
  no-permission: "<red>You may not do that."
  not-yourself: "<gray>You cannot do that to yourself."
  they-are-immune: "<red>That account is protected. Only the console can act on it."
  nobody-there: "<gray>There is nobody to do that to."

  # ── what somebody is told about themselves ───────────────────────────────
  you-were-mute: "<red>You have been muted <gray>(<length>)<red>: <white><reason>"
  you-were-freeze: "<red>You cannot build for now <gray>(<length>)<red>: <white><reason>"
  you-were-warning: "<yellow>A warning has been put on your record: <white><reason>"

  # ── lengths and prompts ──────────────────────────────────────────────────
  type-a-length: "<gray>Type how long — <white>90m</white>, <white>3d</white>, <white>perm</white>. <dark_gray>m is minutes, M is months."
  unreadable-length: "<red>'<text>' is not a length I can read. <gray>Nothing has been done — try <white>2h</white> or <white>perm</white>."
  nothing-typed: "<gray>Nothing was typed, so nothing happened."
  type-a-name: "<gray>Type part of a name to search for."
  type-a-note: "<gray>Type what to remember about <white><player></white>. <dark_gray>They never see it."

  # ── the record ───────────────────────────────────────────────────────────
  record-empty: "<gray><player> has never been punished here."
  type-a-reason: "<yellow>Type the reason for the <what> of <white><player></white> in chat. <dark_gray>You have two minutes."
  record-entry: "<gray><what> — <white><reason></white> <dark_gray>(<length>, by <by>)"
  record-report: "<aqua>Reported <dark_gray>by <gray><by></gray> — <white><text></white> <dark_gray>(<state>)"
  record-more: "<gray>…and <white><count></white> more. <dark_gray>Open <white>/mod <player></white> for the lot."
  record-see-screen: "<dark_gray>Open <white>/mod <player></white> to act on any of this."
  note-written: "<green>Written down about <white><player></white>."
  note-removed: "<yellow>The note has been removed. <dark_gray>The removal is on the record."

  # ── inventories ──────────────────────────────────────────────────────────
  invsee:
    refused: "<red>That inventory could not be opened: <gray><reason>"

  # ── staff chat ───────────────────────────────────────────────────────────
  staff-chat:
    turned-on: "<dark_aqua>You are talking to the staff. <gray>Type <white>/staffchat</white> again to stop."
    turned-off: "<gray>You are talking to the server again."
    no-longer-yours: "<red>You may no longer use staff chat, so that went nowhere. <gray>You are back in ordinary chat."

  # ── you are vanished ─────────────────────────────────────────────────────
  vanished: "<gray>You are invisible. <dark_gray>Players cannot see you or hear you arrive."
  visible-again: "<green>You are visible again."

  # ── reports ──────────────────────────────────────────────────────────────
  report:
    filed: "<green>Reported. <gray>The staff have it as <white><id></white>."
    not-taken: "<gray>That report was not taken — somebody may have reported <white><player></white> already."
    switched-off: "<gray>Reports are switched off on this server."
    too-short: "<gray>Say a little more than that — at least <white><detail></white> characters, so somebody can act on it."
    not-yourself: "<gray>You cannot report yourself."
    nobody-there: "<gray>There is nobody by that name to report."
    too-soon: "<gray>You have just reported somebody. <dark_gray>Try again in <detail>."
    already-open: "<gray>You have already reported them — the staff have it as <white><detail></white>."
    too-many: "<gray>You have <white><detail></white> reports still open. <dark_gray>Wait for one to be dealt with."
    waiting: "<yellow><white><count></white> report(s) are waiting. <dark_gray>/reports"
    queue-empty: "<gray>Nothing is waiting."
    queue-more: "<gray>…and <white><count></white> more."
    type-what-happened: "<gray>What happened? <dark_gray>Reporting <white><player></white> for <white><category></white> — say where and when, so somebody can look."
    type-what-you-did: "<gray>Type what you did about <white><id></white>. <dark_gray>Whoever reported it is told."
    type-why-not: "<gray>Type why there was nothing in <white><id></white>. <dark_gray>Whoever reported it is told."
    closed: "<green><white><id></white> is closed."
    already-closed: "<gray><id> had already been closed by somebody else."
    was-dealt-with: "<green>Your report <white><id></white> was dealt with: <gray><outcome>"
    was-rejected: "<gray>Your report <white><id></white> was looked at: <gray><outcome>"
