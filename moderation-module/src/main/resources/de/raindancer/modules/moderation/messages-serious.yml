# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.
# A line the owner rewrote in plugins/RainsCore/messages.yml wins in both tones.

moderation:
  vitals:
    heal:
      done: "<green>You are whole again."
    hurt:
      done: "<red>You hurt yourself."
    starve:
      done: "<gray>You are suddenly very hungry."
  tool:
    god:
      turned-off: "<gray>You can be hurt again."
  world:
    nothing-to-replace: "<gray>Nothing there would take a vein. <dark_gray>Only natural stone and dirt are replaced — never anything built."
  staff-chat:
    turned-off: "<gray>You are talking to the server again."
  vanished: "<gray>You are invisible. <dark_gray>Players cannot see you or hear you arrive."
