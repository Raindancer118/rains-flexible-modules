# Generated in shape by StandaloneDescriptor and checked by DescriptorTest — see that class for why every line
# here matters, and for the two ways of writing this file that fail silently.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '1.21'
description: 'Two players, mechanically chained together — get too far apart and further separation is simply blocked, a speedrun timer runs underneath it, and the map can be reset between attempts.'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# SpeedrunReset.regenerate is main-thread-only: it calls Bukkit.unloadWorld and WorldCreator#createWorld
# directly, the way FarmWorlds does, and neither is a regionised operation Folia can run from just anywhere.
# ChainService.resetWorld used to call it directly from whatever thread the admin screen click or the
# /chain reset command landed on — a player's own region thread on Folia. It now hops onto the global
# region scheduler first (Scheduling.global) and reports the result back through a callback instead of a
# synchronous return value.
folia-supported: true

dependencies:
  # Both phases, and bootstrap is not belt-and-braces. Paper runs bootstrap with its own dependency tree and
  # its own classpath, and the bootstrapper is where the modules are first discovered — it has to look, since
  # commands are registered during bootstrap or they never exist. Declared for the server phase alone, the
  # module fails to link at bootstrap with a ClassNotFoundException for a RainsCore class and the plugin
  # reports that it contains no modules. That is what the claims plugin did on the test server the first time.
  #
  # RainsSpeedrun is the second required host here, not RainsCore alone — chained-module compiles against
  # speedrun-module's engine classes (SpeedrunSession, SpeedrunTimer, the end conditions) as a `provided`
  # dependency, exactly the way every module compiles against RainsCore itself, so those classes have to
  # come from somewhere real at runtime. RainsChained.jar deliberately does not shade speedrun-module in:
  # a shaded copy alongside an installed RainsSpeedrun would be two independent SpeedrunSessions on one
  # server, each with its own idea of whether a run has already finished.
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
    RainsSpeedrun:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      # The line that actually puts RainsCore's classes on this plugin's classpath. Paper plugins get isolated
      # classloaders, so without it everything above is right and the plugin dies the moment it touches one.
      join-classpath: true
    RainsSpeedrun:
      load: BEFORE
      required: true
      join-classpath: true
