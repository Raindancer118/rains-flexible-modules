# Rain's Chained — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins, and so
# does a host's bundled wording. See Messages.defineFrom.
chained:

  # ---------------------------------------------------------------- the wall
  wall: "<red>You are chained, and going further would pull you apart. Stay close."

  # ---------------------------------------------------------------- pairing
  paired: "<green><white><first></white> and <white><second></white> are chained, up to <white><distance></white> blocks apart. Enjoy the company."
  pair-refused: "<red>They could not be chained: <white><reason></white>. Love is complicated."
  not-paired: "<red><white><name></white> is not chained to anybody. Free as a bird."
  unpaired: "<green><white><name></white> is no longer chained to anybody. Freedom at last."
  unknown-player: "<red>There is nobody online called <white><name></white>. Maybe they ran away."
  player-offline: "<red><white><name></white> is offline right now. Chains need two people who are actually here."
  too-many: "<red><white><typed></white> matches <white><count></white> players - pick one. Chains come in pairs, not crowds."
  selector-refused: "<red>Selectors like <white><typed></white> are not yours to use here - or they are not written right. Type a name instead."

  # ---------------------------------------------------------------- running
  started: "<green>The clock is running. Do not drift too far."
  start-refused: "<red>Could not start a run. Pair yourself first, or one is already going."
  stopped: "<yellow>The run has been stopped. Chains stay on, though."
  stop-refused: "<red>There is no run of yours to stop. Nothing is going on."

  # ---------------------------------------------------------------- resetting
  reset-done: "<green>The map has been reset. Clean slate."
  reset-refused: "<red>The map could not be reset. Is the configured world loaded?"

  # ---------------------------------------------------------------- general
  only-a-player: "<red>Only somebody standing in the world can do that. Chains need ankles."
  not-yours: "<red>Chained is not yours to change. Nice try."

  usage:
    pair: "<gray>/chain pair <first player> <second player> [max distance]"
    unpair: "<gray>/chain unpair <player>"
    reset: "<gray>/chain reset [seed <a number|random>]"

  help:
    - "<gray>/chain <dark_gray>— how far apart you may go, and the clock"
    - "<gray>/chain status <dark_gray>— the same, as a menu"
    - "<gray>/chain start <dark_gray>— begin the run for your pair"
    - "<gray>/chain stop <dark_gray>— end it early"
    - "<dark_gray>/chain admin <dark_gray>— pairing, and resetting the map"
