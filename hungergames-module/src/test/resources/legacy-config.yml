    sponsor-shop-disabled: "Shop deaktiviert"
    sponsor-beacon-disabled: "Beacons deaktiviert"
    deathmatch-warning: "Deathmatch-Warnung ({seconds}, {size})"
    deathmatch-start: "Deathmatch-Start"
