  startup-launch: "Startsequenz: Abschuss aus der Röhre"
  startup-arrive: "Startsequenz: Ankunft auf der Plattform"
  cannon: "Kanonenschuss-Partikel (global, Standard aus)"
announcements:
  enabled: true
  use-title: true
  use-actionbar: true
  use-chat: true
  killfeed-enabled: true
  remaining-players-enabled: true
  remaining-players-thresholds:
  - "10"
  - "5"
  - "3"
  - "2"
  text:
    game-start: "Spielstart"
    countdown: "Countdown ({seconds})"
    grace-end: "Ende der Schutzfrist"
    kill: "Kill ({victim}, {killer}, {alive})"
    elimination: "Eliminierung ohne Killer ({victim}, {alive})"
    supply-drop-warning: "Supply-Drop-Warnung ({seconds}, {coords})"
    supply-drop-landed: "Supply-Drop-Landung ({coords})"
    sponsor-token-earned: "Sponsor-Token erhalten ({amount})"
    sponsor-beacon-spawned: "Sponsor-Beacon gespawnt ({coords})"
    sponsor-purchase: "Sponsor-Kauf erfolgreich ({item}, {cost})"
