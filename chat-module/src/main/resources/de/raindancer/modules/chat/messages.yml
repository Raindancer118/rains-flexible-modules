
chat:

  # ── general ──────────────────────────────────────────────────────────────
  usage: "<gray>Usage: <white><usage>"
  only-a-player: "<red>Only a player can do that. The console doesn't get a vote."

  # ── /announce ─────────────────────────────────────────────────────────────
  poll:
    asked: "<gold><bold>Poll</bold> <gray>by <white><player></white>: <yellow><question>"
    button: "<aqua>[<answer>]"
    button-tooltip: "<gray>Vote for <white><answer></white> — you can change your mind until it ends"
    closes-in: "<dark_gray>  Click an answer. Closes in <time>."
    voted: "<green>Vote's in: <white><answer></white>. Democracy!"
    changed: "<green>Changed your mind? Fair. You're now on <white><answer></white>."
    already: "<gray>You already picked <white><answer></white> — clicking harder doesn't count twice."
    over: "<gray>That poll is over. The people have spoken."
    results: "<gold><bold>Poll results:</bold> <yellow><question>"
    results-so-far: "<gold>So far: <yellow><question>"
    result-line: "<white>  <answer> <aqua><bar></aqua> <gray><percent>% (<count>)"
    winner: "<green>  And the winner is <white><answer></white>! <dark_gray>(<count> voted)"
    tie: "<yellow>  It's a tie between <white><answers></white>. Rematch?"
    nobody-voted: "<gray>  Nobody voted. Tough crowd."
    none: "<gray>There's no poll running right now."
    not-yours: "<red>That's not your poll to end — only whoever started it, or staff. Ballot-box hijacking is frowned upon."
    off: "<red>Polls are switched off on this server. Opinions are not being collected."
    one-at-a-time: "<yellow>A poll is already running. One at a time, or nobody knows which button is which."
    not-started: "<red>That poll couldn't be started — try different answers? The ballot box refused."
    not-a-poll: "<red><detail>"
    no-question: "<red>Ask a question first. A poll needs something to be about."
    question-too-long: "<red>That question is a speech — keep it under 100 characters."
    too-few: "<red>A poll needs at least two answers, otherwise it's a statement."
    too-many: "<red>At most six answers — nobody reads past that anyway."
    empty-answer: "<red>One of the answers is empty. Silence is not an option."
    answer-too-long: "<red>Keep each answer to 24 characters, so it fits on a button. Buttons are not novels."
    twice: "<red>The same answer twice would split the vote. Even democracy has limits."
    length: "<red>Between 10 seconds and an hour, please. This is a poll, not a long-term relationship."
    help:
      - "<gold><bold>Polls"
      - "<gray>Ask a question, add up to six answers, pick how long it runs, Start."
      - "<gray>Everybody gets a button per answer and can change their vote until it ends."
      - "<gray>Quicker: <white>/poll 2m Best mob? | Creeper | Axolotl"
      - "<dark_gray>/poll results shows how it stands, /poll end ends it now."

  announce:
    banner: |-
      <gold>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
      <yellow><bold>Announcement</bold>
      <white><text>
      <gold>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬

  # ── @-mentions ────────────────────────────────────────────────────────────
  mention:
    pinged: "<yellow>⚡ <white><player></white> <yellow>mentioned you: <gray><text>"
    while-away: "<yellow>⚡ While you were away, you were mentioned <white><count></white> time(s). Popular!"
    while-away-line: "  <white><player></white><gray>: <text>"

  # ── message quality ─────────────────────────────────────────────────────
  quality:
    caps: "<red>Try that again without shouting. We can hear you fine."
    repeat: "<red>You already said that. Chat remembers."
    cooldown: "<red>Easy, wordsmith — wait <white><seconds></white>s before your next message."
    slowmode: "<red>Chat is in slowmode — wait <white><seconds></white>s. Use the time to think of something good."

  # ── frozen chat ───────────────────────────────────────────────────────────
  frozen: "<red>Chat is frozen right now. Hold that thought."

  # ── /chathistory ──────────────────────────────────────────────────────────
  history:
    disabled: "<red>Chat history is switched off on this server. What was said stays unsaid."
    none: "<gray>Nothing happened while you were away. You missed nothing, promise."
    missed: "<yellow>You missed <white><count></white> message(s) — /chathistory to catch up on the gossip."
    header: "<gray>── <white><count></white> message(s) ──"
    line: "<dark_gray>[<white><time></white>] <gray><player>: <text>"

  no-permission: "<red>You are not allowed to do that. The rank for it is somewhere above yours."
  not-online: "<red>Nobody called <white><player></white> is online. Typo, or ghost?"

  # ── /chat private, /chat public ───────────────────────────────────────────
  # /chat team, /chat all, and the picker /chat opens — channels other modules offer (Core's ChatChannels).
  channel:
    now: "<green>You are talking to <white><channel></white> now."
    unavailable: "<yellow>You have no <white><channel></white> chat to talk in right now."
    line: "<aqua><tag></aqua> <line>"
  private:
    line: "<dark_purple>[Private]</dark_purple> <line>"
    started: "<light_purple>You are in a private chat now. <gray>/chat private [name] invites somebody, /chat public talks in public again, /chat private end closes it."
    switched: "<light_purple>Your messages go to the private chat again."
    already-private: "<gray>You are already talking in the private chat."
    public: "<green>Your messages go to public chat again. <gray>You still read the private chat — /chat private to talk there, /chat private leave to leave it."
    already-public: "<gray>You are already talking in public chat."
    added: "<light_purple><player></light_purple> <gray>joined the private chat."
    invited: "<light_purple>Invited <white><player></white>. <gray>They join once they accept — the invitation stands for <seconds> seconds."
    invitation: "<white><owner></white> <light_purple>invites you to a private chat. <gray>Nobody else sees it. Stands for <seconds> seconds."
    already-invited: "<gray><player> already has an invitation from you."
    invite-gone: "<red>That invitation is no longer open. The guest list has moved on."
    you-joined: "<light_purple>You joined <white><owner></white>'s private chat — your messages go there now. <gray>/chat public talks in public again, /chat private leave leaves it."
    you-are-in-another-chat: "<red>You are already in another private chat. <gray>/chat private leave leaves it first. One clique at a time."
    you-declined: "<gray>You declined <white><owner></white>'s invitation."
    declined: "<gray><player> declined your invitation."
    already-a-member: "<gray><player> is already in this private chat."
    in-another-chat: "<red><white><player></white> is already in another private chat. Popular, apparently."
    not-yourself: "<red>That would be yourself. You are in this chat already, congratulations."
    not-the-owner: "<red>Only <white><owner></white> can do that in this private chat. It is their party."
    not-a-member: "<red><white><player></white> is not in this private chat. Hard to remove somebody who was never invited."
    not-in-a-chat: "<red>You are not in a private chat. <gray>/chat private starts one. <red>Talking to yourself does not count."
    removed: "<gray><player> was removed from the private chat."
    you-were-removed: "<red>You were removed from <white><owner></white>'s private chat. <gray>Your messages go to public chat again."
    left: "<gray><player> left the private chat."
    you-left: "<green>You left the private chat. <gray>Your messages go to public chat again."
    ended: "<gray>The private chat was closed by <white><player></white>. Your messages go to public chat again."
    ended-offline: "<gray>The private chat closed — <white><player></white> went offline. Your messages go to public chat again."
    went-offline: "<gray><player> went offline and left the private chat."
    members: "<light_purple>Private chat of <white><owner></white> <gray>(<count>): <white><members>"

  # ── staff tools, /chat ────────────────────────────────────────────────────
  admin:
    cleared: "<gray>Chat was cleared by <white><player></white>."
    frozen: "<red>Chat has been frozen by <white><player></white>. Stay cool."
    unfrozen: "<green>Chat has been unfrozen by <white><player></white>. Talk away."
    slowmode-set: "<yellow>Slowmode set to <white><seconds></white>s by <white><player></white>."
    slowmode-off: "<green>Slowmode switched off by <white><player></white>."
    slowmode-range: "<red>Slowmode has to be between 0 and 60 seconds. Time travel is not supported."
