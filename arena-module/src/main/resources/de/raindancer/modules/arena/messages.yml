# Rain's Arena — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins. See
# Messages.defineFrom. Every placeholder a line asks for is supplied where it is sent.
arena:

  usage: "<gray>/arena  ·  /arena hub  ·  /arena queue [mode] [kit] [stake]  ·  /arena wave [preset] [kit]  ·  /arena spectate <player>  ·  /arena stats [player]  ·  /arena leave"
  only-a-player: "<red>Only a player can do that."
  not-allowed: "<red>You may not do that."

  update:
    held: "<gold>Survival is restarting for an update.</gold> <gray>Wait here — fight, if you like. You are sent back automatically as soon as it is up, usually in a minute or two."
    back: "<green>Survival is back — taking you there."

  welcome: "<gold>Welcome to the arena!</gold> <gray>Nothing you own on the survival server is at stake here. <click:run_command:'/arena leave'><yellow>[Back to survival]</yellow></click>"
  not-set-up: "<yellow>The arena is still being built. <click:run_command:'/arena leave'><yellow>[Back to survival]</yellow></click>"
  leaving: "<gray>Back to <white><server></white>…"

  queue:
    joined: "<green>Waiting for a <white><mode></white> fight with <white><kit></white>. <click:run_command:'/pvp leave'><red>[Leave the queue]</red></click>"
    left: "<gray>You left the queue."
    not-in: "<gray>You are not waiting for a fight."
    in-fight: "<red>Finish your fight first."
    no-pits: "<red>No pit is set up yet. An admin has to mark one."
    no-survival: "<red>Stakes and own gear need the survival server, which cannot be reached right now."
    bar-agreed: "<gold><mode></gold> <gray>·</gray> <white><kit></white> <gray>· with <white><others></white> · waiting for a free pit"
    bar: "<gold><mode></gold> <gray>·</gray> <white><kit></white> <gray>· place <white><place></white> of <white><waiting></white>, <white><needed></white> make a fight"
    open: "<gold><white><player></white> waits for a <white><mode></white> fight with <white><kit></white> <gray>(<white><waiting></white>/<white><needed></white>)</gray>. They won't wait forever. <click:run_command:'/pvp join <player> <fight>'><green>[Join]</green></click>"
    open-stake: "<gold><white><player></white> waits for a <white><mode></white> fight with <white><kit></white>, stake <white><stake></white> <gray>(<white><waiting></white>/<white><needed></white>)</gray>. <click:run_command:'/pvp join <player> <fight>'><green>[Join]</green></click>"
    join-gone: "<red><white><player></white> is not waiting any more. Somebody was quicker."
    join-yourself: "<gray>That is your own queue. You are already in it — patience."
    join-changed: "<red><white><player></white> is waiting for a different fight now. Look before you leap: the new one is announced on its own."

  fight:
    called-off: "<red>The fight is off: <white><who></white> could not be got ready (stake or gear). Nobody lost anything."
    round: "<gold>Round <white><round></white></gold> <gray>— <mode>"
    go: "<red><bold>FIGHT!"
    down:
      - "<gray><white><player></white> is out."
      - "<gray><white><player></white> hits the sand and stays there."
      - "<gray>The crowd groans — <white><player></white> is down."
    down-by:
      - "<gray><white><player></white> was beaten by <white><by></white>."
      - "<gray><white><by></white> sends <white><player></white> into the sand."
      - "<gray><white><player></white> never saw <white><by></white> coming."
      - "<gray>One clean blow from <white><by></white> and <white><player></white> is done."
      - "<gray><white><by></white> takes <white><player></white> down. The crowd roars."
    defeated-title: "<dark_red><bold>DEFEATED"
    defeated-by: "<gray>by <white><by></white>"
    victory-title: "<gold><bold>VICTORY"
    victory-subtitle: "<yellow><score>"
    left: "<gray><white><player></white> left the fight."
    round-won: "<yellow>Round to <white><winners></white>. <gray>(<score>)"
    won:
      - "<gold><bold>Victory</bold></gold> <gray>— <white><winners></white> won. <gray>(<score>)"
      - "<gold><bold>Victory</bold></gold> <gray>— the sand belongs to <white><winners></white>. <gray>(<score>)"
      - "<gold><bold>Victory</bold></gold> <gray>— <white><winners></white> leave the pit as champions. <gray>(<score>)"
    you-won:
      - "<gold><bold>Victory!</bold></gold> <yellow>The crowd is on its feet for you. <gray>(<score>)"
      - "<gold><bold>Victory!</bold></gold> <yellow>That was a fight they will talk about. <gray>(<score>)"
      - "<gold><bold>Victory!</bold></gold> <yellow>Not a scratch worth mentioning. Well fought. <gray>(<score>)"
      - "<gold><bold>Victory!</bold></gold> <yellow>The pit has a new name to fear: yours. <gray>(<score>)"
      - "<gold><bold>Victory!</bold></gold> <yellow>Glory, gold and bragging rights. <gray>(<score>)"
    you-lost:
      - "<red>Defeat.</red> <gray><white><winners></white> took this one. Next time, gladiator. <gray>(<score>)"
      - "<red>Defeat.</red> <gray>The sand was not on your side today. <gray>(<score>)"
      - "<red>Defeat.</red> <gray>Get up, dust off, go again. <gray>(<score>)"
    draw: "<yellow>A draw (<why>). Every stake goes back."
    time-left: "<yellow><white><seconds></white> seconds left — then it is a draw."
    watching: "<gray>You are out for this round. Watch until it is decided."
    stakes-back: "<gray>Every stake is on its way back to its owner."
    stakes-won: "<gold>You won <white><amount></white>! It is paid out on survival."

  waves:
    title: "<red>Wave <white><wave></white>"
    cleared: "<green>Wave <white><wave></white> cleared! The next one comes in five seconds."
    won:
      - "<gold><bold>Every wave beaten!</bold></gold> <gray>You cleared all <white><waves></white>."
      - "<gold><bold>Every wave beaten!</bold></gold> <gray>All <white><waves></white> waves, and still standing. Legendary."
      - "<gold><bold>Every wave beaten!</bold></gold> <gray>The beasts are done. You are not. (<white><waves></white> waves)"
    victory-title: "<gold><bold>SURVIVED"
    victory-subtitle: "<yellow>all <waves> waves"
    lost: "<red>The mobs won.</red> <gray>You got to wave <white><wave></white>."

  wallet:
    balance: "<gray>You have <amount><gray>. It is the same money as on survival."
    pay-usage: "<gray>/pay <player> <amount>"
    bad-amount: "<red><white><typed></white> is not an amount."
    nobody: "<red>Nobody called <white><player></white> is online, here or on survival."
    failed: "<red>That payment could not be confirmed — check /balance before trying again."
    confirm: "<yellow>Send <amount><yellow> to <white><player></white>? <click:run_command:'/pay <player> <typed> confirm'><green>[Pay]</green></click>"
    got: "<green><white><player></white> paid you <amount><green>."
    unavailable: "<red>Money lives on survival, and survival cannot be reached right now."

  spectate:
    watching: "<gray>Watching. <click:run_command:'/arena hub'><yellow>[Back to the hub]</yellow></click>"
    nothing: "<red>That player is not in a fight you can watch."

  stats:
    line: "<gold><player></gold> <gray>— wins <white><wins></white>, losses <white><losses></white>, draws <white><draws></white>, kills <white><kills></white>, defeats <white><deaths></white>, best wave <white><wave></white>"
    none: "<gray><white><player></white> has not fought in the arena yet."

  pvp:
    usage: "<gray>/pvp invite <player> [duel|sumo|naval|waves] [kit|own] [stake] [bo3]  ·  /pvp accept  ·  /pvp deny  ·  /pvp queue [mode] [kit]  ·  /pvp join <player>  ·  /pvp leave  ·  /pvp rematch"
    only-duels: "<red>An invite is for a duel, sumo, a naval battle or a mob run together. Teams and free for all come from the queue."

  naval:
    flood-title: "<aqua><bold>⚓ THE FLOOD"
    flood-subtitle: "<gray>Hold on to your boat."
    risen-title: "<dark_aqua><bold>The waters have risen"
    risen-subtitle: "<gray>Last one afloat wins."
    no-water: "<red>This pit cannot hold water, so the naval battle is off. Nobody lost anything. <gray>Staff: the pit needs a floor box and spawns."

  rematch:
    offer: "<gray>Again against <white><others></white>? Same kit, same rounds, same stake. <click:run_command:'/pvp rematch'><gold>[Rematch]</gold></click> <dark_gray>(a minute to decide)"
    waiting: "<green>Rematch asked. Now <white><others></white> has to want it too."
    asked: "<gold><white><player></white> wants a rematch. Revenge, or a second humiliation? <click:run_command:'/pvp rematch'><gold>[Rematch]</gold></click>"
    starting: "<green>Rematch! It starts as soon as a pit is free."
    none: "<gray>There is no fight to have again. Lose one first."
    expired: "<gray>Too late — the rematch offer ran out. <white>/pvp invite</white> asks again."
    gone: "<red>Somebody from that fight is gone, so there is no rematch."
    left: "<gray>Your opponent left. No rematch — call it a win."

  invite:
    sent: "<green>Asked <white><player></white>. They have a minute to answer. <click:run_command:'/pvp cancel <id>'><red>[Cancel]</red></click>"
    sent-across: "<green>Asked <white><player></white> on survival. If they say yes, they are brought here. <click:run_command:'/pvp cancel <id>'><red>[Cancel]</red></click>"
    received: "<gold><white><player></white> asks you to a <white><mode></white> with <white><kit></white>, best of <white><rounds></white>, stake <white><stake></white>. <click:run_command:'/pvp accept <id>'><green>[Accept]</green></click> <click:run_command:'/pvp deny <id>'><red>[Decline]</red></click>"
    received-waves: "<gold><white><player></white> asks you to fight mob waves together with <white><kit></white>. <click:run_command:'/pvp accept <id>'><green>[Accept]</green></click> <click:run_command:'/pvp deny <id>'><red>[Decline]</red></click>"
    accepted: "<green><white><player></white> said yes! The fight starts as soon as a pit is free."
    accepted-across: "<green><white><player></white> said yes and is on the way from survival."
    coming: "<green><white><player></white> is being brought over from survival. The fight starts when they are here."
    waiting: "<gray>Your fight starts as soon as everybody in it is here."
    declined: "<yellow><white><player></white> said no."
    you-declined: "<gray>You said no to <white><player></white>."
    gone: "<red>That invite is no longer there."
    you-cancelled: "<gray>You took back your invite to <white><player></white>."
    cancelled: "<yellow><white><player></white> took their invite back."
    nothing-to-cancel: "<gray>You have no open invite to take back."
    you-accepted: "<green>You said yes to <white><player></white>! The fight starts as soon as a pit is free."
    already: "<gray>You already said yes to that one — the fight starts as soon as a pit is free."
    pit-wait: "<yellow>Every pit is in use right now. Your fight is next and starts the moment one is free."
    none: "<gray>Nobody has asked you to a fight."
    which: "<yellow>More than one invite is open — click the one you mean, or type /pvp accept <id>."
    refuse:
      self: "<red>You cannot fight yourself."
      unknown: "<red>Nobody called <white><player></white> is online, here or on survival."
      no-kit: "<red>There is no kit called <white><kit></white>."
      you-busy: "<red>Finish your fight first."
      busy: "<red><white><player></white> is in a fight right now."
      already: "<yellow>You have already asked <white><player></white>."
      stake: "<red>A stake has to be between nothing and <white><most></white>."

  admin:
    usage: "<gray>/arena admin build <world> <map>  ·  sethub [world x y z yaw pitch]  ·  pit <name> floor <world x1 y1 z1 x2 y2 z2> | spawn [world x y z yaw pitch] | clearspawns | remove  ·  info"
    bad-place: "<red>A place is <white>world x y z</white>, optionally yaw and pitch — or stand where you mean and give none."
    bad-box: "<red>A floor is <white>world x1 y1 z1 x2 y2 z2</white>."
    not-an-arena-world: "<red><white><world></white> is not one of the arena's worlds. Build one with /arena admin build."
    no-such-map: "<red>There is no <white><map></white> in plugins/RainsArena/maps."
    map-unreadable: "<red><white><map></white> could not be read as a schematic. The console says why."
    world-refused: "<red>The server would not make the world <white><world></white>."
    building: "<gray>Building <white><map></white> into <white><world></white>…"
    built: "<green><white><world></white> is built: <white><blocks></white> blocks."
    left-out: "<yellow>Blocks from mods were left out: <white><blocks></white>."
    not-saved: "<red>That could not be saved to layout.yml. It holds until the next restart."
    hub-set: "<green>The hub is set."
    floor-set: "<green>The floor of pit <white><pit></white> is set."
    spawn-added: "<green>Pit <white><pit></white> has <white><spawns></white> spawn point(s)."
    spawns-cleared: "<green>The spawn points of pit <white><pit></white> are cleared."
    pit-removed: "<green>Pit <white><pit></white> is gone."
    no-such-pit: "<red>There is no pit called <white><pit></white>."
    pit-elsewhere: "<red>Pit <white><pit></white> is in <white><world></white>; mark it there."
    kit-saved: "<green>Kit <white><kit></white> is saved from what you hold."
    kit-removed: "<green>Kit <white><kit></white> is gone."
    kit-reserved: "<red>'own' means fighting in one's own gear; it cannot be a kit."
    held: "<green><white><count></white> player(s) wait here for survival to come back."
    returned: "<green><white><count></white> player(s) sent back to survival."
    flood-usage: "<gray>/arena admin flood <pit> <dark_gray>— the naval flood without a fight, to watch it · <gray>/arena admin drain <pit>"
    flooded: "<green>Pit <white><pit></white> is flooded: <white><water></white> blocks of water, <white><seals></white> sealed. <gray>/arena admin drain <pit> puts it back."
    drained: "<green>Pit <white><pit></white> is dry again, every block as it was."
    pit-busy: "<red>Pit <white><pit></white> is in use — a fight, or water still in it."
    board-placed: "<green>The leaderboard floats here now. It fills within half a minute."
    board-removed: "<gray>The leaderboard nearest to you is gone."
    board-none: "<red>No leaderboard within five blocks."
    board-usage: "<gray>/arena admin board place  ·  /arena admin board remove"
    npc-usage: "<gray>/arena admin npc place <lanista|beastmaster|armorer|herald|gatekeeper|watcher> [world x y z yaw]  ·  /arena admin npc remove"
    npc-placed: "<green>The <white><role></white> stands where you stand."
    npc-removed: "<green>The <white><role></white> is gone."
    npc-none: "<red>No gladiator within five blocks."
    info:
      head: "<gold>Arena</gold> <gray>— <white><worlds></white> world(s), <white><pits></white> pit(s), hub in <white><hub></white>"
      world: "<gray> world <white><world></white> from <white><map></white>, <white><box></white>"
      pit: "<gray> pit <white><pit></white> in <white><world></white>, <white><spawns></white> spawn(s), <white><ready></white>"
      maps: "<gray> maps: <white><maps></white>"
