# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.

arena:
  welcome: "<gold>Arena.</gold> <gray>Your survival inventory is not affected here. <click:run_command:'/arena leave'><yellow>[Back to survival]</yellow></click>"
  queue:
    open: "<gold><white><player></white> is waiting for a <white><mode></white> fight with <white><kit></white> <gray>(<white><waiting></white>/<white><needed></white>)</gray>. <click:run_command:'/pvp join <player> <fight>'><green>[Join]</green></click>"
    join-gone: "<red><white><player></white> is no longer waiting."
    join-yourself: "<gray>You are already waiting in that queue."
    join-changed: "<red><white><player></white> is now waiting for a different fight, so you were not added."
  rematch:
    asked: "<gold><white><player></white> wants a rematch. <click:run_command:'/rematch'><gold>[Rematch]</gold></click>"
    none: "<gray>There is no recent fight to repeat."
    expired: "<gray>The rematch offer has expired. <white>/pvp invite</white> asks again."
    left: "<gray>Your opponent left, so there is no rematch."
