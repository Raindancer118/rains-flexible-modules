# Rain's Warps — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins, and so
# does a host's bundled wording. See Messages.defineFrom.
#
# Two things MessagesTest holds against this file, both of which have gone wrong before:
#
#   - Every placeholder a line asks for is supplied where it is sent, and nothing is supplied in
#     vain. An unfilled <count> is printed as written, mid-sentence, and reads to a player as a
#     broken plugin rather than as two files disagreeing.
#   - Nothing here is YAML's idea of a truth value. A bare on, off, yes or no is a boolean, and a
#     message that has become one prints its own key to somebody's face.
warps:

  # ---------------------------------------------------------------- going somewhere
  unknown: "<red>There is no warp called <white><name></white>."
  world-missing: "<yellow><name></yellow> is in a world that is not loaded right now."
  on-cooldown: "<yellow>You can warp again in <white><time></white>."
  warming-up: "<gray>Off to <white><name></white> in <white><seconds></white>… stand still."
  arrived: "<green>Here you are: <white><name></white>. Mind the landing."
  already-travelling: "<yellow>You are already on your way somewhere."
  nowhere-safe: "<red>There is nowhere safe to put you at <white><name></white>."
  could-not-check: "<red>The ground at <white><name></white> could not be checked."
  teleport-refused: "<red>Something stopped you arriving at <white><name></white>."
  cannot-schedule: "<red>The server cannot send you anywhere just now."
  only-a-player: "<red>Only somebody standing in the world can warp."

  cancelled:
    moved: "<yellow>You moved, so you are staying put."
    hurt: "<yellow>Something hit you, so you are staying put."

  # ---------------------------------------------------------------- the list
  list-empty: "<gray>There are no warps yet. A blank map, waiting for someone."
  list-heading: "<gray><count> warp(s):"
  list-row: "<dark_gray>  <white><name></white> <dark_gray>— <gray><world> <where> <dark_gray>(<category>)"
  none-for-you: "<gray>None of this server's warps is for you yet."
  how-to-make-one: "<gray>Stand where you want it and type <white>/warp set <somebody's name for it></white>."

  # ---------------------------------------------------------------- making and changing
  created: "<green><white><name></white> is set, here."
  replaced: "<green><white><name></white> now points here instead."
  moved: "<green><white><name></white> has moved here. Everything else about it is unchanged."
  deleted: "<green><white><name></white> is gone."
  access-set: "<green><white><name></white>: <white><access></white>."
  access-empty: "<red>That is not a permission a warp can ask for."
  categorised: "<green><white><name></white> is filed under <white><category></white>."
  uncategorised: "<green><white><name></white> is out of every category."
  labelled: "<green><white><name></white> is shown as <white><label></white>. People still type <white><name></white>."
  unlabelled: "<green><white><name></white> is called by its name again."
  icon-set: "<green><white><name></white> shows as <white><icon></white>."
  not-yours: "<red>Warps are not yours to change."
  too-many: "<red>This server already has its <white><limit></white> warps. Delete one first."
  no-such-item: "<red>There is no item called <white><item></white>. Check the spelling."
  set-needs-a-player: "<red>A warp is set where somebody is standing, so only a player can do it."
  busy: "<yellow>Something else is already waiting for an answer from you."

  ask-name: "<gray>Type what to call this warp, or <white>cancel</white>."
  ask-category: "<gray>Type what to file it under, or <white>cancel</white>."
  ask-label: "<gray>Type what the menu should show for it, or <white>cancel</white>."
  ask-visit-fee: "<gray>Type what a visit should cost, like <white>5</white> or <white>1.5k</white>, <white>off</white> for free, or <white>cancel</white>."
  ask-permission: "<gray>Type the permission it should need, or <white>cancel</white>."

  # A name is refused for four different reasons and each says which, because "that name will not do"
  # is the answer people try four more spellings against.
  name:
    empty: "<red>A warp needs a name. 'Unnamed' does not count."
    too-long: "<red>That is too long for a warp: <white><limit></white> characters at most."
    bad-characters: "<red>A warp's name may have letters, digits, dashes and underscores in it, and nothing else."
    reserved: "<red><white><name></white> is a word <white>/warp</white> reads as an instruction, so nothing could ever warp there. Pick another name."

  # ---------------------------------------------------------------- warps people own
  cannot-make: "<red>You cannot set warps of your own. A <white>warp token</white> would let you."
  own-limit: "<red>You already have <white><limit></white> warp(s) of your own. Delete one, or use a warp token."
  name-taken: "<red><white><name></white> is somebody else's warp. Pick another name."
  not-your-warp: "<red><white><name></white> is not yours to change."
  access-not-yours: "<red>A warp of your own is for everybody, or for you and the people you add. Staff-only and permissions are the staff's to hand out."
  given: "<green><white><name></white> now belongs to <white><player></white>."
  member-added: "<green><white><player></white> may now use <white><name></white>."
  member-removed: "<green><white><player></white> is off the list for <white><name></white>."
  no-such-player: "<red>Nobody called <white><player></white> has ever been here."
  not-online: "<red><white><player></white> is not online right now."

  # ---------------------------------------------------------------- claims' warps and homes
  claim:
    unknown: "<red>No claim warp called <white><name></white> that you may use."
    several: "<yellow>More than one claim is called <white><name></white>. Say whose: <white><which></white>"
    how: "<gray>A claim's owner sets its warp by standing inside it and typing <white>/claim warp</white>."
  home:
    none: "<red><white><player></white> has no main home you may warp to."

  # ---------------------------------------------------------------- warp tokens
  token:
    ask-name: "<gray>Type what to call your new warp, or <white>cancel</white>. It goes right where you stand."
    cancelled: "<gray>No warp set. Your token is still yours."
    gone: "<red>There is no warp token in your inventory any more."
    used: "<green>One warp token spent. Well placed."
    given: "<green>Gave <white><amount></white> warp token(s) to <white><player></white>."
    received: "<green>You got <white><amount></white> warp token(s). Right-click one where you want a warp."
    cannot-make: "<red>The warp token item could not be made. The console says why."

  # ---------------------------------------------------------------- the config page
  config:
    at-the-limit: "<yellow>That is as far as it goes: between <white><least></white> and <white><most></white>."
    refused: "<red><white><setting></white> would not take that value."
    ask-money: "<gray>Type the new amount, like <white>25</white> or <white>1.5k</white>, <white>0</white> for none, or <white>cancel</white>."

  # ---------------------------------------------------------------- usage
  usage:
    set: "<gray>/warp set <somebody's name for it>"
    config: "<gray>/warp config <dark_gray>— opens the page; there is nothing to type"
    move: "<gray>/warp move <which warp>"
    delete: "<gray>/warp delete <which warp>"
    category: "<gray>/warp category <which warp> [what to file it under]"
    label: "<gray>/warp label <which warp> [what the menu shows]"
    icon: "<gray>/warp icon <which warp> <which item>"
    access: "<gray>/warp access <which warp> <everybody | private | staff | own | a permission>"
    owner: "<gray>/warp owner <which warp> <whose it becomes>"
    member: "<gray>/warp member add|remove <which warp> <which player>"
    token: "<gray>/warp token [who] [how many]"
    fee: "<gray>/warp fee <which warp> <what a visit costs | off>"
    rent: "<gray>/warp rent <dark_gray>— what your warps owe, or <gray>/warp rent pay <which warp>"

  # ---------------------------------------------------------------- help
  #
  # Deliberately no placeholder-shaped words: MessagesTest cannot tell "<player>" meaning "type a
  # name here" from "<player>" meaning "something forgot to fill this in", so instruction is written
  # out in words.
  help:
    - "<gray>/warp <dark_gray>— the warps you can go to"
    - "<gray>/warp somewhere <dark_gray>— straight there"
    - "<gray>/warp list <dark_gray>— the same list, as text you can paste"
    - "<gray>/warp claim <dark_gray>— players' claims you may warp into"
    - "<gray>/warp home somebody <dark_gray>— the claim they call home"
  # ---------------------------------------------------------------- paying for it
  #
  # Only said when an owner has put a price on something. Every price defaults to nothing.
  create:
    cannot-afford: "<red>Making a warp costs <white><price></white>, which you do not have."
    no-economy: "<red>Making a warp costs money, and there is no economy on this server to pay with."
    refused: "<red>The payment for the warp was refused, so it has not been made."
    paid: "<gray><white><price></white> paid for the warp."
    costs: "<gray>Making a warp costs <white><price></white>, taken when it is set."
  fee:
    disabled: "<red>Owners may not charge to visit their warps on this server."
    cleared: "<green><white><name></white> is free to visit."
    bad-amount: "<red><white><amount></white> is not an amount. Try <white>5</white> or <white>1.5k</white>, or <white>off</white>."
    too-high: "<red>A visit may cost at most <white><max></white>."
    set: "<green>Visiting <white><name></white> now costs <white><price></white>. <dark_gray>The server keeps <cut>% of it."
  closed: "<red><white><name></white> is closed: its owner has not paid the rent."
  visit:
    cannot-afford: "<red>Visiting that warp costs <white><price></white>, which you do not have."
    no-economy: "<red>Visiting that warp costs money, and there is no economy on this server to pay with."
    refused: "<red>The payment for the visit was refused, so you are staying put."
    charged: "<gray>Paid <white><price></white> to visit <white><name></white>."
    refunded: "<gray><white><price></white> paid back."
  rent:
    collected: "<gray>Rent of <white><price></white> paid for <white><name></white>, which is covered until <white><until></white>."
    closed: "<red><white><name></white> is closed: its rent of <white><price></white> a week is unpaid. Pay with <white>/warp rent pay</white> and its name, or in <white>/warp mine</white>. Nothing is deleted."
    disabled: "<gray>There is no rent on warps here."
    not-charged: "<gray><white><name></white> pays no rent."
    nothing-owed: "<gray>Nothing to pay: <white><name></white> is covered until <white><until></white>."
    cannot-afford: "<red>The rent is <white><price></white>, which you do not have."
    no-economy: "<red>Rent is paid in money, and there is no economy on this server."
    refused: "<red>The payment was refused, so the warp stays closed."
    paid: "<green>Paid <white><price></white>. <white><name></white> is open again and covered until <white><until></white>."
    status-open: "<gray><white><name></white> <dark_gray>— covered until <until> (<price> a week)"
    status-closed: "<red><white><name></white> <dark_gray>— closed, rent unpaid (<price> a week)"
    none: "<gray>None of your warps pays rent. Rent is <white><price></white> a week on warps made while it is on."

  help-own:
    - "<gray>/warp mine <dark_gray>— your own warps, and the page to change them"
    - "<gray>/warp set somewhere <dark_gray>— a warp of your own, right here"
    - "<gray>/warp access somewhere private <dark_gray>— only you and the people you add"
    - "<gray>/warp member add somewhere somebody <dark_gray>— let somebody in"
    - "<gray>/warp fee somewhere 5 <dark_gray>— charge visitors, where the server allows it"
    - "<gray>/warp rent <dark_gray>— what your warps owe, where the server charges rent"
  help-admin:
    - "<gray>/warp admin <dark_gray>— every warp there is, and what can be changed"
    - "<gray>/warp set, move, delete <dark_gray>— by hand, without the menu"
    - "<gray>/warp access <dark_gray>— everybody, staff only, its own permission, or one you name"
    - "<gray>/warp config <dark_gray>— what a warp costs, and what travels with somebody"
    - "<gray>/warp owner <dark_gray>— give a warp to a player, who can then change it"
    - "<gray>/warp token <dark_gray>— hand out warp tokens"

  manual:
    using:
      - "<gray>A warp is somewhere with a name that anybody can be sent to."
      - "<gray>Click one to go to it."
      - ""
      - "<gray>You have to stand still for <white><warmup></white> seconds first,"
      - "<gray>and there are <white><cooldown></white> seconds between warps."
      - ""
      - "<dark_gray>Some warps are only for the staff, or for whoever"
      - "<dark_gray>has been given one particular permission. Those are"
      - "<dark_gray>not on this list at all unless you are one of them."
    config:
      - "<gray>What this server does about warps."
      - ""
      - "<gray>Every click here is written to disk at once, so"
      - "<gray>there is no Apply button to forget."
      - ""
      - "<dark_gray>The same settings as /settings, which has them"
      - "<dark_gray>filed under warps — this is the one page about"
      - "<dark_gray>warps rather than the whole server's tree."
      - ""
      - "<dark_gray>What travels with somebody never includes another"
      - "<dark_gray>player, whatever these say. A player moved somewhere"
      - "<dark_gray>they did not ask to go is a teleport nobody agreed"
      - "<dark_gray>to, and on a PvP server it is a weapon."
    editing:
      - "<gray>Everything about one warp."
      - ""
      - "<gray>Moving it keeps who it is for, what it is filed"
      - "<gray>under and what it looks like. Setting it again"
      - "<gray>under the same name keeps whose it is and who it"
      - "<gray>is for, but not its category or its look."
      - ""
      - "<dark_gray>What people type never changes when you relabel it:"
      - "<dark_gray>a permission may have been written against the name."
